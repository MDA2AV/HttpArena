        if(resilCol()){ var ra=resilAgg(r.fw); k+=kv('Resilience', ra<0?'—':Math.round(ra*100)+'%', ra<0?'na':''); }
        var n=0, tot=0, cells=[];
        pids.forEach(function(pid){ var c=r.cells[pid]; if(scoredForType(pid,lt)) tot++; if(c){ if(c.c) n++; cells.push([pid,c]); } });
        k+=kv('Profiles', n+' of '+tot);
        // the entry's strongest columns, by share of the column leader
        cells.sort(function(a,b){ return b[1].bar-a[1].bar; });
        cells.slice(0, 8-(k.split('<div>').length-1)).forEach(function(pc){
          var c=pc[1]; k+=kv(PROF[pc[0]].label, (c.score!=null?c.score.toFixed(1):fmtK(c.rps))+(c.best?' ★':''));
        });
      }
      return '<div class="card'+(favs.has(r.fw)?' fav':'')+(rank===1?' lead':'')+'" data-fw-row="'+esc(r.fw)+'">'
        + cardHead(r.fw, rank, r.lang, t)
        + '<div class="card-main"><b>'+r.score.toFixed(0)+'</b>'+cmpDelta(r)+'<span>'+(all?'overall':'composite')+'</span></div>'
        + '<div class="bar"><i style="width:'+Math.max(pct,2).toFixed(0)+'%"></i></div>'
        + '<div class="card-k">'+k+'</div></div>';
    }).join('')+CARDS_NOTE+'</div>';
  }
  function profileCards(rows, rankMap, maxRps){
    var latp=isLatProfile(state.profile);
    return '<div class="cards">'+rows.map(function(r){
      var rank=rankMap[r.fw], t=typeOf(r.fw);
      var pct=maxRps>0?Math.max((r.rps||0)/maxRps*100,(r.rps>0?1.5:0)):0, ls=latp?latScore(state.profile,r.fw):0;
      var k=kv('p99', esc(r.p99_latency||'-'))+kv('Avg', esc(r.avg_latency||'-'))
        + (latp ? kv('CPU / req', r.cpu_per_req_us!=null?esc((+r.cpu_per_req_us).toFixed(2))+' µs':'-') : kv('CPU', esc(r.cpu||'-')))
        + kv('Memory', esc(r.memory||'-'));
      return '<div class="card'+(favs.has(r.fw)?' fav':'')+(rank===1?' lead':'')+'" data-fw-row="'+esc(r.fw)+'">'
        + cardHead(r.fw, rank, r.lang||'', t)
        + (latp ? '<div class="card-main"><b>'+(ls?ls.toFixed(1):'-')+'</b><span>score · '+fmt(r.rps||0)+' req/s</span>'+statusHtml(r)+'</div>'
                 + '<div class="bar"><i style="width:'+Math.max(ls,1).toFixed(0)+'%"></i></div>'
                : '<div class="card-main"><b>'+fmt(r.rps||0)+'</b><span>req/s</span>'+statusHtml(r)+'</div>'
                 + '<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>')
        + '<div class="card-k">'+k+'</div></div>';
    }).join('')+CARDS_NOTE+'</div>';
  }

  // Keyboard: j/k walk the rows of whatever is drawn (table rows, grid rows or
  // cards all carry data-fw-row), and the cursor survives a redraw by name.
  var KBCUR=null;
  function kbList(){ return Array.prototype.slice.call(document.querySelectorAll('#rows [data-fw-row]')); }
  function kbEl(){ var l=kbList(); for(var i=0;i<l.length;i++) if(l[i].getAttribute('data-fw-row')===KBCUR) return l[i]; return null; }
  function kbRestore(){ if(KBCUR==null) return; var el=kbEl(); if(el) el.classList.add('kb'); else KBCUR=null; }
  function kbMark(el){
    kbList().forEach(function(x){ x.classList.remove('kb'); });
    if(!el){ KBCUR=null; return; }
    el.classList.add('kb'); KBCUR=el.getAttribute('data-fw-row');
    var wrap=document.getElementById('cwrap');
    if(wrap && wrap.contains(el) && wrap.scrollHeight>wrap.clientHeight+2){
      var th=wrap.querySelector('thead'), hh=th?th.offsetHeight:0;
      var wr=wrap.getBoundingClientRect(), er=el.getBoundingClientRect();
      if(er.top<wr.top+hh) wrap.scrollTop-=(wr.top+hh-er.top);
      else if(er.bottom>wr.top+wrap.clientHeight) wrap.scrollTop+=(er.bottom-wr.top-wrap.clientHeight);
      if(wr.bottom>window.innerHeight || wr.top<0) wrap.scrollIntoView({block:'nearest'});
    } else if(el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  }
  function kbMove(d){
    var l=kbList(); if(!l.length) return;
    var i=-1; for(var j=0;j<l.length;j++) if(l[j].getAttribute('data-fw-row')===KBCUR){ i=j; break; }
    i = i<0 ? (d>0?0:l.length-1) : Math.max(0, Math.min(l.length-1, i+d));
    kbMark(l[i]);
  }
  function initKeys(){
    window.HA_KEYS=[['Leaderboard', [
      [['j','k'],'Next / previous row'], [['Enter'],'Open the entry card'], [['o'],'Open the entry’s results page'],
      [['f'],'Favourite the row'], [['c'],'Compare the row head to head'], [['s'],'Filter entries'],
      [['1','…','7'],'Overall, H/1.1, H/2, H/3, Gateway, gRPC, WebSocket'], [['[',']'],'Previous / next connection count'],
      [['h'],'Heat map'], [['m'],'Memory efficiency'], [['r'],'Rescale to selection'],
      [['d'],'Density'], [['v'],'Display menu'], [['y'],'Copy link to this view'], [['Esc'],'Clear the cursor, close panels']
    ]]];
    document.addEventListener('keydown', function(e){
      if(e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      var t=e.target, tag=t&&t.tagName, k=e.key;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
      if(window.HA && HA.overlayOpen && HA.overlayOpen()) return;
      var mod=document.getElementById('modal'); if(mod && mod.classList.contains('open')) return;
      if((tag==='BUTTON'||tag==='A'||(t&&t.getAttribute&&t.getAttribute('role')==='button')||(t&&t.matches&&t.matches('td.spec'))) && (k==='Enter'||k===' ')) return;
      var cur=KBCUR!=null?kbEl():null, used=true;
      if(k==='j' || (k==='ArrowDown' && cur)) kbMove(1);
      else if(k==='k' || (k==='ArrowUp' && cur)) kbMove(-1);
      else if(k==='Enter' && cur) openModal(KBCUR);
      else if(k==='o' && cur) location.href='/frameworks/'+encodeURIComponent(slugOf(KBCUR))+'/';
      else if(k==='f' && cur) toggleFav(KBCUR);
      else if(k==='c') location.href='/compare/all/'+(cur?'#'+encodeURIComponent(KBCUR):'');
      else if(k==='s'){ var q=document.getElementById('q'); q.focus(); q.select(); }
      else if(k>='1' && k<='7' && k.length===1) pickScope(SCOPES[+k-1].k);
      else if(k==='h' && state.view==='composite') document.getElementById('heatBtn').click();
      else if(k==='m' && state.view==='composite'){ state.useMem=!state.useMem; renderHead(); render(); }
      else if(k==='r' && state.view==='composite'){ state.rescale=!state.rescale; renderHead(); render(); }
      else if((k==='['||k===']') && state.view==='profile'){
        var cs=PROF[state.profile].conns, ci=cs.indexOf(state.conns)+(k===']'?1:-1);
        if(ci>=0 && ci<cs.length){ state.conns=cs[ci]; renderHead(); render(); }
      }
      else if(k==='d'){ setDensity(density()==='compact'?'comfortable':'compact'); if(window.HA&&HA.toast) HA.toast('Density: '+density()); }
      else if(k==='v') document.getElementById('dispBtn').click();
      else if(k==='y') copyViewLink();
      else if(k==='Escape' && cur) kbMark(null);
      else used=false;
      if(used) e.preventDefault();
    });
    // What the command palette calls instead of reloading the page on a view change.
    window.HA_BOARD={ scope:pickScope, profile:pickProfile, open:openModal,
      has:function(fw){ return !!D.meta[fw]; } };
  }

  // ── hardware chips ──────────────────────────────────────
  function shortCpu(s){ return String(s).replace(/\s*\d+-Cores?$/i,'').replace(/\(R\)|\(TM\)/g,'').trim(); }
  function hw(){
    var c=D.current||{};
    var chips=[];
    if(c.cpu) chips.push('<span class="chip"><b>'+(c.cores||'')+'</b> cores · '+esc(shortCpu(c.cpu))+'</span>');
    if(c.ram) chips.push('<span class="chip"><b>'+esc(c.ram)+'</b> RAM</span>');
    if(c.kernel) chips.push('<span class="chip">Linux '+esc(c.kernel)+'</span>');
    else if(c.os) chips.push('<span class="chip">'+esc(c.os)+'</span>');
    document.getElementById('hw').innerHTML=chips.join('');
  }

  // ── theme ───────────────────────────────────────────────
  function initTheme(){
    var saved=null; try{ saved=localStorage.getItem('lb-theme'); }catch(e){}
    if(saved) document.documentElement.setAttribute('data-theme',saved);
    document.addEventListener('ha:theme', function(){ render(); });
  }
  document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value.trim(); render(); });

  // ── boot ────────────────────────────────────────────────
  document.getElementById('rows').addEventListener('click', function(e){
    var s=e.target.closest('.star'); if(s){ e.preventDefault(); e.stopPropagation(); toggleFav(s.getAttribute('data-fw')); return; }
    if(e.target.closest('a')) return;
    // A Spec cell's click pins its panel (initSpecPanel); opening the entry's
    // modal on top would cover the panel and take the click meant for its link.
    if(e.target.closest('td.spec')) return;
    if(e.target.closest('[data-clear]')){ clearFilters(); return; }
    var mvb=e.target.closest('[data-mview]'); if(mvb){ setMview(mvb.getAttribute('data-mview')); return; }
    var row=e.target.closest('[data-fw-row]'); if(row) openModal(row.getAttribute('data-fw-row'));
  });
  try{ var _vt=['flagship','emerging','experimental','engine','infrastructure']; var _t=JSON.parse(localStorage.getItem('lb-types')||'null'); if(_t&&_t.length){ _t=_t.filter(function(x){return _vt.indexOf(x)>=0;}); if(_t.length) state.types=_t; } }catch(e){}
  document.getElementById('typeFilter').addEventListener('click', function(e){ var b=e.target.closest('button[data-type]'); if(!b) return; toggleType(b.getAttribute('data-type')); });
  try{ var _st=localStorage.getItem('lb-showtuned'); if(_st!==null) state.showTuned=_st==='1'; }catch(e){}
  try{ var _fc=localStorage.getItem('lb-fwcompact'); if(_fc!==null) state.compactFw=_fc==='1'; }catch(e){}
  document.getElementById('tunedToggle').addEventListener('click', function(){ state.showTuned=!state.showTuned; saveTuned(); render(); });
  restoreFromHash();
  initTips(); initSpecPanel(); initHeat(); initModal(); initDocLinks(); initSearchHelp(); initRounds(); initTheme(); initNavSearch(); initDisplay(); initMview(); initKeys(); hw(); buildNav(); renderHead(); render();
  document.body.classList.remove('booting','rl');
  (function(){ var b=document.getElementById('brandHome'); if(b) b.onclick=function(e){ e.preventDefault(); pickScope('h1'); }; })();
  window.addEventListener('hashchange', function(){ restoreFromHash(); buildNav(); renderHead(); render(); });
  var _rz, _wasPhone=isPhone(); window.addEventListener('resize', function(){ clearTimeout(_rz); _rz=setTimeout(function(){ var ph=isPhone(), flip=ph!==_wasPhone; _wasPhone=ph; if(state.view==='profile' || flip) render(); else if(state.view==='composite') syncTopScroll(); }, 150); });
});
</script>
