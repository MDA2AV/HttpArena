<script>
/* First paint, before the 1.2 MB of results arrive. The Old View (the plain
   table, html.maint) is the default: it starts from the server-rendered table,
   which is also what a no-JS reader and a crawler get. A reader who chose the
   Rack or the Aisle (sr-view) gets the pre-rendered ranking racked straight
   away instead. The address decides first, the way restoreFromHash() does. */
(function(){
  var rack=document.getElementById('rack'), tb=document.querySelector('#rows table.sb tbody'), hs=location.hash;
  var maint=true; try{ maint=localStorage.getItem('sr-view')!=='rack'; }catch(e){}
  if(/[#&]table=1/.test(hs)) maint=true;
  else if(/[#&](table=0|aisle=1|open=[^&])/.test(hs)) maint=false;
  document.documentElement.classList.toggle('maint', maint);
  if(!maint){
    // the view keys say Old View until the board boots; this is the Rack or the Aisle
    var aisle=/[#&]aisle=1/.test(hs);
    [['rackBtn',!aisle],['aisleBtn',aisle],['maintBtn',false]].forEach(function(k){ var b=document.getElementById(k[0]); if(b) b.setAttribute('aria-pressed', k[1]?'true':'false'); });
  }
  // the ranking pre-rendered is the default board's, so any address but the Rack's own changes what to rack
  var rest=hs.replace(/^#/,'').split('&').filter(function(s){ return s && s!=='table=0'; }).length;
  if(!rack||!tb||maint||rest||/[?&]round=/.test(location.search)) return;
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var h='', rows=tb.rows, n=Math.min(rows.length, 60);
  for(var i=0;i<n;i++){
    var c=rows[i].cells, rk=c[0].textContent, nm=c[1].textContent, lg=c[2].textContent, sc=c[3].textContent;
    h+='<div class="unit skel'+(i<3?' r'+(i+1):'')+'"><div class="ear l"><span class="upos">'+(i<9?'0':'')+(i+1)+'</span></div>'
      +'<div class="face"><span class="svc">'+esc(rk)+'</span><span class="uidslot"></span>'
      +'<span class="plate">'+(lg?'<span class="vend">'+esc(lg)+'</span>':'')+'<span class="nm">'+esc(nm)+'</span></span>'
      +'<span class="leds"><i class="led pwr"></i><i class="led"></i><i class="led"></i></span>'
      +'<span class="lcd"><b>'+esc(sc)+'</b></span><span class="bays"></span></div><div class="ear r"></div></div>';
  }
  rack.innerHTML=h;
})();
</script>

<!-- deferred so the browser can paint the pre-rendered ranking before it spends
     anything parsing 700KB of results. search.js is not here at all: it is the
     Knowledge Base index, 290KB for a search box most visits never touch, and
     initNavSearch() fetches it the first time someone uses it. -->
<script defer src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function lbBoot(){
  "use strict";
  // An archived round is the same board over another data set: ?round=<id>
  // loads rounds/<id>.js (written by gen_leaderboard_data.py), whose results,
  // profiles and hardware replace the current round's. Boot waits for it.
  var ROUND_ID = (location.search.match(/[?&]round=([A-Za-z0-9_-]+)/)||[])[1] || '';
  if(ROUND_ID && !lbBoot.waited){
    lbBoot.waited=true;
    var _rs=document.createElement('script'); _rs.src='rounds/'+ROUND_ID+'.js';
    _rs.onload=_rs.onerror=function(){ lbBoot(); };
    document.head.appendChild(_rs);
    return;
  }
  var D = window.LB_DATA;
  if(D && ROUND_ID && window.LB_ROUND){
    D = Object.assign({}, D, { current: window.LB_ROUND.current, profiles: window.LB_ROUND.profiles,
      results: window.LB_ROUND.results, runmeta: window.LB_ROUND.runmeta, achievements: window.LB_ROUND.achievements||{} });
  } else { ROUND_ID=''; }
  // The copy under the board is pre-rendered from the current round, so it
  // would describe the wrong machine and ranking under an archived one.
  if(ROUND_ID){ var _seo=document.getElementById('boardSeo'); if(_seo) _seo.hidden=true; }
  var LB_DOCS = window.LB_DOCS || {};
  // Run-logs are deployed at /logs/ (the board is the root site). Locally,
  // serve site/ and open /leaderboard/ so ../static/logs/ reaches site/static/logs/.
  var LOGBASE = (location.protocol==='file:' || location.pathname.indexOf('/leaderboard/')>=0) ? '../static/logs/' : '/logs/';
  // Resolved now: the address of the page changes with the view (viewAddr).
  var SEARCH_SRC = new URL('search.js', location.href).href;
  // On the deployed board a view has an address of its own, /board/<view>/, so that a
  // link to it unfurls as that view: a preview is made from the path, and the hash never
  // reaches the server (build_view_pages in gen_leaderboard_data.py writes the pages).
  // A local checkout and an archived round have no such pages and keep the view in the hash.
  var VIEWS = !ROUND_ID && document.body.hasAttribute('data-views');
  // Keep whatever is already in #rows: the deploy pre-renders the default
  // ranking into it, and data.js failing to load is precisely when that
  // fallback earns its keep. Only an empty #rows (a local checkout that has
  // never run the generator) gets the build instruction.
  if(!D){ var _r=document.getElementById('rows');
          if(_r && !_r.firstElementChild) _r.innerHTML='<div class="empty">data.js not found - run scripts/gen_leaderboard_data.py</div>';
          return; }

  // ── maps ─────────────────────────────────────────────────
  var PROF = {}; D.profiles.forEach(function(p){ PROF[p.id]=p; });
  var FWLANG = {};
  Object.keys(D.results).forEach(function(k){ D.results[k].forEach(function(r){ if(r.lang) FWLANG[r.fw]=r.lang; }); });

  var COMPOSITE = '__composite__';
  // 'all' is the overall composite (computeOverall): the families below it
  // added up, one column each. Listed first so it heads the Composite menu.
  var SCOPE_TITLE={all:'Overall web server benchmarks',h1:'HTTP/1.1 web server benchmarks',h2:'HTTP/2 web server benchmarks',h3:'HTTP/3 web server benchmarks',gw:'Gateway and production stack benchmarks',grpc:'gRPC server benchmarks',ws:'WebSocket server benchmarks',db:'Database-backed web server benchmarks'};
  var SCOPES = [{k:'all',label:'Overall'},{k:'h1',label:'H/1.1'},{k:'h2',label:'H/2'},{k:'h3',label:'H/3'},{k:'gw',label:'Gateway'},{k:'grpc',label:'gRPC'},{k:'ws',label:'WebSocket'},{k:'db',label:'Database'}];
  function scopeLabel(k){ for(var i=0;i<SCOPES.length;i++) if(SCOPES[i].k===k) return SCOPES[i].label; return k; }
  function familyOf(p){ return {'Gateway':'gw','HTTP/2':'h2','HTTP/3':'h3','gRPC':'grpc','WebSocket':'ws','Database':'db'}[p.category]||'h1'; }
  // A board with no results at all says so instead of blaming the filter. The Database board
  // started over when its tests got CPUs of their own for Postgres (#1715).
  function emptyMsg(){
    if(state.view==='composite' && state.scope!=='all' && !D.profiles.some(function(p){ return familyOf(p)===state.scope; }))
      return state.scope==='db'
        ? 'No results yet. The database tests were reset for their new CPU split; entries appear as they are re-run.'
        : 'No results on this board yet.';
    return 'No frameworks match this filter.';
  }
  // a detailed view with no results yet opens its family's board (the database tests after the reset)
  var EMPTY_PROF_FAMILY={'async-db':'db','fortunes':'db'};
  // cats must list every CATALOG category that belongs to the family. This is
  // the nav's only source of profiles, so a category missing here disappears
  // from Detailed Views entirely while still ranking on the composite --
  // which is how async and latency-1m went missing when they were added.

  var expanded=new Set(['composite']);

  var state = { view:'composite', profile:null, conns:null, sortKey:'score', sortDir:-1, types:['flagship','emerging'], q:'', lang:'', useMem:false, scope:'h1', showTuned:true, rescale:true, compactFw:false, heat:false, maint:true, aisle:false, open:'' };

  // ── parsing helpers ──────────────────────────────────────
  function lat(s){ if(!s) return Infinity; var m=String(s).match(/([\d.]+)\s*(us|ms|s)/); if(!m) return Infinity; var v=parseFloat(m[1]); return m[2]==='us'?v:m[2]==='ms'?v*1e3:v*1e6; }

  function mem(s){ if(!s) return 0; var m=String(s).match(/([\d.]+)\s*([KMG]i?B)/i); if(!m) return 0; var v=parseFloat(m[1]),u=m[2].toUpperCase(); return u[0]==='G'?v*1024:u[0]==='M'?v:u[0]==='K'?v/1024:v; }
  function bw(s){ if(!s) return 0; var m=String(s).match(/([\d.]+)\s*([KMG]?B)\/s/i); if(!m) return 0; var v=parseFloat(m[1]),u=m[2].toUpperCase(); return u[0]==='G'?v*1e9:u[0]==='M'?v*1e6:u[0]==='K'?v*1e3:v; }
  function typeOf(fw){ return (D.meta[fw] && D.meta[fw].type) || 'emerging'; }

  // What the word has to carry that the bar did not: tuned is not "a bit

  // A shield beside the name for an entry whose TLS was probed and came back

  var TLS_TIP = 'TLS verified - serves the certificate the harness mounts, negotiates TLS 1.3 with an AEAD cipher, and refuses SSLv3, TLS 1.0/1.1 and NULL, anonymous, export, RC4, DES and 3DES ciphers.';

  var TLS_CHECK_TIP = 'TLS hardened - opted into the TLS section and passed it: rotates its certificate without a restart and without dropping traffic, answers with and without SNI, closes at the TLS layer, and reports no HIGH or CRITICAL finding from the vulnerability suite.';
  // ── Compliance (Spec) column ─────────────────────────────

  // actix-websocket); gen_leaderboard_data.py has already joined them into
  // D.meta[fw].spec as {suite: {tool, p, t, f, w?, ns?, l?, c?, e?}}.
  var SPEC_SUITE={h1:'h1',h2:'h2',h3:'h3',ws:'ws'};
  var SPEC_LABEL={h1:'HTTP/1.1',h2:'HTTP/2',h3:'HTTP/3',ws:'WebSocket'};
  function specSuite(){ return state.view==='composite' ? (SPEC_SUITE[state.scope]||null) : null; }
  function specOf(fw){ var k=specSuite(), m=D.meta[fw]; return (k&&m&&m.spec&&m.spec[k])||null; }
  // Sort order: measured scores, then the ones that could not be measured, then

  function specRatio(s){ if(!s) return -1; if(s.e!=null||!s.t) return -0.5; return s.p/s.t; }
  // The panel a Spec cell opens: on hover, or pinned with a click so its links

  // links to the entry page, which explains every failure; a cell without a
  // score says why, or how an entry gets one.
  function specPanelHtml(fw, pinned){
    var k=specSuite(); if(!k) return '';
    var s=specOf(fw), label=SPEC_LABEL[k];
    var page='/frameworks/'+encodeURIComponent(slugOf(fw))+'/#spec';
    var h='<button class="sx" type="button" aria-label="Close">×</button>'
      + '<div class="dh">'+esc(fw)+'</div><div class="dsub">'+esc(label)+' protocol compliance</div>';
    if(!s){
      h+='<p>This entry does not run the '+esc(label)+' suite, so it has no score here.</p>'

    } else {
      var r=s.p/s.t;
      h+='<div class="sscore"><span class="sbig">'+(r===1?'100':(r*100).toFixed(1))+'%</span>'+s.p+' of '+s.t+' passed</div>'
       + '<table><tr><td class="k">Tool</td><td class="v">'+esc(s.tool)+'</td></tr>'
       + '<tr><td class="k">Failed</td><td class="v">'+s.f+'</td></tr>'

  function specCell(fw){

  // Hover shows the panel; a click (or Enter) pins it, so the pointer can move
  // into it and follow its links; a second click on the same cell, the close
  // button, Esc or a click anywhere else lets it go. Redrawing the table drops
  // the cell it was pinned to, so render closes it too (specPanelClose).
  var specPanelClose=function(){};
  function initSpecPanel(){
    var pan=document.createElement('div'); pan.id='spanel'; pan.setAttribute('role','dialog');
    document.body.appendChild(pan);
    var pinned=null;
    function place(td){
      var r=td.getBoundingClientRect(); pan.style.display='block';
      var w=pan.offsetWidth, h=pan.offsetHeight;
      var l=r.left+r.width/2-w/2, t=r.top-h-8;
      if(t<6) t=r.bottom+8;
      if(t+h>window.innerHeight-6) t=Math.max(6, window.innerHeight-h-6);
      l=Math.max(6, Math.min(l, window.innerWidth-w-6));
      pan.style.left=l+'px'; pan.style.top=t+'px';
    }
    function show(td, pin){
      var h=specPanelHtml(td.dataset.fw, pin);
      if(!h){ close(); return; }
      pan.innerHTML=h; pan.classList.toggle('pinned', !!pin); place(td);
      pinned=pin?td:null;
    }
    function close(){ pan.style.display='none'; pan.classList.remove('pinned'); pinned=null; }
    specPanelClose=close;
    function held(){ return pinned && document.body.contains(pinned); }
    function cellOf(e){ return e.target.closest?e.target.closest('.spec[data-fw]'):null; }
    function toggle(td){ if(held() && pinned===td) close(); else show(td, true); }
    document.addEventListener('mouseover', function(e){ if(held()) return; var td=cellOf(e); if(td) show(td, false); });
    document.addEventListener('mouseout', function(e){
      if(held()) return; var td=cellOf(e);

      var td=cellOf(e);

  }

  // ── Resilience (robustness) column ───────────────────────

  // ws:[pts,n]}, carrying only the surfaces an entry actually ran. The column
  // follows the board scope and shows that one surface - H1 on the H/1.1 view,
  // H2 on H/2, WS on WebSocket; scopes with no surface omit the column.
  var RESIL_SURF=[['h1','H1'],['h2','H2'],['ws','WS']];
  // The resilience column follows the board's current scope: the H/1.1 view shows
  // the H1 surface, H/2 the H2 surface, WebSocket the WS surface. Other scopes

  var RESIL_SCOPE={h1:['h1','H1'],h2:['h2','H2'],ws:['ws','WS']};
  function resilSurface(){ return state.view==='composite' ? (RESIL_SCOPE[state.scope]||null) : null; }

  // Search: comma-separated terms matched against name/language/engine. Positive
  // terms are OR'd; a "!term" excludes any match. Show if (no positive terms or

  function matchQ(fw, lang){
    var s=(state.q||'').toLowerCase().trim(); if(!s) return true;

    if(!terms.length) return true;

  }
  function typeAbbr(t){ return {flagship:'flagship', emerging:'emerging', experimental:'experimental', engine:'engine', infrastructure:'infra'}[t] || t; }
  var TYPE_TIP={

  var TIP={
    rps:'Peak requests per second (best of 3 runs).',

    score:'Composite - sum of normalized per-profile scores (each profile leader = 1000), less 2.5% for each of routing, middleware, request and response the entry does not do for you. The (-n) beside a score is what that cost it.',
    scoreWs:'Composite - sum of normalized per-profile scores (each profile leader = 1000). The completeness factor does not apply here: routing, middleware, request and response are the HTTP path, and this board is not measuring it.',
    scoreHelp:'How the composite is built: every scored profile is worth 1000 to the entry leading it - including the fixed-rate profiles, which are normalized on their own CPU-and-tails score rather than on requests per second. Those scores are summed, and the total is cut by 2.5% for each of routing, middleware, request and response the entry leaves to you — its completeness factor, ×1.00 down to ×0.90. Opens the scoring docs.',
    scoreHelpWs:'How the composite is built: every scored profile is worth 1000 to the entry leading it, and those scores are summed. The completeness factor that scales the HTTP boards is not applied here — its four axes are the HTTP request-to-response path, which this family does not measure. Opens the scoring docs.',

    scoreHelpAll:'How the overall is built: each family composite is computed exactly as on its own board - every scored profile worth 1000 to its leader - and the five are summed with no re-weighting, so a family counts for as many profiles as it scores. A family an entry does not serve adds nothing. Opens the scoring docs.',

  // Every field the published row carries for one framework on one profile,

  var DT_ROWS=[
    ['rps','Requests/sec',1],['cpu','CPU'],['cpu_per_req_us','CPU / req','us'],

  function dtipHtml(pid,fw,nc){

    var scored={}; (p.scoredConns||[]).forEach(function(c){scored[c]=1;});

    (p.conns||[]).forEach(function(c){

      blocks+='<div class="dc">'+(+c).toLocaleString()+' conn'

      var rm=(D.runmeta||{})[pid+'-'+c];

  // ── page search ─────────────────────────────────────────
  // Searches the Knowledge Base (titles + full body text) and every
  // leaderboard view. docs.js already ships the rendered HTML of every page,
  // so the index is built from what is already in memory — no fetch, no
  // prebuilt index file, no dependency. Built on the first keystroke and then
  // cached — it is only ~5 ms over the whole corpus, but there is no reason to
  // spend it on visitors who never search.
  var SIDX=null, SIDX_HAS_DOCS=false, SHITS=[], SSEL=-1;

  function buildSearchIndex(){
    // Rebuild once the Knowledge Base arrives: search.js is fetched lazily, so
    // an index built before it landed holds only profiles and views, and
    // memoizing that would make the docs permanently unsearchable.
    if(SIDX && (SIDX_HAS_DOCS || !window.LB_SEARCH)) return SIDX;
    SIDX=[]; SIDX_HAS_DOCS=!!window.LB_SEARCH;
    // Docs come from search.js — plain text prepared by the generator. They are
    // real pages now (/docs/<id>/), so a hit navigates out rather than rendering
    // in place; the entry carries its own crumb, so no tree walk is needed.
    (window.LB_SEARCH || []).forEach(function(e){
      var body=(e.d ? e.d + ' ' : '') + (e.x || '');
      SIDX.push({ kind:'doc', title:e.t, crumb:e.c, body:body,
                  tl:(e.t || '').toLowerCase(), bl:body.toLowerCase(),
                  go:(function(id){ return function(){ pickDoc(id); }; })(e.u) });
    });
    D.profiles.forEach(function(p){
      var body=p.blurb||'';
      SIDX.push({ kind:'view', title:p.label, crumb:'Detailed Views › '+p.category, body:body,
                  tl:(p.label+' '+p.id+' '+p.category).toLowerCase(), bl:body.toLowerCase(),
                  go:function(){ pickProfile(p.id); } });
    });
    SCOPES.forEach(function(sc){
      SIDX.push({ kind:'view', title:sc.label+' Composite', crumb:'Composite', body:'',
                  tl:(sc.label+' composite').toLowerCase(), bl:'',
                  go:function(){ pickScope(sc.k); } });
    });
    return SIDX;
  }
  // Every term must match somewhere (AND), title hits outrank body hits.
  function searchPages(q){
    var ql=q.toLowerCase(), terms=ql.split(/\s+/).filter(Boolean);
    if(!terms.length) return [];
    var out=[];
    buildSearchIndex().forEach(function(e){
      var score=0;
      for(var i=0;i<terms.length;i++){
        var t=terms[i], ti=e.tl.indexOf(t), bi=e.bl.indexOf(t);
        if(ti<0 && bi<0) return;
        score += ti===0 ? 60 : ti>0 ? 35 : 0;
        if(bi>=0) score+=5;
      }
      if(e.tl===ql) score+=50;
      if(e.kind==='view') score+=8;
      out.push({e:e, score:score, term:terms[0]});
    });
    out.sort(function(a,b){ return b.score-a.score || a.e.title.length-b.e.title.length; });
    return out.slice(0,25);
  }
  function snippet(body, term){
    if(!body) return '';
    var i=body.toLowerCase().indexOf(term);
    if(i<0) return esc(body.slice(0,110))+(body.length>110?'…':'');
    var s=Math.max(0,i-45), e=Math.min(body.length,i+term.length+75);
    return (s>0?'…':'')+esc(body.slice(s,i))+'<mark>'+esc(body.slice(i,i+term.length))+'</mark>'
          +esc(body.slice(i+term.length,e))+(e<body.length?'…':'');
  }
  function renderSearch(q){

    SHITS.forEach(function(hit,i){

  function sortBy(k){

  // ── type filter chips ───────────────────────────────────

  function saveTypes(){ try{ localStorage.setItem('lb-types', JSON.stringify(state.types)); }catch(e){} }

  // flagship/emerging/experimental combine (one framework pool); engine and

  var EXCLUSIVE_TYPES=['engine','infrastructure'];

    else { var i=s.indexOf(t); if(i>=0){ if(s.length>1) s.splice(i,1); } else { s.push(t); } }

  }

  // ── COMPOSITE scoring (mirrors the canonical board) ─────
  // Completeness: the four things a framework can do for you between an
  // arriving request and a finished response - route it, run middleware around
  // the handler, hand the request over already made (path and query parameters,
  // a body buffered or streamed) and build the response. Each one an entry does
  // not do costs it 2.5%, so the factor runs from x1.00 down to x0.90. It scales
  // the whole composite rather than any single profile, because it is a
  // property of the entry and not of a workload.
  //
  // There is deliberately no bonus half. Doing the work a framework exists to
  // do is the baseline, not a credit: the factor exists so a bare request
  // callback cannot out-rank a real framework on throughput it only has because
  // it does less. Nothing outside that request-to-response path counts - not
  // templating, not an ORM, not the ecosystem.
  //
  // Only the framework tiers are graded. Engine and infrastructure entries
  // implement none of the four - a raw-socket server has no router, a proxy has
  // no handler to run middleware around - which is why grading them is pointless
  // rather than generous: they would all take the same x0.90, leaving their
  // order untouched, and outOfLeague already keeps them from being normalized
  // against frameworks. So their factor is fixed at 1.
  //
  // Named positively rather than through isExclusiveType() so a future
  // exclusive tier defaults to ungraded, and so the orphan `production` type
  // scores neutral instead of being penalised.
  var CMP_TYPES=['flagship','emerging','experimental'];
  var CMP_AXES=['routing','middleware','request','response'];
  // The four axes are the path from an arriving HTTP request to a finished
  // response, so they only mean something on a board measuring that path. A
  // WebSocket echo has no route to match, no body to hand over and no response
  // to build - the handshake happened once and everything after it is frames -
  // and a gRPC call has all four, but the generated stub does them, not the
  // framework. On those two boards the factor is 1 for every entry, including
  // the 27 that also serve HTTP: what is being measured there is not the thing
  // the grade is about.
  var CMP_SCOPES_OUT=['ws','grpc'];
  // scope defaults to the board's own. The overall view passes each family it
  // adds up, so every family keeps the rule its own board applies.
  function cmpInScope(scope){ return CMP_SCOPES_OUT.indexOf(scope||state.scope)<0; }
  // Only an explicit false costs anything. An axis left undeclared reads as
  // done, so an entry submitted before the field existed is ungraded rather
  // than assumed to be missing all four, and `{middleware:false}` is the whole
  // declaration for an entry that only lacks middleware.
  function cmpDecl(fw){ var c=D.meta[fw]&&D.meta[fw].cmp; return (c&&typeof c==='object')?c:null; }

    var c=cmpDecl(fw); if(!c) return [];
    return CMP_AXES.filter(function(a){ return c[a]===false; });

    if(!cmpInScope(scope) || CMP_TYPES.indexOf(typeOf(fw))<0) return 1;
    return 1-0.025*cmpMissing(fw).length;
  }
  // Which profiles count toward the composite, per league. Frameworks use the
  // global `scored` flag, engines `engineScored`, infrastructure `infraScored`.
  //
  // Infrastructure is the one league whose set is not a subset of the framework
  // set: proxies are scored on Pipelined, which frameworks treat as
  // reference-only (#1058). So its flag is read on its own rather than behind
  // the `scored` short-circuit the way engineScored is - gating it would drop
  // the profile from the infra composite without anything saying so.
  function scoredForType(pid,t){
    var p=PROF[pid]; if(!p) return false;
    if(t==='infrastructure') return !!p.infraScored;
    if(p.scored===false) return false;

  // The league the current view ranks. The exclusive types name themselves; any

  function aggregate(){

      // too: they render as faded columns in the matrix, they just never enter
      // the framework composite sum (#1058). Load-bearing for infrastructure,

      // profile up if there is an average here for it.

    var fwset={}; pids.forEach(function(pid){ Object.keys(A.avg[pid]||{}).forEach(function(fw){fwset[fw]=1;}); });
    var rows=[];
    Object.keys(fwset).forEach(function(fw){
      if(excl(fw)) return;

        var rps=(A.avg[pid]&&A.avg[pid][fw])||0;

          var sc;
          if(isLatProfile(pid)){
            // The rate is pinned on this profile, so normalising it on rps puts
            // every entry that held the rate at 1000 and the column says nothing.
            // Its own 0-100 score, built from cost and both latency tails, is
            // what the cell ranks on instead. No memory bonus: the value is not
            // a throughput for the bonus to scale.
            //
            // Normalised against the leading score in the field, exactly as the
            // rps profiles are normalised against the leading rps, so the column
            // leader is worth 1000 here too. A flat x10 was the old behaviour and

  // re-weighted on top, so every scored profile is worth 1,000 to its leader

  }
  // Rows shaped like computeComposite's, with one cell per family instead of

  // ── render ──────────────────────────────────────────────
  // Why a row scored what it did. The completeness factor is the one part of
  // the composite that is not read off a benchmark, so it is always shown with
  // the raw sum it was applied to rather than folded silently into one number.
  // Only the framework tiers carry the factor at all. An engine or a reverse
  // proxy is not unassessed, it is out of scope for the question, so its row

  // never given.
  function cmpGraded(fw){ return cmpInScope() && CMP_TYPES.indexOf(typeOf(fw))>=0; }

  // range almost nothing occupies - measured over all 1,650 published cells the

    [0.75, 'rgb(240,120,32)', '50-75%'],
    [1.01, 'rgb(255,226,92)', 'over 75%']

  function cmpTip(r){

    if(!r.miss.length) return 'composite '+r.score.toFixed(1)+' - routing, middleware, request and response all covered, so nothing is deducted (x1.00)';
    return 'composite '+r.score.toFixed(1)+' = '+r.raw.toFixed(1)+' raw x '+cmpFactor(r.fw).toFixed(3)

  // (0) was noise on the large majority of rows and the ones that actually lost

  function render(){

  // ── deep linking via URL hash ───────────────────────────
  function writeHash(){

      return;
    }
    var p=[], ts=state.types.slice().sort().join(',');
    if(state.view!=='profile'){ if(state.useMem) p.push('mem=1');
      // Rescale is on by default, so it is written when off - and also whenever
      // the address spells out its leagues: a link with type= and no rescale= is
      // a ranking link (a rank badge), which opens with it off (restoreFromHash).

  // the generator never quite reaches its own number, so the threshold has to
  // sit below it. Mirrors FULL_RATE in scripts/latency_score.py.
  var LAT_FULL={'latency-1m':950000, 'latency-10k':9500, '8gbit':47500, 'connections-5m':1187500, 'connections-1m-tls':237500, 'connections-1m':237500};
  // Logical CPUs each fixed-rate profile is pinned to, per scripts/lib/profiles.sh:
  // cpuset 0-31,64-95 is 32 cores with both threads, so 64. Used to turn CPU-per-request
  // into "how much of the machine it was allowed did this take".
  var LAT_CPUS={'latency-1m':64, 'latency-10k':64, '8gbit':64, 'connections-5m':64, 'connections-1m-tls':64, 'connections-1m':64};
  // CPU microseconds per second / 1e6 = cores in use; over the allowance = 0-100%.
  function cpuTotPct(r,pid){
    if(r==null||r.cpu_per_req_us==null) return null;
    var q=r.rps||0; if(!(q>0)) return null;
    return (+r.cpu_per_req_us)*q/1e6/(LAT_CPUS[pid]||64)*100;
  }
  var LAT_W_CPU=0.50, LAT_W_P99=0.25, LAT_W_MEAN=0.25, LAT_DEC=3, LAT_MEAN_DEC=1;
  // The held-connection profiles (CON-1M, CON-1M-TLS, CON-5M) score what holding the
  // fleet costs, on four equal terms: CPU per request and peak memory as plain
  // ratios, p50 and p99 on the three-decade scale. Mirrors HELD in scripts/latency_score.py.
  var LAT_HELD={'connections-1m':1, 'connections-1m-tls':1, 'connections-5m':1};
  var HELD_W_CPU=0.25, HELD_W_MEM=0.25, HELD_W_P50=0.25, HELD_W_P99=0.25;
  var _latScores={};
  function isLatProfile(pid){ return Object.prototype.hasOwnProperty.call(LAT_FULL,pid); }
  function clamp01(v){ return v<0?0:v>1?1:v; }
  // CPU spans ~3.3x across rate-holders, so a plain ratio behaves over it.
  function latLinear(v,b){ return (!v||!b||v<=0||b<=0)?0:clamp01(b/v); }
  // The p99 tail spans five orders of magnitude, where a ratio would collapse
  // to zero for everyone but the leader. A three-decade scale keeps the field
  // separable and still charges a third of the term for every 10x. The mean is
  // the queueing signal (in-flight requests over the rate) and spans ~2x among
  // entries that answer without queueing, so it gets one decade: ten times the
  // best mean is a request spending nine tenths of its life waiting, worth 0.
  function latDecade(v,b,d){ d=d||LAT_DEC; return (!v||!b||v<=0||b<=0||!isFinite(v))?0:clamp01(1-Math.log(Math.max(v,b)/b)/Math.LN10/d); }
  // Build from the canonical result set when the caller has no rows of its own,
  // so the composite and the detail view agree on the same normalisation.
  function latEnsure(pid){
    if(_latScores[pid]) return;
    var p=PROF[pid], rows=[];
    if(p) p.conns.forEach(function(c){ rows=rows.concat(D.results[pid+'-'+c]||[]); });
    latBuild(pid, rows);
  }
  function latBuild(pid, rows){
    var out={}; _latScores[pid]=out;
    if(LAT_HELD[pid]){
      var hc=Infinity,hm=Infinity,h5=Infinity,h9=Infinity, hfull=LAT_FULL[pid]||1;
      rows.forEach(function(r){
        var c=+r.cpu_per_req_us, m=mem(r.memory), p5=lat(r.p50_latency), p9=lat(r.p99_latency);
        if(c>0) hc=Math.min(hc,c);
        if(m>0) hm=Math.min(hm,m);
        if(p5>0&&isFinite(p5)) h5=Math.min(h5,p5);
        if(p9>0&&isFinite(p9)) h9=Math.min(h9,p9);
      });
      rows.forEach(function(r){
        var rf=clamp01((r.rps||0)/hfull);
        out[r.fw]=100*rf*(HELD_W_CPU*latLinear(+r.cpu_per_req_us,hc)
                         +HELD_W_MEM*latLinear(mem(r.memory),hm)
                         +HELD_W_P50*latDecade(lat(r.p50_latency),h5,LAT_DEC)
                         +HELD_W_P99*latDecade(lat(r.p99_latency),h9,LAT_DEC));
      });
      return;
    }
    var bc=Infinity,bp=Infinity,bm=Infinity, full=LAT_FULL[pid]||1;
    rows.forEach(function(r){
      var c=+r.cpu_per_req_us, p=lat(r.p99_latency), m=lat(r.avg_latency);
      if(c>0) bc=Math.min(bc,c);
      if(p>0&&isFinite(p)) bp=Math.min(bp,p);
      if(m>0&&isFinite(m)) bm=Math.min(bm,m);
    });
    rows.forEach(function(r){
      var rf=clamp01((r.rps||0)/full);
      out[r.fw]=100*rf*(LAT_W_CPU*latLinear(+r.cpu_per_req_us,bc)
                       +LAT_W_P99*latDecade(lat(r.p99_latency),bp)
                       +LAT_W_MEAN*latDecade(lat(r.avg_latency),bm,LAT_MEAN_DEC));
    });
  }
  function latScore(pid,fw){ latEnsure(pid); return (_latScores[pid]||{})[fw]||0; }

  // What a profile's detail view ranks on. Everything here is "most requests
  // per second wins" except the latency-1m profile, which pins the rate: every
  // entry delivers the same rps by construction, so ordering on it sorts by
  // measurement noise. Its metric is the CPU each one spent to do it, and less
  // of that is better.
  function defProfileSort(id){ return isLatProfile(id) ? {k:'l1mscore',d:-1} : {k:'rps',d:-1}; }
  function profileCols(W){
    W=W||window.innerWidth;
    var c=[
      {k:'rank', w:'54px', min:0},
      {k:'fw', label:'Framework', w:'minmax(200px,2fr)', min:0, tip:TIP.fw}
    ];
    // Latency-1M declares its own set rather than taking the shared one and
    // appending to it. Adding four columns to the standard seven put the table's
    // minimum width past a laptop viewport, and the column that gave way was the
    // framework name, which sits on a minmax floor of 200px and simply truncated.
    //
    // Three of the shared columns carry nothing here anyway. Bandwidth is a fixed
    // function of a rate every entry is held to, so it reads the same for all of
    // them. CPU % is the sampled figure this profile exists to replace with an
    // exact one. Avg latency stays: it replaced p99.9 in the score and is the
    // queueing signal this view has to show. Dropping the other two buys the
    // name back ~200px and loses no information.
    if(LAT_HELD[state.profile]){
      c.push({k:'l1mscore', label:'Score', num:true, w:'92px', min:0, tip:'0-100. rateFactor \u00d7 (0.25\u00d7CPU per request + 0.25\u00d7memory + 0.25\u00d7p50 + 0.25\u00d7p99), each measured against the best in the field. rateFactor is 1 at 95% of the offered rate and falls proportionally below it. Higher is better.'});
      c.push({k:'rps', label:'Requests / sec', num:true, w:'minmax(150px,1fr)', min:0, tip:TIP.rps});
      // How much of the fleet was actually held: the rate cannot say it alone, since a connection that never opened sends nothing.
      c.push({k:'held', label:'Held', num:true, w:'104px', min:0, tip:'Connections still open at the end of the measured window: 1,000,000 is the whole fleet on CON-1M and CON-1M-TLS, 5,000,000 on CON-5M.'});
      c.push({k:'cpureq', label:'CPU / req', num:true, w:'110px', min:0, tip:'CPU microseconds the server spent per request, read exactly out of its cgroup rather than sampled. A quarter of the score - lower is better.'});
      c.push({k:'mem', label:'Mem', num:true, w:'92px', min:0, tip:'The server container\u2019s peak memory while it held the fleet. A quarter of the score - lower is better.'});
      c.push({k:'p50', label:'p50', num:true, w:'92px', min:0, tip:'Median latency, coordinated-omission corrected. A quarter of the score, on a three-decade scale against the best.'});
      c.push({k:'p99', label:'p99', num:true, w:'92px', min:0, tip:'99th-percentile latency, coordinated-omission corrected. A quarter of the score, on a three-decade scale against the best.'});
      c.push({k:'cputot', label:'CPU used', num:true, w:'100px', min:640, tip:'The same CPU cost read as a share of the 64 logical CPUs the profile pins: CPU-per-request \u00d7 the rate delivered. 100% would mean the entry saturated everything it was given.'});
      return c.filter(function(x){ return W>=x.min; });
    }
    if(isLatProfile(state.profile)){
      c.push({k:'l1mscore', label:'Score', num:true, w:'92px', min:0, tip:'0-100. rateFactor \u00d7 (0.50\u00d7CPU + 0.25\u00d7p99 + 0.25\u00d7mean), each measured against the best in the field. rateFactor is 1 at 95% of the offered rate and falls proportionally below it. Higher is better.'});
      c.push({k:'rps', label:'Requests / sec', num:true, w:'minmax(150px,1fr)', min:0, tip:TIP.rps});
      c.push({k:'cpureq', label:'CPU / req', num:true, w:'110px', min:0, tip:'CPU microseconds the server spent per request, read exactly out of its cgroup rather than sampled. This is the profile\u2019s metric - lower is better.'});
      c.push({k:'cputot', label:'CPU used', num:true, w:'100px', min:520, tip:'The same CPU cost read as a share of the machine this profile allows: CPU-per-request \u00d7 the rate delivered, over the logical CPUs the profile pins (64 for Latency-1M, Latency-10K and 8Gbit). 100% would mean the entry saturated everything it was given.'});
      c.push({k:'p99', label:'p99', num:true, w:'92px', min:0, tip:TIP.p99});
      c.push({k:'avg', label:'Avg', num:true, w:'92px', min:640, tip:'Mean latency, coordinated-omission corrected - the queueing signal, in-flight requests over the rate. Weighted at 0.25 in this profile\u2019s score; ten times the best mean scores zero on that term.'});
      c.push({k:'mem', label:'Mem', num:true, w:'86px', min:820, tip:TIP.mem});
      return c.filter(function(x){ return W>=x.min; });
    }
    c.push({k:'rps', label:'Requests / sec', num:true, w:'minmax(150px,1fr)', min:0, tip:TIP.rps});
    c.push({k:'bw', label:'Bandwidth', num:true, w:'112px', min:1024, tip:TIP.bw});
    if(state.profile==='json-comp') c.push({k:'bwreq', label:'BW / req', num:true, w:'100px', min:640, tip:'Bytes per request - lower means better compression.'});
    if(state.profile==='upload') c.push({k:'inbw', label:'In BW', num:true, w:'118px', min:640, tip:'Input bandwidth - bytes/sec the server ingests (upload throughput).'});
    c.push({k:'avg', label:'Avg', num:true, w:'92px', min:820, tip:TIP.avg});
    c.push({k:'p99', label:'p99', num:true, w:'92px', min:0, tip:TIP.p99});
    c.push({k:'cpu', label:'CPU %', num:true, w:'96px', min:1024, tip:TIP.cpu});
    c.push({k:'mem', label:'Mem', num:true, w:'86px', min:820, tip:TIP.mem});
    return c.filter(function(x){ return W>=x.min; });
  }
  function profileCell(k, r, x){
    if(k==='rank') return '<div class="c rank'+(x.rank<=3?' r'+x.rank:'')+'">'+x.rank+'</div>';
    if(k==='fw'){ var nm=esc(r.fw); return '<div class="c fw">'+starHtml(r.fw)+'<span class="tndslot">'+tunedPill(r.fw,'tnd')+'</span><span class="tsq tsq-'+x.t+'" data-tip="'+esc(typeTip(x.t))+'"></span><span class="lang" style="color:'+langInk(r.lang,x.dark)+'">'+esc(r.lang||'')+'</span><span class="nm">'+nm+'</span>'+tlsCheckBadge(r.fw)+'</div>'; }
    if(k==='rps'){ var pct=x.maxRps>0?Math.max((r.rps||0)/x.maxRps*100,(r.rps>0?1.5:0)):0; return '<div class="c meter"><span class="mtop"><span class="v'+(r.rps>0?'':' zero')+'">'+fmt(r.rps||0)+'</span>'+statusHtml(r)+'</span><span class="bar"><i style="width:'+pct.toFixed(1)+'%;background:rgba('+x.lc.rgb+','+(x.dark?0.55:0.42)+')"></i></span></div>'; }
    if(k==='bw') return '<div class="c num sub">'+esc(r.bandwidth||'-')+'</div>';
    if(k==='bwreq'){ var b=bw(r.bandwidth), q=r.rps||0; return '<div class="c num sub">'+(b>0&&q>0?fmtBytes(b/q):'-')+'</div>'; }
    if(k==='inbw') return '<div class="c num sub">'+esc(r.input_bw||'-')+'</div>';
    if(k==='l1mscore'){ var v=latScore(state.profile,r.fw); return '<div class="c num"><b>'+(v?v.toFixed(1):'-')+'</b></div>'; }
    if(k==='p999') return '<div class="c num sub">'+esc(r.p99_9_latency||'-')+'</div>';
    if(k==='cpureq') return '<div class="c num sub">'+(r.cpu_per_req_us!=null?esc((+r.cpu_per_req_us).toFixed(2))+' \u00b5s':'-')+'</div>';
    if(k==='cputot'){ var t=cpuTotPct(r,state.profile); return '<div class="c num sub">'+(t==null?'-':esc(t.toFixed(1))+'%')+'</div>'; }
    if(k==='held') return '<div class="c num sub">'+(r.connections_open!=null?fmt(+r.connections_open):'-')+'</div>';
    if(k==='avg') return '<div class="c num sub">'+esc(r.avg_latency||'-')+'</div>';
    if(k==='p99') return '<div class="c num sub">'+esc(r.p99_latency||'-')+'</div>';
    if(k==='p50') return '<div class="c num sub">'+esc(r.p50_latency||'-')+'</div>';
    if(k==='cpu') return '<div class="c num sub">'+esc(r.cpu||'-')+'</div>';
    if(k==='mem') return '<div class="c num sub">'+esc(r.memory||'-')+'</div>';
    return '<div class="c"></div>';
  }
  // A profile's detail view as data, for the table and the rack alike.
  function profileModel(){
    var all=(D.results[state.profile+'-'+state.conns]||[]).slice();
    if(isLatProfile(state.profile)) latBuild(state.profile, all);
    // Rank on whatever this profile is actually about. Ranking the fixed-rate
    // profile by rps would number entries 1..N by noise around 500,000.
    var _rk=defProfileSort(state.profile);
    var byRps=all.slice().sort(function(a,b){var x=val(a,_rk.k),y=val(b,_rk.k); return x===y?0:(x<y?-1:1)*_rk.d;});
    var rankMap={}; byRps.forEach(function(r,i){rankMap[r.fw]=i+1;});
    var maxRps=byRps.length?(byRps[0].rps||0):0;
    var rows=all.filter(function(r){
      if(state.types.indexOf(typeOf(r.fw))<0) return false;
      if(!state.showTuned && modeOf(r.fw)==='tuned') return false;
      if(!matchQ(r.fw, r.lang)) return false;
      return true;
    });
    rows.sort(function(a,b){var x=val(a,state.sortKey),y=val(b,state.sortKey); if(x<y)return -1*state.sortDir; if(x>y)return 1*state.sortDir; return (b.rps||0)-(a.rps||0);});
    return {all:all, rows:rows, rankMap:rankMap, maxRps:maxRps};
  }
  function renderProfile(){
    var M=profileModel(), all=M.all, rows=M.rows, rankMap=M.rankMap, maxRps=M.maxRps;
    renderTypes();
    setCount(rows.length);
    // On a phone the columns' floors (54px rank, 200px name, 150px rate) add up
    // to more than the screen. There the table keeps the rank, the name and the
    // profile's first two figures, the rank narrows and no figure asks for more
    // than 72-88px, so it fits without panning (the rest is one tap away, on the
    // entry's card).
    var narrow=window.innerWidth<600;
    var dark=DARK(), COLS=narrow ? profileCols().slice(0,4) : profileCols();
    document.getElementById('grid').style.setProperty('--cols', COLS.map(function(c){
      if(!narrow) return c.w;
      if(c.k==='rank') return '34px';
      if(c.k==='fw') return 'minmax(0,1.5fr)';
      return String(c.w).replace(/minmax\((\d+)px/, function(m, n){ return 'minmax('+Math.min(+n, 88)+'px'; })
                        .replace(/^(\d+)px$/, function(m, n){ return Math.min(+n, 72)+'px'; });
    }).join(' '));
    var thEl=document.getElementById('thead'); thEl.innerHTML='';
    COLS.forEach(function(col){
      var d=document.createElement('div'); d.className='th'+(col.num?' num':'')+(state.sortKey===col.k?' sorted':'');
      if(col.k==='rank'){ d.textContent='#'; thEl.appendChild(d); return; }
      var ar=state.sortKey===col.k?(state.sortDir<0?'▼':'▲'):'';
      d.innerHTML=esc(col.label)+' <span class="ar">'+ar+'</span>';
      if(col.tip) d.setAttribute('data-tip', col.tip);
      d.onclick=function(){ sortBy(col.k); }; thEl.appendChild(d);
    });
    var html=rows.map(function(r){
      var x={ lc:lc(r.lang), rank:rankMap[r.fw], t:typeOf(r.fw), repo:repoOf(r.fw), dark:dark, maxRps:maxRps };
      return '<div class="row'+(favs.has(r.fw)?' fav':'')+'" data-fw-row="'+esc(r.fw)+'">'+COLS.map(function(col){return profileCell(col.k, r, x);}).join('')+'</div>';
    }).join('');
    document.getElementById('rows').innerHTML=html||'<div class="empty">'+esc(emptyMsg())+'</div>';
  }

  // ── the rack ─────────────────────────────────────────────
  // The board as hardware. Every entry is a 1U unit in a rack, top to bottom in
  // the order of the current sort; the plain table (renderComposite /
  // renderProfile) is the maintenance view, and both are fed by the same two
  // models, so a number cannot differ between them.
  //
  // What a front panel says, left to right:
  //   service label  the rank in this view (gold, silver, bronze for the top 3)
  //   locator LED    the favourite star: blue when lit
  //   name plate     entry name, a vendor badge for its language, its type, and
  //                  a hazard-striped bezel when the entry is tuned
  //   PWR ACT STS    PWR: ranked in this view. ACT blinks faster the closer the
  //                  entry is to the leader (0.6 s at the leader, 2.6 s at the
  //                  bottom). STS: completeness on a composite (amber when
  //                  points were deducted), response status on a profile (amber
  //                  when it answered with 4xx/5xx)
  //   display        the composite, or the number the profile ranks on
  //   modules        Spec and Resilience, or the profile's other columns
  //   bays           one per profile (or per family on the overall view)
  var REDUCED=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var RACK={els:{}, first:true, patch:null, cap:null, tail:null};
  var rackIO=('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){ e.target.classList.toggle('live', e.isIntersecting); });
  }, {rootMargin:'60px 0px'}) : null;
  function pad2(n){ return (n<10?'0':'')+n; }
  function fwPhase(fw){ var h=0; for(var i=0;i<fw.length;i++) h=(h*31+fw.charCodeAt(i))%2600; return (h/1000).toFixed(2); }
  function ledDur(share){ return (2.6-2.0*clamp01(share||0)).toFixed(2)+'s'; }
  function svcHtml(rank){
    return '<span class="svc'+(rank<=3?' r'+rank:'')+'"'
      + (rank<=3?' data-tip="'+['Gold','Silver','Bronze'][rank-1]+' service label: '+['first','second','third'][rank-1]+' in this view."':'')
      + '>'+rank+'</span>';

  function uidHtml(fw){
    return '<button type="button" class="uid star'+(favs.has(fw)?' on':'')+'" data-fw="'+esc(fw)+'"'
      + ' aria-label="Favourite '+esc(fw)+'" data-tip="Locator LED - favourite this entry and it lights up blue in every view."><i></i></button>';
  }
  function plateHtml(fw, lang){
    var c=lc(lang), t=typeOf(fw);
    return '<span class="plate">'
      + (lang?'<span class="vend" style="--vc:'+c.accent+'">'+esc(lang)+'</span>':'')
      + '<span class="nm">'+esc(fw)+'</span>'+tlsCheckBadge(fw)
      + (modeOf(fw)==='tuned'?'<span class="tun" data-tip="'+esc(TUNED_TIP)+'">tuned</span>':'')
      + '<span class="ty ty-'+t+'" data-tip="'+esc(typeTip(t))+'">'+typeAbbr(t)+'</span>'

  function ledsHtml(fw, share, sts, tip){

      + '<i class="led act" style="animation-duration:'+ledDur(share)+';animation-delay:-'+fwPhase(fw)+'s"></i>'
      + '<i class="led sts '+sts+'"></i></span>';
  }
  function lcdHtml(txt, extra, share, tip){
    return '<span class="lcd"'+(tip?' title="'+esc(tip)+'"':'')+'><b data-g="'+String(txt).replace(/[0-9A-Za-z]/g,'8')+'">'+txt+'</b>'
      + (extra||'')+'<i class="lcd-bar" style="transform:scaleX('+clamp01(share||0).toFixed(3)+')"></i></span>';
  }
  function pullHtml(fw){
    var open=state.open===fw;
    return '<button type="button" class="pull" aria-expanded="'+(open?'true':'false')+'" aria-label="'
      + (open?'Slide '+esc(fw)+' back into the rack':'Slide '+esc(fw)+' out of the rack: every number, links and run logs')+'"><i></i></button>';
  }
  function specMod(fw){
    var s=specOf(fw), at=' data-fw="'+esc(fw)+'" tabindex="0"';
    if(!s) return '<span class="mod spec empty"'+at+'><span class="mv">·</span></span>';
    if(s.e!=null||!s.t) return '<span class="mod spec nc"'+at+'><span class="mv">—</span></span>';
    var r=s.p/s.t;
    return '<span class="mod spec'+(r===1?' lead':'')+(s.c?' crashed':'')+'"'+at+' style="--p:'+r.toFixed(3)+(state.heat?';--hc:'+heatColor(r):'')+'">'
      + '<span class="mv">'+(r===1?'100':(r*100).toFixed(1))+'%</span><i class="bl"></i></span>';
  }
  function resilMod(fw){
    var s=resilSurface(), r=resilOf(fw), v=r&&r[s[0]];
    if(!v) return '<span class="mod resil empty" data-tip="'+esc(resilTip(fw))+'"><span class="mv">—</span></span>';
    var ratio=v[1]?v[0]/v[1]:0;
    return '<span class="mod resil'+(ratio===1?' lead':'')+'" data-tip="'+esc(resilTip(fw))+'" style="--p:'+ratio.toFixed(3)+(state.heat?';--hc:'+heatColor(ratio):'')+'">'
      + '<span class="mv">'+Math.round(ratio*100)+'%</span><i class="bl"></i></span>';
  }
  // One bay per profile: the figure the table cell prints, the memory under it,
  // and a light bar for its share of the column leader.
  // A figure and its unit, the unit a quieter suffix: "429.87MB/s" -> 429.87 +
  // MB/s. The text is unchanged (anything reading it reads the same).
  function numUnit(s){
    s=String(s); var m=s.match(/^([-+]?\d[\d.,]*)(\s?)([A-Za-z\u00b5%][A-Za-z\u00b5%\/]*)$/);
    return m ? esc(m[1])+'<span class="u">'+esc(m[2]+m[3])+'</span>' : esc(s);
  }
  function bayHtml(r, pid, all, gs){
    var cell=r.cells[pid], G=gs?' gs':'';
    if(all){
      var lab=scopeLabel(pid);
      if(!cell) return '<span class="bay empty'+G+'" data-tip="'+esc(r.fw+' has no '+lab+' results.')+'"><span class="bv">·</span></span>';
      var cut=Math.round(cell.v)-Math.round(cell.raw), p0=Math.max(0,Math.min(100,cell.bar))/100;

  // ── Strength: the reading aid on an entry's tray and card ──
  // Five readings, 0-100, drawn as a radar and a row of LED meters:
  //   throughput, latency, memory - percentiles. In every test (profile x
  //     connection count) the entry has a result in, the share of the other
  //     entries in that test it beats, ties counted half, averaged over its
  //     tests: requests per second (the fixed-rate profiles left out - every
  //     entry is offered the same rate there), p99 (lower is better), peak
  //     memory (lower is better). The whole field, whatever the league.
  //   coverage - the profiles it has a result in, over the profiles of the round.
  //   spec / resilience - the published scores: protocol tests passed and
  //     attacks survived, over all the suites it runs; their mean when it runs
  //     both.
  // Worked out once from D, nothing new is published: the ranking is still the
  // composite, and the card says so.
  var STRENGTH=null;
  function strengthAll(){
    if(STRENGTH) return STRENGTH;
    var acc={}, entered={}, total=0;
    function pct(key, list, higher){
      var n=list.length; if(n<2) return;
      list.forEach(function(a){
        var beat=0, ties=-1;
        for(var i=0;i<n;i++){ var o=list[i][1]; if(o===a[1]) ties++; else if(higher ? o<a[1] : o>a[1]) beat++; }
        var e=acc[a[0]]||(acc[a[0]]={}); (e[key]=e[key]||[]).push((beat+0.5*ties)/(n-1));
      });
    }
    D.profiles.forEach(function(p){
      var any=false, paced=isLatProfile(p.id);
      p.conns.forEach(function(c){
        var thr=[], lt=[], mm=[];
        (D.results[p.id+'-'+c]||[]).forEach(function(r){
          if(!(r.rps>0)) return;
          any=true; (entered[r.fw]=entered[r.fw]||{})[p.id]=1;
          if(!paced) thr.push([r.fw, r.rps]);
          var l=lat(r.p99_latency); if(isFinite(l) && l>0) lt.push([r.fw, l]);
          var mb=mem(r.memory); if(mb>0) mm.push([r.fw, mb]);

      });
      if(any) total++;

    STRENGTH={};
    Object.keys(entered).forEach(function(fw){
      var a=acc[fw]||{}, n=Object.keys(entered[fw]).length;
      function avg(k){ var l=a[k]; return l&&l.length ? Math.round(100*l.reduce(function(s,v){ return s+v; },0)/l.length) : null; }
      var sp=specPct(fw), rz=resilPct(fw), both=[sp,rz].filter(function(v){ return v!=null; });
      STRENGTH[fw]={thr:avg('thr'), lat:avg('lat'), mem:avg('mem'), cov:total?Math.round(100*n/total):null, n:n, total:total,
        spec:sp, resil:rz, sr:both.length ? Math.round(both.reduce(function(s,v){ return s+v; },0)/both.length) : null};
    });
    return STRENGTH;

      var mx={lead:0, rps:M.maxRps, cpu:0, mem:0, cputot:100};
      M.all.forEach(function(r){
        var lv=COLS[0].k==='l1mscore'?latScore(state.profile,r.fw):(r.rps||0); if(lv>mx.lead) mx.lead=lv;
        var c=cpu(r.cpu), m=mem(r.memory); if(c>mx.cpu) mx.cpu=c; if(m>mx.mem) mx.mem=m;
      });
      M.rows.forEach(function(r){ units.push(unitProfile(r, M, COLS, mx)); by[r.fw]={r:r, rank:M.rankMap[r.fw]}; });
      patch=patchProfile(COLS);
      label=PROF[state.profile].label+' · '+(+state.conns).toLocaleString()+' connections';
      COLS.forEach(function(c){ sortOpts.push([c.k, c.label]); });
    }
    rack.className='rack '+(comp?'v-comp':'v-prof')+(comp&&M.all?' v-all':'')+(comp&&state.heat?' thermal':'')
      + (comp&&specSuite()?' has-spec':'')+(comp&&resilCol()?' has-resil':'')+(state.aisle?' aisle':'')
      + (comp&&M.pids.length>8?' many':'');
    rack.style.setProperty('--n', comp?M.pids.length:COLS.length-1);
    var cap='<span class="rc-id"><i class="kled"></i>Rack '+esc(label)+'</span>'
      + '<span class="rc-n">'+n+(n===1?' unit':' units')+' racked · '
      + (state.sortDir<0?'best first':'reversed')+'</span>'
      + (comp&&state.heat?'<span class="rc-th">Thermal camera · share of column leader</span>':'');
    // The aisle's key to its lights: every test, in the order of each unit's
    // row of lights; hovering one lights up its column (aisleHl).
    if(comp) cap+='<span class="rc-tests"><span class="rc-tl">Lights, left to right</span>'
      + M.pids.map(function(pid, i){ return '<span class="rct'+(M.gs&&M.gs[i]?' gs':'')+'" data-i="'+i+'"><i></i>'
          + esc(M.all?scopeLabel(pid):(PROF[pid]?PROF[pid].label:pid))+'</span>'; }).join('')+'</span>';
    paintRack(rack, cap, patch, units, function(fw){ return by[fw]; });
    aisleGrid();
    var shares={}; if(!comp) units.forEach(function(u){ var r=by[u.fw]&&by[u.fw].r; if(r) shares[u.fw]=(r.rps||0)/(M.maxRps||1); });
    RACK.view={comp:comp, M:M, by:by, order:units.map(function(u){ return u.fw; }), label:label, share:shares};
    renderSortCtl(sortOpts);
  }
  function initRack(){
    var rack=document.getElementById('rack'); if(!rack) return;
    rack.addEventListener('click', function(e){
      var t=e.target, c=t.closest?function(s){ return t.closest(s); }:function(){ return null; };
      var s=c('.star'); if(s){ e.preventDefault(); e.stopPropagation(); toggleFav(s.getAttribute('data-fw')); return; }
      var a;
      if((a=c('.pico.pgo'))||(a=c('.rp[data-pid]'))){ e.preventDefault(); pickProfile(a.dataset.pid); return; }
      if((a=c('.pico.pscope'))||(a=c('.rs[data-scope]'))){ e.preventDefault(); pickScope(a.dataset.scope); return; }
      if(c('a')) return;
      if(c('.spec')) return;                       // a Spec module pins its panel
      var port=c('.port[data-k]'); if(port){ sortBy(port.dataset.k); return; }
      if(c('[data-close]')){ var u0=c('[data-fw-row]'); if(u0) toggleTray(u0.getAttribute('data-fw-row')); return; }
      if(c('.tray')) return;                       // reading the tray must not close it
      var u=c('[data-fw-row]');
      if(u && c('.face')){
        toggleTray(u.getAttribute('data-fw-row'));   // in the aisle it slides out where it stands
      }
    });
    rack.addEventListener('keydown', function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      var t=e.target;
      if(t.matches && t.matches('.port[data-k]')){ e.preventDefault(); sortBy(t.dataset.k); }
      else if(t.matches && t.matches('.pico.pgo, .rp[data-pid]')){ e.preventDefault(); e.stopPropagation(); pickProfile(t.dataset.pid); }
      else if(t.matches && t.matches('.pico.pscope, .rs[data-scope]')){ e.preventDefault(); e.stopPropagation(); pickScope(t.dataset.scope); }
    });
    // In the aisle a unit slides out over its neighbours: a click anywhere else
    // slides it back in (a click on a unit is the rack's own, above).
    document.addEventListener('click', function(e){
      if(!state.aisle || !state.open || state.maint) return;
      // the path, not the target: the click that opened it rebuilt the unit
      if(e.composedPath().some(function(n){ return n.matches && n.matches('#rack .unit[data-fw-row]'); })) return;
      state.open=''; render();
    });
    // The aisle's lights and their key: hover a test in the key and its light
    // lights up in every unit (the rest dim); hover a light and its test does.
    function aisleHl(i, dim){
      rack.classList.toggle('hl-on', i!=null && !!dim);
      Array.prototype.forEach.call(rack.querySelectorAll('.hl'), function(x){ x.classList.remove('hl'); });
      if(i==null) return;
      Array.prototype.forEach.call(rack.querySelectorAll('.unit .bays>.bay:nth-child('+(i+1)+'), .rct[data-i="'+i+'"]'), function(x){ x.classList.add('hl'); });
    }
    rack.addEventListener('mouseover', function(e){
      if(!state.aisle || !e.target.closest) return;
      var t=e.target.closest('.rct[data-i], .unit .bays>.bay');
      if(!t){ if(rack.querySelector('.hl')) aisleHl(null); return; }
      var key=t.classList.contains('rct'), i=key ? +t.getAttribute('data-i') : Array.prototype.indexOf.call(t.parentNode.children, t);
      aisleHl(i, key);
    });
    rack.addEventListener('mouseleave', function(){ aisleHl(null); });
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape' && state.open && !state.maint && document.getElementById('spanel').style.display!=='block'){ var fw=state.open; state.open=''; render();
        var el=RACK.els[fw], b=el&&el.querySelector('.pull'); if(b) b.focus(); }
    });
    // Rack, Aisle, Old View: pressing the key that is down does nothing
    function setView(maint, aisle){
      if(maint ? state.maint : (!state.maint && !!state.aisle===aisle)) return;
      state.maint=maint; if(!maint) state.aisle=aisle;
      try{ localStorage.setItem('sr-view', maint?'table':'rack'); }catch(e){}
      render();
    }
    var rb=document.getElementById('rackBtn'); if(rb) rb.onclick=function(){ setView(false, false); };
    var ab=document.getElementById('aisleBtn'); if(ab) ab.onclick=function(){ setView(false, true); };
    var mb=document.getElementById('maintBtn'); if(mb) mb.onclick=function(){ setView(true); };
  }

  // ── hardware chips ──────────────────────────────────────
  function shortCpu(s){ return String(s).replace(/\s*\d+-Cores?$/i,'').replace(/\(R\)|\(TM\)/g,'').trim(); }
  function hw(){
    var c=D.current||{};
    var chips=[];
    if(c.cpu) chips.push('<span class="chip"><b>'+(c.cores||'')+'</b> cores · '+esc(shortCpu(c.cpu))+'</span>');
    if(c.ram) chips.push('<span class="chip"><b>'+esc(c.ram)+'</b> RAM</span>');
    if(c.kernel) chips.push('<span class="chip">Linux '+esc(c.kernel)+'</span>');
    else if(c.os) chips.push('<span class="chip">'+esc(c.os)+'</span>');
    document.getElementById('hw').innerHTML=chips.join('');
  }

  // ── theme ───────────────────────────────────────────────
  function initTheme(){
    var saved=localStorage.getItem('lb-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved);
    document.getElementById('theme').onclick=function(){ var next=DARK()?'light':'dark'; document.documentElement.setAttribute('data-theme',next); localStorage.setItem('lb-theme',next); render(); };
  }
  document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value.trim(); render(); });

  // ── boot ────────────────────────────────────────────────
  document.getElementById('rows').addEventListener('click', function(e){
    var s=e.target.closest('.star'); if(s){ e.preventDefault(); e.stopPropagation(); toggleFav(s.getAttribute('data-fw')); return; }
    if(e.target.closest('a')) return;
    // A Spec cell's click pins its panel (initSpecPanel); opening the entry's
    // modal on top would cover the panel and take the click meant for its link.
    if(e.target.closest('td.spec')) return;
    var row=e.target.closest('[data-fw-row]'); if(row) openModal(row.getAttribute('data-fw-row'));
  });
  try{ var _vt=['flagship','emerging','experimental','engine','infrastructure']; var _t=JSON.parse(localStorage.getItem('lb-types')||'null'); if(_t&&_t.length){ _t=_t.filter(function(x){return _vt.indexOf(x)>=0;}); if(_t.length) state.types=_t; } }catch(e){}
  document.getElementById('typeFilter').addEventListener('click', function(e){ var b=e.target.closest('button[data-type]'); if(!b) return; toggleType(b.getAttribute('data-type')); });
  try{ var _st=localStorage.getItem('lb-showtuned'); if(_st!==null) state.showTuned=_st==='1'; }catch(e){}
  try{ var _fc=localStorage.getItem('lb-fwcompact'); if(_fc!==null) state.compactFw=_fc==='1'; }catch(e){}
  document.getElementById('tunedToggle').addEventListener('click', function(){ state.showTuned=!state.showTuned; saveTuned(); render(); });
  restoreFromHash();
  // "How to read a unit" is written when a reader opens it: the key explains
  // the rack, and the page's own text - what a crawler reads - stays the
  // ranking and the copy under it, as before the restyle.
  function initLegend(){
    var d=document.getElementById('legend'), b=document.getElementById('legendB'); if(!d||!b) return;
    d.addEventListener('toggle', function(){ if(d.open && !b.firstChild) b.innerHTML=''
    +'<div><b>Service label</b>The rank in this view. The first three wear gold, silver and bronze.</div>'
    +'<div><b>Locator LED</b>The round button after the rank: press it to favourite an entry, and it lights blue in every view.</div>'
    +'<div><b>Name plate</b>The entry, a vendor badge for its language and its type. A tuned entry wears a hazard-striped bezel.</div>'
    +'<div><b>PWR · ACT · STS</b>PWR: ranked here. ACT blinks faster the closer the entry is to the leader. STS: green, or amber when completeness cost it points (on a profile: when it answered with errors).</div>'
    +'<div><b>Display</b>The composite score, or the figure the profile ranks on. The small amber number is what completeness took off.</div>'
    +'<div><b>Bays</b>One per test profile: its result, the memory under it, and a light bar for its share of that profile&rsquo;s leader. A dashed bay ran but does not count.</div>'
    +'<div><b>Patch panel</b>The strip above the first unit names every column. Press a port to sort by it.</div>'
    +'<div><b>Pull handle</b>Press a unit to slide it out on its rails: every number, the run logs, Spec, Resilience, medals and the link to its results page.</div>'; });
  }
  initRail(); initLegend(); initTips(); init3d(); initSpecPanel(); initHeat(); initModal(); initRack(); initDocLinks(); initSearchHelp(); initRounds(); initTheme(); initNavSearch(); hw(); buildNav(); renderHead(); render();
  (function(){ var b=document.getElementById('brandHome'); if(b) b.onclick=function(e){ e.preventDefault(); pickScope('h1'); }; })();
  window.addEventListener('hashchange', function(){ restoreFromHash(); buildNav(); renderHead(); render(); });
  var _rz; window.addEventListener('resize', function(){ clearTimeout(_rz); _rz=setTimeout(function(){ if(state.view==='profile') render(); else if(state.view==='composite'){ syncTopScroll(); if(FLOAT.measure){ FLOAT.measure(); floatCheck(); } } }, 150); });
});
