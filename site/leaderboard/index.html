<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://http-arena.com/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>HTTP Web Server Benchmarks – HttpArena</title>
<meta name="description" content="Independent webserver benchmarks across every major framework and protocol (H1, H2, H3, gRPC, WebSocket) in multiple categories.">
<link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Board-only rules. Tokens, the header, the sidebar and every overlay are in
     /assets/app.css, shared with the generated pages. */
  html{--row-py:7px; --cell-fs:12.5px}
  html[data-density="compact"]{--row-py:3px; --cell-fs:12px}

  .layout{display:grid; grid-template-columns:248px minmax(0,1fr); align-items:start}
  .main{padding:26px 28px 64px; min-width:0; max-width:1200px}
  .main.cmfull{max-width:none}

  .phead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px 32px; flex-wrap:wrap}
  .phead>div:first-child{min-width:0; flex:1 1 420px}
  .phead .cat{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em}
  .phead .cat::before{content:""; width:6px; height:6px; border-radius:2px; background:var(--accent-solid)}
  .phead h1{margin:6px 0 0; font-size:26px; font-weight:650; letter-spacing:-.028em; line-height:1.2; text-wrap:balance}
  .phead p{margin:8px 0 0; color:var(--text-2); font-size:13.5px; line-height:1.55; max-width:76ch}
  .phead p a{color:var(--accent); text-decoration:underline; text-decoration-color:var(--accent-line); text-underline-offset:3px}
  .phead p a:hover{text-decoration-color:currentColor}
  .hw{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
  .chip{display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid var(--line); border-radius:99px; background:var(--panel); font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}
  .chip b{color:var(--text-2); font-weight:550; margin-right:.35em}

  #headctl{display:flex; flex-direction:column; align-items:stretch; gap:6px; flex:none}
  .toggle{display:inline-flex; align-items:center; justify-content:space-between; gap:14px; font-size:13px; font-weight:500; color:var(--text-2); cursor:pointer; user-select:none; white-space:nowrap; flex-direction:row-reverse; padding:2px 0; border-radius:var(--r-sm)}
  .toggle .sw{width:28px; height:16px; border-radius:99px; background:var(--line-strong); position:relative; transition:background .14s ease; flex:none}
  .toggle .sw i{position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:transform .14s ease; box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .toggle:hover{color:var(--text)}
  .toggle.on{color:var(--text)} .toggle.on .sw{background:var(--accent-solid)} .toggle.on .sw i{transform:translateX(12px)}
  .seg{position:relative; display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); padding:2px}
  .seg-thumb{position:absolute; top:2px; bottom:2px; left:0; border-radius:4px; background:var(--panel); box-shadow:var(--shadow-sm), 0 0 0 1px var(--line); transition:transform .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1); z-index:0; pointer-events:none}
  .seg button{position:relative; z-index:1; border:0; background:transparent; color:var(--muted); cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:500; height:26px; padding:0 11px; border-radius:4px; font-variant-numeric:tabular-nums; transition:color .14s ease}
  .seg button:hover{color:var(--text)}
  .seg button.on{color:var(--text)}

  /* filter row: search + league filter */
  .tools{display:flex; align-items:center; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
  .search{position:relative; flex:1 1 300px; min-width:0; max-width:560px}
  .search input{font-size:13px; height:32px; padding:0 34px 0 31px; width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:var(--r); transition:border-color .12s ease, box-shadow .12s ease}
  .search input::placeholder{color:var(--muted)}
  .search input:hover{border-color:var(--line-strong)}
  .search input:focus{outline:none; border-color:var(--accent-solid); box-shadow:0 0 0 3px var(--accent-weak)}
  .search>svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
  .search>kbd{position:absolute; right:7px; top:50%; transform:translateY(-50%); pointer-events:none}
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd{display:none}
  .search-pop{position:absolute; top:calc(100% + 6px); left:0; min-width:300px; max-width:min(400px,90vw); width:max-content; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:4px; z-index:50; animation:popIn .14s ease}
  .search-pop-h{font-size:11px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:7px 9px 5px}
  .search-ex{display:flex; align-items:center; gap:10px; padding:6px 9px; border-radius:var(--r); cursor:pointer}
  .search-ex:hover{background:var(--panel-2)}
  .search-ex code{font-family:var(--mono); font-size:12px; color:var(--accent); background:var(--accent-weak); border-radius:var(--r-sm); padding:1px 6px; white-space:nowrap; flex:none}
  .search-ex .ex-d{font-size:12.5px; color:var(--muted)}
  .type-filter{display:flex; align-items:center; gap:2px; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); padding:2px; flex:none; max-width:100%; overflow-x:auto; scrollbar-width:none}
  .type-filter::-webkit-scrollbar{display:none}
  .type-filter button{display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer; font-size:12.5px; font-weight:500; height:26px; padding:0 9px; border-radius:4px; white-space:nowrap; transition:color .12s ease, background .12s ease}
  .type-filter button::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--faint); opacity:.55; transition:opacity .12s ease}
  .type-filter button:hover{color:var(--text)}
  .type-filter button.on{background:var(--panel); color:var(--text); border-color:var(--line); box-shadow:var(--shadow-sm)}
  .type-filter button.on::before{opacity:1}
  .type-filter button[data-type="flagship"]::before{background:var(--t-flagship)}
  .type-filter button[data-type="emerging"]::before{background:var(--t-emerging)}
  .type-filter button[data-type="experimental"]::before{background:var(--t-experimental)}
  .type-filter button[data-type="engine"]::before{background:var(--t-engine)}
  .type-filter button[data-type="infrastructure"]::before{background:var(--t-infrastructure)}
  .type-filter button#tunedToggle::before{background:var(--t-tuned); border-radius:50%}
  .tf-div{width:1px; align-self:stretch; background:var(--line); margin:4px 4px; flex:none}

  /* table toolbar: the strip the table hangs from */
  .tbar{display:flex; align-items:center; gap:6px; min-height:44px; padding:6px 6px 6px 12px; border:1px solid var(--line); border-bottom:0; border-radius:var(--r-lg) var(--r-lg) 0 0; background:var(--panel); flex-wrap:wrap}
  .count{color:var(--text-2); font-size:12.5px; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
  .tbar .sp{flex:1; min-width:0}
  .tbar .btn{height:30px; padding:0 9px; font-size:12.5px}
  .tbar .btn.sq{width:30px; padding:0}
  .heat-btn svg{fill:currentColor}
  .heatkey{display:flex; align-items:center; flex-wrap:wrap; gap:2px 10px; font-size:11.5px; color:var(--muted); margin-left:8px}
  .heatkey .hk-l{margin-right:2px}
  .heatkey .hk{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .heatkey .hk i{width:10px; height:10px; border-radius:2px; display:inline-block}
  .heatkey .hk i.hk-crown{width:auto; height:auto; display:inline-flex; align-items:center}
  .heatkey .hk i.hk-crown svg{width:12px; height:12px; display:block; fill:var(--gold)}
  .mview{display:none !important}
  body.booting .tbar .btn, body.booting .tools{pointer-events:none}
  body.booting .tbar .btn{opacity:.5}
  .bootbar{position:fixed; top:0; left:0; right:0; height:2px; z-index:60; overflow:hidden; display:none}
  body.booting .bootbar{display:block}
  .bootbar i{position:absolute; top:0; bottom:0; width:40%; background:var(--accent-solid); animation:bootbar 1.1s ease-in-out infinite}
  @keyframes bootbar{from{transform:translateX(-100%)} to{transform:translateX(250%)}}

  /* display popover */
  .pop{position:absolute; z-index:60; min-width:260px; max-width:min(340px,calc(100vw - 24px)); max-height:min(70vh,560px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:6px; animation:popIn .14s ease; scrollbar-width:thin}
  .pop-h{display:flex; align-items:center; justify-content:space-between; font-size:11px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 8px 5px}
  .pop-h button{border:0; background:none; color:var(--accent); font-size:11.5px; cursor:pointer; padding:0; font-family:var(--sans); text-transform:none; letter-spacing:0}
  .pop-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 8px; font-size:13px; color:var(--text-2)}
  .pop-seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); padding:2px}
  .pop-seg button{border:0; background:transparent; height:24px; padding:0 9px; border-radius:4px; font-size:12px; color:var(--muted); cursor:pointer}
  .pop-seg button.on{background:var(--panel); color:var(--text); box-shadow:var(--shadow-sm), 0 0 0 1px var(--line)}
  .pop-col{display:flex; align-items:center; gap:9px; width:100%; padding:5px 8px; border:0; background:none; border-radius:var(--r); font-size:13px; color:var(--text-2); cursor:pointer; text-align:left}
  .pop-col:hover{background:var(--panel-2); color:var(--text)}
  .pop-col i{width:14px; height:14px; border:1px solid var(--line-strong); border-radius:3px; flex:none; display:inline-flex; align-items:center; justify-content:center; background:var(--panel)}
  .pop-col.on i{background:var(--accent-solid); border-color:var(--accent-solid)}
  .pop-col.on i::after{content:""; width:7px; height:4px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg) translate(1px,-1px)}
  .pop-col small{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
  .pop hr{border:0; border-top:1px solid var(--line); margin:6px 0}

  /* Build-time ranking, written into #rows by gen_leaderboard_data.py and thrown
     away by renderComposite() as soon as data.js has been parsed. It is what a
     reader without JavaScript gets, and what paints first for everyone else -
     so it is dressed as the table that replaces it. */
  #rows:has(>.sb){border:1px solid var(--line); border-radius:0 0 var(--r-lg) var(--r-lg); background:var(--panel); overflow-x:auto}
  .sb{width:100%; border-collapse:collapse; font-size:var(--cell-fs)}
  .sb th,.sb td{padding:calc(var(--row-py) + 2px) 10px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:nowrap}
  .sb th{color:var(--muted); font-size:11.5px; font-weight:500; background:var(--panel-2); border-bottom:1px solid var(--line); height:36px}
  .sb td.n,.sb th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
  .sb td:first-child,.sb th:first-child{text-align:left; width:44px; padding-left:14px; color:var(--muted)}
  .sb td:nth-child(2){font-weight:550}
  .sb td:nth-child(2) a:hover{color:var(--accent)}
  .sb td.r1{color:var(--gold); font-weight:600} .sb td.r2{color:var(--silver); font-weight:600} .sb td.r3{color:var(--bronze); font-weight:600}
  .sb .sb-lang{color:var(--muted); font-family:var(--mono); font-size:11.5px}
  .sb td.crash{color:var(--danger)}
  .sb-note{color:var(--muted); font-size:12.5px; margin:0; padding:12px 14px}
  .sb-note a{color:var(--accent)}
  .board-seo{margin:48px 0 16px; max-width:76ch; color:var(--text-2); font-size:13.5px; line-height:1.65}
  .board-seo:empty{display:none}
  .board-seo h2{font-size:16px; font-weight:620; color:var(--text); margin:32px 0 8px; padding-top:20px; border-top:1px solid var(--line); letter-spacing:-.01em}
  .board-seo h3{font-size:13.5px; font-weight:600; color:var(--text); margin:18px 0 4px}
  .board-seo p{margin:6px 0}
  .board-seo a{color:var(--accent); text-decoration:underline; text-decoration-color:var(--accent-line); text-underline-offset:3px}
  .board-seo ul{margin:8px 0; padding-left:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px}
  .board-seo ul a{display:inline-flex; height:26px; align-items:center; padding:0 10px; border:1px solid var(--line); border-radius:99px; background:var(--panel); color:var(--text-2); text-decoration:none; font-size:12.5px}
  .board-seo ul a:hover{border-color:var(--line-strong); color:var(--text)}
  .board-seo .updated{margin-top:24px}

  /* loading + empty + error states */
  .tskel{display:none; border:1px solid var(--line); border-radius:0 0 var(--r-lg) var(--r-lg); background:var(--panel); padding:4px 0}
  .tskel div{display:grid; grid-template-columns:30px 220px 90px 1fr; gap:18px; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line-soft)}
  .tskel div:last-child{border-bottom:0}
  body.rl .tskel{display:block} body.rl #rows{display:none}
  .nav-skel{display:flex; flex-direction:column; gap:14px; padding:10px 8px}
  .nav-skel .skel:nth-child(odd){width:62%} .nav-skel .skel:nth-child(3n){width:44%}
  .empty{padding:56px 16px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:6px; border:1px solid var(--line); border-radius:0 0 var(--r-lg) var(--r-lg); background:var(--panel)}
  td.empty{display:table-cell; border:0; border-radius:0}
  .empty svg{width:28px; height:28px; color:var(--faint); margin-bottom:4px}
  .empty b{color:var(--text); font-weight:600; font-size:14px}
  .empty span{font-size:13px; max-width:44ch}
  .empty .btn{margin-top:10px}
  .notice{display:flex; align-items:center; gap:10px; padding:10px 12px; margin:0 0 12px; border:1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background:color-mix(in srgb, var(--warn) 7%, var(--panel)); border-radius:var(--r-lg); font-size:13px; color:var(--text-2)}
  .notice b{color:var(--text)} .notice .btn{margin-left:auto; height:28px}

  /* profile (detail) grid */
  .grid{--cols:54px minmax(250px,2fr) minmax(150px,1fr) 112px 92px 92px 96px 86px}
  .thead,.row{display:grid; grid-template-columns:var(--cols); align-items:center}
  .thead{position:sticky; top:var(--hdr); z-index:10; background:var(--panel-2); height:36px; border:1px solid var(--line); font-size:11.5px; font-weight:500; color:var(--muted)}
  .thead .th{padding:0 10px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .thead .th.num{text-align:right}
  .thead .th:hover{color:var(--text)}
  .thead .th .ar{opacity:0; margin-left:2px; font-size:9px; color:var(--accent)}
  .thead .th.sorted{color:var(--text)} .thead .th.sorted .ar{opacity:1}
  #rows:has(>.row){border:1px solid var(--line); border-top:0; border-radius:0 0 var(--r-lg) var(--r-lg); background:var(--panel); overflow:hidden}
  .row{border-bottom:1px solid var(--line-soft); transition:background .08s ease; scroll-margin-top:calc(var(--hdr) + 44px); scroll-margin-bottom:12px}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--panel-2)}
  .row .c{padding:calc(var(--row-py) + 3px) 10px; min-width:0}
  .row .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:var(--cell-fs); color:var(--text)}
  .row .sub{color:var(--text-2)}
  .rank{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-left:14px !important}
  .rank.r1{color:var(--gold); font-weight:600} .rank.r2{color:var(--silver); font-weight:600} .rank.r3{color:var(--bronze); font-weight:600}
  .fw{display:flex; align-items:center; gap:8px; min-width:0}
  .fw .nm{font-weight:550; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
  .fw .lang,.cm .fwcell .lang{width:44px; flex:none; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}
  .tnd{font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:0 4px; border-radius:3px; line-height:14px; white-space:nowrap; flex:none; cursor:default; color:var(--t-tuned); background:color-mix(in srgb, var(--t-tuned) 12%, transparent); border:0}
  .tnd::before{display:none}
  .tndslot{width:40px; flex:none; display:flex; justify-content:flex-end; align-items:center}
  .tlssec{display:inline-flex; color:var(--ok); flex:none}
  .meter{position:relative; display:flex; flex-direction:column; align-items:flex-end; gap:4px; padding:calc(var(--row-py) + 1px) 10px !important}
  .meter .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:550; font-size:var(--cell-fs)}
  .meter .bar{height:3px; width:100%; background:var(--bar-track); border-radius:2px; overflow:hidden}
  .meter .bar i{display:block; height:100%; border-radius:2px; background:var(--bar)}
  .row.lead .meter .bar i{background:var(--accent-solid)}
  .zero{color:var(--muted)}
  .meter .mtop{display:flex; align-items:baseline; gap:6px}
  .statwrap{position:relative; display:inline-flex; align-items:center}
  .statwrap .err{color:var(--danger); font-weight:600; font-size:11px; font-family:var(--mono); cursor:default}
  .statwrap .ok{color:var(--ok); font-size:11px; cursor:default}
  .stattip{position:absolute; bottom:calc(100% + 7px); right:0; z-index:25; display:none; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:7px 9px; white-space:nowrap; font-size:11.5px; font-family:var(--mono); color:var(--text-2)}
  .stattip span{display:flex; justify-content:space-between; gap:12px}
  .stattip b{color:var(--text); font-weight:550}
  .statwrap:hover .stattip{display:flex}

  /* cell popups */
  #dtip,#spanel{position:fixed; z-index:101; display:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:10px 12px; font-size:12px; line-height:1.45; max-width:340px}
  #dtip{pointer-events:none}
  #dtip .dh,#spanel .dh{font-weight:620; font-size:13px}
  #dtip .dsub,#spanel .dsub{color:var(--muted); font-size:11.5px; margin-bottom:6px}
  #dtip .dc,#spanel .dc{color:var(--muted); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; margin:8px 0 3px; padding-top:7px; border-top:1px solid var(--line-soft)}
  #dtip .dc .dtag,#spanel .dc .dtag{float:right; text-transform:none; letter-spacing:0; color:var(--muted)}
  #dtip table,#spanel table{border-collapse:collapse; width:100%}
  #dtip td,#spanel td{padding:1px 0; vertical-align:baseline}
  #dtip td.k,#spanel td.k{color:var(--text-2); padding-right:16px; white-space:nowrap}
  #dtip td.v,#spanel td.v{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
  #dtip .dfoot,#spanel .dfoot{margin-top:8px; padding-top:7px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:11px}
  #spanel{z-index:102; max-width:360px}
  #spanel.pinned{border-color:var(--accent-solid); box-shadow:var(--shadow), 0 0 0 3px var(--accent-weak)}
  #spanel .dh{padding-right:22px}
  #spanel .sx{display:none; position:absolute; top:6px; right:6px; width:22px; height:22px; border:0; border-radius:var(--r-sm); background:none; color:var(--muted); font-size:16px; line-height:1; cursor:pointer}
  #spanel.pinned .sx{display:block}
  #spanel .sx:hover{color:var(--text); background:var(--panel-2)}
  #spanel .sscore{margin:2px 0 6px; color:var(--text-2)}
  #spanel .sbig{font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:-.02em; margin-right:8px; color:var(--text)}
  #spanel p,#spanel .snote{margin:5px 0; color:var(--text-2)}
  #spanel .swarn{color:var(--danger)}
  #spanel code{font-family:var(--mono); font-size:11px}
  #spanel ul,#spanel ol{margin:3px 0 4px; padding-left:18px}
  #spanel li{margin:1px 0; overflow-wrap:anywhere}

<!-- deferred so the browser can paint the pre-rendered ranking before it spends

<script defer src="/assets/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function lbBoot(){
  "use strict";
  // An archived round is the same board over another data set: ?round=<id>
  // loads rounds/<id>.js (written by gen_leaderboard_data.py), whose results,
  // profiles and hardware replace the current round's. Boot waits for it.
  var ROUND_ID = (location.search.match(/[?&]round=([A-Za-z0-9_-]+)/)||[])[1] || '';
  if(ROUND_ID && !lbBoot.waited){
    lbBoot.waited=true;
    var _rs=document.createElement('script'); _rs.src='rounds/'+ROUND_ID+'.js';
    _rs.onload=_rs.onerror=function(){ lbBoot(); };
    document.head.appendChild(_rs);
    return;
  }
  var D = window.LB_DATA;
  if(D && ROUND_ID && window.LB_ROUND){
    D = Object.assign({}, D, { current: window.LB_ROUND.current, profiles: window.LB_ROUND.profiles,
      results: window.LB_ROUND.results, runmeta: window.LB_ROUND.runmeta, achievements: window.LB_ROUND.achievements||{} });
  } else { ROUND_ID=''; }
  // The copy under the board is pre-rendered from the current round, so it
  // would describe the wrong machine and ranking under an archived one.
  if(ROUND_ID){ var _seo=document.getElementById('boardSeo'); if(_seo) _seo.hidden=true; }
  var LB_DOCS = window.LB_DOCS || {};
  // Run-logs are deployed at /logs/ (the board is the root site). Locally,
  // serve site/ and open /leaderboard/ so ../static/logs/ reaches site/static/logs/.
  var LOGBASE = (location.protocol==='file:' || location.pathname.indexOf('/leaderboard/')>=0) ? '../static/logs/' : '/logs/';
  // Keep whatever is already in #rows: the deploy pre-renders the default
  // ranking into it, and data.js failing to load is precisely when that
  // fallback earns its keep. Only an empty #rows (a local checkout that has
  // never run the generator) gets the build instruction.
  if(!D){ var _r=document.getElementById('rows');
          document.body.classList.remove('booting','rl');
          var _nt=document.getElementById('navTree'); if(_nt) _nt.innerHTML='';
          if(_r && !_r.firstElementChild) _r.innerHTML='<div class="empty">data.js not found - run scripts/gen_leaderboard_data.py</div>';
          else { var _n=document.getElementById('notice');
                 if(_n) _n.innerHTML='<div class="notice" role="status"><span><b>The interactive board did not load.</b> This is the published HTTP/1.1 ranking; filters, the other families and per-profile numbers need the results file.</span><button class="btn" type="button" onclick="location.reload()">Retry</button></div>'; }
          return; }

  // ── maps ─────────────────────────────────────────────────
  var PROF = {}; D.profiles.forEach(function(p){ PROF[p.id]=p; });
  // Medals, gold first, computed at build time by gen_leaderboard_data.py out of
  // the same fields the badges rank. Deliberately not recomputed against the
  // filters in view: an entry holds a medal, it does not stop holding it while
  // someone is looking at another league.
  var ACHV = D.achievements || {};
  var FWLANG = {};
  Object.keys(D.results).forEach(function(k){ D.results[k].forEach(function(r){ if(r.lang) FWLANG[r.fw]=r.lang; }); });

  var COMPOSITE = '__composite__';
  // 'all' is the overall composite (computeOverall): the families below it
  // added up, one column each. Listed first so it heads the Composite menu.
  var SCOPES = [{k:'all',label:'Overall'},{k:'h1',label:'H/1.1'},{k:'h2',label:'H/2'},{k:'h3',label:'H/3'},{k:'gw',label:'Gateway'},{k:'grpc',label:'gRPC'},{k:'ws',label:'WebSocket'}];
  function scopeLabel(k){ for(var i=0;i<SCOPES.length;i++) if(SCOPES[i].k===k) return SCOPES[i].label; return k; }
  function familyOf(p){ return {'Gateway':'gw','HTTP/2':'h2','HTTP/3':'h3','gRPC':'grpc','WebSocket':'ws'}[p.category]||'h1'; }
  // cats must list every CATALOG category that belongs to the family. This is
  // the nav's only source of profiles, so a category missing here disappears
  // from Detailed Views entirely while still ranking on the composite --
  // which is how async and latency-1m went missing when they were added.
  var FAMILIES=[{k:'h1',label:'HTTP/1.1',cats:['Connection','Concurrency','Efficiency','Workload','Database']},{k:'h2',label:'HTTP/2',cats:['HTTP/2']},{k:'h3',label:'HTTP/3',cats:['HTTP/3']},{k:'gw',label:'Gateway',cats:['Gateway']},{k:'grpc',label:'gRPC',cats:['gRPC']},{k:'ws',label:'WebSocket',cats:['WebSocket']}];
  var expanded=new Set(['composite']);
  // state.lang is an exact language filter, distinct from the q search box: q
  // matches substrings across name/language/engine, which is fine for typing but
  // useless as an addressable filter - q=C matches 73 of 78 entries, q=V matches
  // 33. The language rank badges link here, so the field they claim has to be
  // the field the page shows.
  var state = { view:'composite', profile:null, conns:null, sortKey:'rps', sortDir:-1, types:['flagship','emerging'], q:'', lang:'', useMem:false, scope:'h1', showTuned:true, rescale:false, compactFw:false, heat:false };

  // ── parsing helpers ──────────────────────────────────────
  function lat(s){ if(!s) return Infinity; var m=String(s).match(/([\d.]+)\s*(us|ms|s)/); if(!m) return Infinity; var v=parseFloat(m[1]); return m[2]==='us'?v:m[2]==='ms'?v*1e3:v*1e6; }
  function cpu(s){ var v=parseFloat(s); return isNaN(v)?0:v; }
  function mem(s){ if(!s) return 0; var m=String(s).match(/([\d.]+)\s*([KMG]i?B)/i); if(!m) return 0; var v=parseFloat(m[1]),u=m[2].toUpperCase(); return u[0]==='G'?v*1024:u[0]==='M'?v:u[0]==='K'?v/1024:v; }
  function bw(s){ if(!s) return 0; var m=String(s).match(/([\d.]+)\s*([KMG]?B)\/s/i); if(!m) return 0; var v=parseFloat(m[1]),u=m[2].toUpperCase(); return u[0]==='G'?v*1e9:u[0]==='M'?v*1e6:u[0]==='K'?v*1e3:v; }
  function typeOf(fw){ return (D.meta[fw] && D.meta[fw].type) || 'emerging'; }
  function modeOf(fw){ return (D.meta[fw] && D.meta[fw].mode) || 'standard'; }
  // What the word has to carry that the bar did not: tuned is not "a bit
  // faster", it is a number the reader cannot get by choosing the framework.
  var TUNED_TIP='Tuned - non-default configuration and hand optimizations. This is not what you '
    + 'get by installing the framework: reproducing it means reading this entry\u2019s source '
    + 'and applying it to your own application.';
  // cls picks the size: 'tnd' in table rows, the default .badge in the modal
  // header where it sits beside the type badge at that badge's scale.
  function tunedPill(fw, cls){
    return modeOf(fw)==='tuned'
      ? '<span class="'+(cls||'badge')+' b-tuned" data-tip="'+esc(TUNED_TIP)+'">tuned</span>' : '';
  }
  // A shield beside the name for an entry whose TLS was probed and came back
  // clean: the mounted certificate, TLS 1.3, an AEAD cipher, and no obsolete
  // protocol or weak cipher accepted. Absent means unverified, not failed --
  // most entries have no TLS profile at all.
  var TLS_TIP = 'TLS verified - serves the certificate the harness mounts, negotiates TLS 1.3 with an AEAD cipher, and refuses SSLv3, TLS 1.0/1.1 and NULL, anonymous, export, RC4, DES and 3DES ciphers.';
  // The opt-in TLS section: certificate rotation, SNI, resumption, close_notify
  // and the vulnerability suite, all on the HTTP/1.1 listener. Only ever shown
  // on the H1 composite -- h2 and h3 have their own listeners and are not
  // covered by it, so a badge earned on :8081 must not follow the entry into
  // views it says nothing about.
  var TLS_CHECK_TIP = 'TLS hardened - opted into the TLS section and passed it: rotates its certificate without a restart and without dropping traffic, answers with and without SNI, closes at the TLS layer, and reports no HIGH or CRITICAL finding from the vulnerability suite.';
  // ── Compliance (Spec) column ─────────────────────────────
  // The protocol-compliance score of the family on view, from site/data/spec/,
  // which scripts/spec.sh writes per entry directory. A score, never part of
  // the composite. A board entry can be several directories (actix, actix-h2c,
  // actix-websocket); gen_leaderboard_data.py has already joined them into
  // D.meta[fw].spec as {suite: {tool, p, t, f, w?, ns?, l?, c?, e?}}.
  var SPEC_SUITE={h1:'h1',h2:'h2',h3:'h3',ws:'ws'};
  var SPEC_LABEL={h1:'HTTP/1.1',h2:'HTTP/2',h3:'HTTP/3',ws:'WebSocket'};
  function specSuite(){ return state.view==='composite' ? (SPEC_SUITE[state.scope]||null) : null; }
  function specOf(fw){ var k=specSuite(), m=D.meta[fw]; return (k&&m&&m.spec&&m.spec[k])||null; }
  // Sort order: measured scores, then the ones that could not be measured, then
  // the entries that do not run the suite at all.
  function specRatio(s){ if(!s) return -1; if(s.e!=null||!s.t) return -0.5; return s.p/s.t; }
  // The panel a Spec cell opens: on hover, or pinned with a click so its links
  // can be followed. A score shows its breakdown and the first failed tests and
  // links to the entry page, which explains every failure; a cell without a
  // score says why, or how an entry gets one.
  function specPanelHtml(fw, pinned){
    var k=specSuite(); if(!k) return '';
    var s=specOf(fw), label=SPEC_LABEL[k];
    var page='/frameworks/'+encodeURIComponent(slugOf(fw))+'/#spec';
    var h='<button class="sx" type="button" aria-label="Close">×</button>'
      + '<div class="dh">'+esc(fw)+'</div><div class="dsub">'+esc(label)+' protocol compliance</div>';
    if(!s){
      h+='<p>This entry does not run the '+esc(label)+' suite, so it has no score here.</p>'
       + '<div class="dc">How an entry gets one</div><ol>'
       + '<li>List <code>"'+k+'"</code> in <code>"spec"</code> in its meta.json.</li>'
       + (k==='h1'||k==='h2' ? '<li>Serve the <code>/spec</code> route'+(k==='h2'?' on its HTTP/2 listeners':' on :8080')+'.</li>' : '')
       + '<li>Comment <code>/spec --save</code> on a pull request.</li></ol>'
       + '<a class="sgo" href="/docs/test-profiles/compliance/">How the compliance suites work →</a>';
    } else if(s.e!=null||!s.t){
      h+='<p>Could not be measured: '+esc(s.e||'no tests were scored')+'.</p>'
       + '<table><tr><td class="k">Tool</td><td class="v">'+esc(s.tool)+'</td></tr></table>'
       + '<a class="sgo" href="'+page+'">Open the full report →</a>';
    } else {
      var r=s.p/s.t;
      h+='<div class="sscore"><span class="sbig">'+(r===1?'100':(r*100).toFixed(1))+'%</span>'+s.p+' of '+s.t+' passed</div>'
       + '<table><tr><td class="k">Tool</td><td class="v">'+esc(s.tool)+'</td></tr>'
       + '<tr><td class="k">Failed</td><td class="v">'+s.f+'</td></tr>'
       + (s.w?'<tr><td class="k">Warnings, counted as passed</td><td class="v">'+s.w+'</td></tr>':'')
       + (s.ns?'<tr><td class="k">Non-strict, counted as passed</td><td class="v">'+s.ns+'</td></tr>':'')
       + '</table>';
      if(s.l){
        h+='<div class="dc">Per listener<span class="dtag">the lower one counts</span></div><table>';
        Object.keys(s.l).forEach(function(n){ var v=s.l[n];
          h+='<tr><td class="k">'+esc(n)+'</td><td class="v">'+(v?v[0]+' / '+v[1]:'not measured')+'</td></tr>'; });
        h+='</table>';
      }
      if(s.d) h+='<p class="snote">Measured on <code>'+esc(s.d)+'</code>, which the board shows under this name.</p>';
      if(s.c) h+='<p class="snote swarn">The server crashed during the suite: the tests it could no longer answer count as failed.</p>';
      if(s.fx&&s.fx.length){

         + s.fx.map(function(id){ return '<li><code>'+esc(id)+'</code></li>'; }).join('')+'</ul>'

    }
    return h+'<div class="dfoot">'+(pinned?'Pinned: Esc or a click elsewhere closes it.':'Click the cell to pin this panel.')
      + ' Not part of the composite.</div>';

  function specCell(fw){
    var s=specOf(fw), at=' data-fw="'+esc(fw)+'" tabindex="0"';
    if(!s) return '<td class="num pc empty spec"'+at+'>·</td>';
    if(s.e!=null||!s.t) return '<td class="num pc nc spec"'+at+'><span class="pcv"><span class="crps">—</span></span></td>';
    var r=s.p/s.t;
    var bar=state.heat ? '<span class="cbar" style="background:'+heatColor(r)+'"></span>'
                       : '<span class="cbar" style="width:'+(r*100).toFixed(0)+'%"></span>';

  // Hover shows the panel; a click (or Enter) pins it, so the pointer can move
  // into it and follow its links; a second click on the same cell, the close
  // button, Esc or a click anywhere else lets it go. Redrawing the table drops
  // the cell it was pinned to, so render closes it too (specPanelClose).
  var specPanelClose=function(){};
  function initSpecPanel(){
    var pan=document.createElement('div'); pan.id='spanel'; pan.setAttribute('role','dialog');
    document.body.appendChild(pan);
    var pinned=null;
    function place(td){
      var r=td.getBoundingClientRect(); pan.style.display='block';
      var w=pan.offsetWidth, h=pan.offsetHeight;
      var l=r.left+r.width/2-w/2, t=r.top-h-8;
      if(t<6) t=r.bottom+8;
      if(t+h>window.innerHeight-6) t=Math.max(6, window.innerHeight-h-6);
      l=Math.max(6, Math.min(l, window.innerWidth-w-6));
      pan.style.left=l+'px'; pan.style.top=t+'px';
    }
    function show(td, pin){
      var h=specPanelHtml(td.dataset.fw, pin);
      if(!h){ close(); return; }
      pan.innerHTML=h; pan.classList.toggle('pinned', !!pin); place(td);
      pinned=pin?td:null;
    }
    function close(){ pan.style.display='none'; pan.classList.remove('pinned'); pinned=null; }
    specPanelClose=close;
    function held(){ return pinned && document.body.contains(pinned); }
    function cellOf(e){ return e.target.closest?e.target.closest('td.spec[data-fw]'):null; }
    function toggle(td){ if(held() && pinned===td) close(); else show(td, true); }
    document.addEventListener('mouseover', function(e){ if(held()) return; var td=cellOf(e); if(td) show(td, false); });
    document.addEventListener('mouseout', function(e){
      if(held()) return; var td=cellOf(e);
      if(td && !td.contains(e.relatedTarget)) close();
    });
    document.addEventListener('click', function(e){
      var td=cellOf(e);
      if(td){ toggle(td); return; }
      if(e.target.closest && e.target.closest('#spanel .sx')){ close(); return; }
      if(held() && !pan.contains(e.target)) close();
    });
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape' && held()){ var td=pinned; close(); td.focus(); return; }
      var td=cellOf(e);
      if(td && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); toggle(td); }
    });
    document.addEventListener('scroll', function(){ if(!held()) close(); }, true);
  }

  // ── Resilience (robustness) column ───────────────────────
  // Adversarial-attack survival per surface, from site/data/resilience/, which
  // scripts/resilience_results.py writes per entry directory. A standalone
  // robustness read, never part of the composite - like the Spec column.
  // gen_leaderboard_data.py has already scored each surface and joined any
  // variant directories into D.meta[fw].resil as {h1:[pts,n], h2:[pts,n],
  // ws:[pts,n]}, carrying only the surfaces an entry actually ran. The column
  // follows the board scope and shows that one surface - H1 on the H/1.1 view,
  // H2 on H/2, WS on WebSocket; scopes with no surface omit the column.
  var RESIL_SURF=[['h1','H1'],['h2','H2'],['ws','WS']];
  // The resilience column follows the board's current scope: the H/1.1 view shows
  // the H1 surface, H/2 the H2 surface, WebSocket the WS surface. Other scopes
  // (H/3, gateway, gRPC) have no resilience surface, so the column is absent there.
  var RESIL_SCOPE={h1:['h1','H1'],h2:['h2','H2'],ws:['ws','WS']};
  function resilSurface(){ return state.view==='composite' ? (RESIL_SCOPE[state.scope]||null) : null; }
  function resilOf(fw){ var m=D.meta[fw]; return (m&&m.resil)||null; }
  // Show the column only when the current scope has a surface and some entry ran it.
  function resilCol(){
    var s=resilSurface(); if(!s) return false;
    return Object.keys(D.meta||{}).some(function(fw){ var r=D.meta[fw]&&D.meta[fw].resil; return !!(r&&r[s[0]]); });
  }
  // Survival rate on the current surface, for sorting. -1 when the entry did not
  // run this surface, so those sort to the bottom like the Spec column.
  function resilAgg(fw){
    var s=resilSurface(); if(!s) return -1;
    var r=resilOf(fw), v=r&&r[s[0]];
    return (v&&v[1])?v[0]/v[1]:-1;
  }
  function resilTip(fw){
    var s=resilSurface(), r=resilOf(fw), v=r&&r[s[0]];
    var how='Resilience - adversarial attacks the entry survives on its '+s[1]+' surface, run against it in a capped CPU/memory box. survived = 1 point, degraded = ½, hung/crashed/OOM = 0. Opt-in, and not part of the composite.';
    if(!v) return how+'\nThis entry has not run the suite on '+s[1]+'.';
    return how+'\n'+s[1]+': '+v[0]+' of '+v[1]+' attacks survived.';
  }
  function resilCell(fw){
    var s=resilSurface(), r=resilOf(fw), v=r&&r[s[0]], seg;
    if(!v){
      seg='<span class="rz rz-none">'
        + '<span class="rzv">—</span><span class="rzbar"></span></span>';
    } else {
      var ratio=v[1]?v[0]/v[1]:0, pct=Math.round(ratio*100);
      var col=state.heat?heatColor(ratio):'';
      seg='<span class="rz'+(ratio===1?' full':'')+'" data-tip="'
        + esc(s[1]+': '+v[0]+' of '+v[1]+' attacks survived ('+pct+'%). survived = 1 point, degraded = ½.')+'">'
        + '<span class="rzv">'+pct+'<span class="rzp">%</span></span>'
        + '<span class="rzbar"><i style="width:'+pct+'%'+(col?';background:'+col:'')+'"></i></span></span>';
    }
    return '<td class="num pc resil'+(v?'':' empty')+'" data-tip="'+esc(resilTip(fw))
      + '"><span class="rzrow">'+seg+'</span></td>';

  // ── medals ───────────────────────────────────────────────
  var MEDAL_ICO={gold:'<i class="medal gold" title="Gold"></i>',silver:'<i class="medal silver" title="Silver"></i>',bronze:'<i class="medal bronze" title="Bronze"></i>'};
  var AXIS_LABEL={family:'Family composite', language:'Within its language', profile:'Test profile'};
  // Listed in the entry's modal only. The table used to carry a count of each

  // Search: comma-separated terms matched against name/language/engine. Positive
  // terms are OR'd; a "!term" excludes any match. Show if (no positive terms or
  // one matches) AND no negative term matches.
  function matchQ(fw, lang){
    var s=(state.q||'').toLowerCase().trim(); if(!s) return true;
    var terms=s.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
    if(!terms.length) return true;
    var name=(fw||'').toLowerCase(), lg=(lang||langOf(fw)||'').toLowerCase(), eng=engineOf(fw).toLowerCase();
    function hit(t){ return name.indexOf(t)>=0 || lg.indexOf(t)>=0 || eng.indexOf(t)>=0; }
    var pos=[], neg=[];
    terms.forEach(function(t){ if(t.charAt(0)==='!'){ var n=t.slice(1).trim(); if(n) neg.push(n); } else pos.push(t); });
    if(neg.some(hit)) return false;
    if(pos.length && !pos.some(hit)) return false;
    return true;
  }
  function typeAbbr(t){ return {flagship:'flagship', emerging:'emerging', experimental:'experimental', engine:'engine', infrastructure:'infra'}[t] || t; }
  var TYPE_TIP={

  var TIP={
    rps:'Peak requests per second (best of 3 runs).',

    p99:'99th-percentile latency - 99% of requests were faster than this.',

    score:'Composite - sum of normalized per-profile scores (each profile leader = 1000), less 2.5% for each of routing, middleware, request and response the entry does not do for you. The (-n) beside a score is what that cost it.',
    scoreWs:'Composite - sum of normalized per-profile scores (each profile leader = 1000). The completeness factor does not apply here: routing, middleware, request and response are the HTTP path, and this board is not measuring it.',
    scoreHelp:'How the composite is built: every scored profile is worth 1000 to the entry leading it - including the fixed-rate profiles, which are normalized on their own CPU-and-tails score rather than on requests per second. Those scores are summed, and the total is cut by 2.5% for each of routing, middleware, request and response the entry leaves to you — its completeness factor, ×1.00 down to ×0.90. Opens the scoring docs.',
    scoreHelpWs:'How the composite is built: every scored profile is worth 1000 to the entry leading it, and those scores are summed. The completeness factor that scales the HTTP boards is not applied here — its four axes are the HTTP request-to-response path, which this family does not measure. Opens the scoring docs.',
    scoreAll:'Overall - the HTTP/1.1, HTTP/2, HTTP/3, gRPC and WebSocket composites added up, each as its own board scores it, completeness factor included where that board applies it. The (-n) beside a score is what completeness cost it across them. Gateway is not in it: it ranks whole stacks, not the entry’s own server.',
    scoreHelpAll:'How the overall is built: each family composite is computed exactly as on its own board - every scored profile worth 1000 to its leader - and the five are summed with no re-weighting, so a family counts for as many profiles as it scores. A family an entry does not serve adds nothing. Opens the scoring docs.',

    resil:'Resilience - adversarial attacks the entry survives on this surface (the board scope picks it: H1 / H2 / WebSocket), run against it in a capped CPU/memory box. survived = 1 point, degraded = ½, hung/crashed/OOM = 0. Opt-in and not part of the composite; a dash means this surface was not run. Sorts on the survival rate.'
  };
  // Every field the published row carries for one framework on one profile,
  // across each connection count the profile ran. A column can only show one
  // number; this is the rest of it, so a cell can be interrogated rather than
  // only read.
  var DT_ROWS=[
    ['rps','Requests/sec',1],['cpu','CPU'],['cpu_per_req_us','CPU / req','us'],
    ['memory','Memory'],['avg_latency','Avg latency'],['p99_latency','p99'],

    var n=['status_3xx','status_4xx','status_5xx'], any=false;

  function dtipHtml(pid,fw,nc){
    var p=PROF[pid]; if(!p) return '';
    var scored={}; (p.scoredConns||[]).forEach(function(c){scored[c]=1;});

    (p.conns||[]).forEach(function(c){
      var list=(D.results&&D.results[pid+'-'+c])||[];
      var r=null; for(var i=0;i<list.length;i++){ if(list[i].fw===fw){r=list[i];break;} }
      if(!r) return;
      var tr='';
      var collapsed=dtipStatus(r);
      DT_ROWS.forEach(function(f){
        if(collapsed && (f[0]==='status_3xx'||f[0]==='status_4xx'||f[0]==='status_5xx')) return;

  // URL segment for an entry's own page under /frameworks/. Must stay in step

  // ── page search ─────────────────────────────────────────
  // Searches the Knowledge Base (titles + full body text) and every
  // leaderboard view. docs.js already ships the rendered HTML of every page,
  // so the index is built from what is already in memory — no fetch, no
  // prebuilt index file, no dependency. Built on the first keystroke and then
  // cached — it is only ~5 ms over the whole corpus, but there is no reason to

  function buildSearchIndex(){

    // an index built before it landed holds only profiles and views, and
    // memoizing that would make the docs permanently unsearchable.
    if(SIDX && (SIDX_HAS_DOCS || !window.LB_SEARCH)) return SIDX;
    SIDX=[]; SIDX_HAS_DOCS=!!window.LB_SEARCH;
    // Docs come from search.js — plain text prepared by the generator. They are
    // real pages now (/docs/<id>/), so a hit navigates out rather than rendering
    // in place; the entry carries its own crumb, so no tree walk is needed.
    (window.LB_SEARCH || []).forEach(function(e){
      var body=(e.d ? e.d + ' ' : '') + (e.x || '');
      SIDX.push({ kind:'doc', title:e.t, crumb:e.c, body:body,
                  tl:(e.t || '').toLowerCase(), bl:body.toLowerCase(),
                  go:(function(id){ return function(){ pickDoc(id); }; })(e.u) });
    });
    D.profiles.forEach(function(p){
      var body=p.blurb||'';
      SIDX.push({ kind:'view', title:p.label, crumb:'Detailed Views › '+p.category, body:body,
                  tl:(p.label+' '+p.id+' '+p.category).toLowerCase(), bl:body.toLowerCase(),
                  go:function(){ pickProfile(p.id); } });
    });
    SCOPES.forEach(function(sc){

  // Every term must match somewhere (AND), title hits outrank body hits.

      if(e.kind==='view') score+=8;

  // flagship/emerging/experimental combine (one framework pool); engine and
  // infrastructure are exclusive - each is its own league, selected alone.
  // Never empty.
  var EXCLUSIVE_TYPES=['engine','infrastructure'];
  function isExclusiveType(t){ return EXCLUSIVE_TYPES.indexOf(t)>=0; }
  function toggleType(t){

  // ── COMPOSITE scoring (mirrors the canonical board) ─────
  // Completeness: the four things a framework can do for you between an
  // arriving request and a finished response - route it, run middleware around
  // the handler, hand the request over already made (path and query parameters,
  // a body buffered or streamed) and build the response. Each one an entry does
  // not do costs it 2.5%, so the factor runs from x1.00 down to x0.90. It scales
  // the whole composite rather than any single profile, because it is a
  // property of the entry and not of a workload.
  //
  // There is deliberately no bonus half. Doing the work a framework exists to
  // do is the baseline, not a credit: the factor exists so a bare request
  // callback cannot out-rank a real framework on throughput it only has because
  // it does less. Nothing outside that request-to-response path counts - not
  // templating, not an ORM, not the ecosystem.
  //
  // Only the framework tiers are graded. Engine and infrastructure entries
  // implement none of the four - a raw-socket server has no router, a proxy has
  // no handler to run middleware around - which is why grading them is pointless
  // rather than generous: they would all take the same x0.90, leaving their
  // order untouched, and outOfLeague already keeps them from being normalized
  // against frameworks. So their factor is fixed at 1.
  //
  // Named positively rather than through isExclusiveType() so a future
  // exclusive tier defaults to ungraded, and so the orphan `production` type
  // scores neutral instead of being penalised.
  var CMP_TYPES=['flagship','emerging','experimental'];
  var CMP_AXES=['routing','middleware','request','response'];
  // The four axes are the path from an arriving HTTP request to a finished
  // response, so they only mean something on a board measuring that path. A
  // WebSocket echo has no route to match, no body to hand over and no response
  // to build - the handshake happened once and everything after it is frames -
  // and a gRPC call has all four, but the generated stub does them, not the
  // framework. On those two boards the factor is 1 for every entry, including
  // the 27 that also serve HTTP: what is being measured there is not the thing
  // the grade is about.
  var CMP_SCOPES_OUT=['ws','grpc'];
  // scope defaults to the board's own. The overall view passes each family it
  // adds up, so every family keeps the rule its own board applies.
  function cmpInScope(scope){ return CMP_SCOPES_OUT.indexOf(scope||state.scope)<0; }
  // Only an explicit false costs anything. An axis left undeclared reads as
  // done, so an entry submitted before the field existed is ungraded rather
  // than assumed to be missing all four, and `{middleware:false}` is the whole
  // declaration for an entry that only lacks middleware.
  function cmpDecl(fw){ var c=D.meta[fw]&&D.meta[fw].cmp; return (c&&typeof c==='object')?c:null; }
  function cmpMissing(fw){
    var c=cmpDecl(fw); if(!c) return [];
    return CMP_AXES.filter(function(a){ return c[a]===false; });
  }
  function cmpFactor(fw, scope){
    if(!cmpInScope(scope) || CMP_TYPES.indexOf(typeOf(fw))<0) return 1;
    return 1-0.025*cmpMissing(fw).length;
  }
  // Which profiles count toward the composite, per league. Frameworks use the
  // global `scored` flag, engines `engineScored`, infrastructure `infraScored`.
  //
  // Infrastructure is the one league whose set is not a subset of the framework
  // set: proxies are scored on Pipelined, which frameworks treat as
  // reference-only (#1058). So its flag is read on its own rather than behind
  // the `scored` short-circuit the way engineScored is - gating it would drop
  // the profile from the infra composite without anything saying so.
  function scoredForType(pid,t){
    var p=PROF[pid]; if(!p) return false;
    if(t==='infrastructure') return !!p.infraScored;
    if(p.scored===false) return false;
    if(t==='engine') return !!p.engineScored;
    return true;
  }
  function isScored(pid,fw){ return scoredForType(pid, typeOf(fw)); }
  // The league the current view ranks. The exclusive types name themselves; any
  // framework selection shares the one framework scored set.
  function leagueType(){ for(var i=0;i<EXCLUSIVE_TYPES.length;i++){ if(state.types.indexOf(EXCLUSIVE_TYPES[i])>=0) return EXCLUSIVE_TYPES[i]; } return 'flagship'; }
  function aggregate(){
    // avg rps/mem/bw over each profile's scored conns.
    var avg={},amem={},abw={};
    D.profiles.forEach(function(p){
      // Reference-only profiles (scored:false — pipelined, fortunes) aggregate
      // too: they render as faded columns in the matrix, they just never enter
      // the framework composite sum (#1058). Load-bearing for infrastructure,
      // whose composite does count Pipelined — scoredForType() can only pick a
      // profile up if there is an average here for it.
      var pid=p.id, sums={},ms={},bs={},cn={};
      p.scoredConns.forEach(function(c){
        (D.results[pid+'-'+c]||[]).forEach(function(r){
          var fw=r.fw; sums[fw]=(sums[fw]||0)+(r.rps||0); cn[fw]=(cn[fw]||0)+1;
          ms[fw]=(ms[fw]||0)+mem(r.memory); bs[fw]=(bs[fw]||0)+bw(r.bandwidth);
        });
      });
      avg[pid]={};amem[pid]={};abw[pid]={};
      Object.keys(sums).forEach(function(fw){ var c=cn[fw]; avg[pid][fw]=sums[fw]/c; amem[pid][fw]=ms[fw]/c; abw[pid][fw]=bs[fw]/c; });
    });
    return {avg:avg,mem:amem,bw:abw};
  }
  var AGG=null;
  // scope: the family to rank, the board's own when left out.
  function computeComposite(scope){
    if(!AGG) AGG=aggregate();
    scope=scope||state.scope;
    var A=AGG, useMem=state.useMem;
    var pids=[]; D.profiles.forEach(function(p){ if(familyOf(p)===scope) pids.push(p.id); });
    // Scored columns first, reference-only ones after, each keeping its catalog
    // order. Reading left to right then follows the score: everything before the
    // break is in the sum, everything after it is context.
    //
    // Decided here rather than by reordering the catalog, because which columns
    // are reference-only is a property of the league being shown, not of the
    // profile. Infrastructure scores Pipelined and the framework leagues do not,
    // so a fixed order would have to be wrong for one of them.
    var _lt=leagueType(), _scored=[], _ref=[];
    pids.forEach(function(pid){ (scoredForType(pid,_lt)?_scored:_ref).push(pid); });
    pids=_scored.concat(_ref);
    // Two different questions, previously answered by one predicate:
    //
    //   outOfLeague — is this entry ranked somewhere else entirely? Types are
    //                 separate leagues: engine entries are scored on their own
    //                 subset of profiles, so a framework's 100 should never be
    //                 set by an engine's result.
    //   hidden      — is it merely filtered out of view right now? The search
    //                 box and the tuned toggle are display filters.
    //
    // Normalizing over `hidden` entries too is what keeps a score stable: with
    // it, filtering to one language re-based every profile on the best entry of
    // that language, and because each profile moved by a different factor the
    // summed ranking could reorder (#702 — Rage above Roda overall, below it
    // once filtered to Ruby). The `rescale` toggle restores that behaviour for
    // when comparing a subset against itself is the point.
    function outOfLeague(fw){ return state.types.indexOf(typeOf(fw))<0; }
    function hidden(fw){ if(!state.showTuned && modeOf(fw)==='tuned') return true; if(state.lang && langOf(fw)!==state.lang) return true; return !matchQ(fw); }
    function excl(fw){ return outOfLeague(fw) || hidden(fw); }
    var exclFromScale = state.rescale ? excl : outOfLeague;
    var minBpr=null;
    if(pids.indexOf('json-comp')>=0 && A.avg['json-comp']){ var mv=Infinity; Object.keys(A.avg['json-comp']).forEach(function(fw){ if(exclFromScale(fw))return; var rps=A.avg['json-comp'][fw]||0,b=A.bw['json-comp'][fw]||0; if(rps>0&&b>0){var bpr=b/rps; if(bpr<mv)mv=bpr;} }); if(mv<Infinity)minBpr=mv; }
    function eff(pid,fw){
      var rps=(A.avg[pid]&&A.avg[pid][fw])||0; if(rps<=0) return 0;
      if(pid==='json-comp'&&minBpr!=null){ var b=A.bw[pid][fw]||0; if(b>0) return rps*Math.pow(minBpr/(b/rps),2); }
      return rps;
    }
    var maxR={},maxME={},maxLat={};
    pids.forEach(function(pid){ maxR[pid]=0; maxME[pid]=0; maxLat[pid]=0; Object.keys(A.avg[pid]||{}).forEach(function(fw){ if(exclFromScale(fw))return; var e=eff(pid,fw); if(e>maxR[pid])maxR[pid]=e; var rps=A.avg[pid][fw]||0,m=A.mem[pid][fw]||0; if(m>0&&rps>0){var me=Math.sqrt(rps)/m; if(me>maxME[pid])maxME[pid]=me;} if(isLatProfile(pid)){ var ls=latScore(pid,fw); if(ls>maxLat[pid])maxLat[pid]=ls; } }); });
    var fwset={}; pids.forEach(function(pid){ Object.keys(A.avg[pid]||{}).forEach(function(fw){fwset[fw]=1;}); });
    var rows=[];
    Object.keys(fwset).forEach(function(fw){
      if(excl(fw)) return;
      var cells={}, sum=0, any=false;
      pids.forEach(function(pid){
        var rps=(A.avg[pid]&&A.avg[pid][fw])||0;
        if(rps>0 && maxR[pid]>0){ any=true;
          var sc;
          if(isLatProfile(pid)){
            // The rate is pinned on this profile, so normalising it on rps puts
            // every entry that held the rate at 1000 and the column says nothing.
            // Its own 0-100 score, built from cost and both latency tails, is
            // what the cell ranks on instead. No memory bonus: the value is not
            // a throughput for the bonus to scale.
            //
            // Normalised against the leading score in the field, exactly as the
            // rps profiles are normalised against the leading rps, so the column
            // leader is worth 1000 here too. A flat x10 was the old behaviour and
            // it quietly capped this column below every other one: nobody is
            // simultaneously cheapest on CPU and best on both tails, so the best
            // entry scored in the low 90s and the column could never contribute
            // its full 1000 the way an rps column does.
            sc=maxLat[pid]>0?(latScore(pid,fw)/maxLat[pid])*1000:0;
          } else {
            // 0-1000 per profile, not 0-100. At 24 scored profiles a 0-100
            // basis put whole clusters of entries on the same rounded total,
            // and the extra digit is free: nothing about the ranking changes,
            // only how finely it can be read.
            sc=(eff(pid,fw)/maxR[pid])*1000;
            if(useMem && maxME[pid]>0){ var m=A.mem[pid][fw]||0; if(m>0) sc+=(Math.sqrt(rps)/m/maxME[pid])*1000*0.5; }
          }
          var counts=isScored(pid,fw);
          // `score` is set only where the cell must not print rps. Everywhere
          // else it stays null and the renderer keeps showing throughput.
          cells[pid]={v:sc, c:counts, rps:rps, mem:(A.mem[pid][fw]||0),
                      score:(isLatProfile(pid)?sc:null)};
          if(counts) sum+=sc;
        }
      });
      if(any) rows.push({fw:fw, lang:langOf(fw), score:sum*cmpFactor(fw, scope), raw:sum,
                         miss:cmpMissing(fw), dec:!!cmpDecl(fw), cells:cells});
    });
    // per-profile max score → normalize the per-cell quality bar so it adapts when the memory toggle lifts the ceiling above 100
    var maxV={}; pids.forEach(function(pid){ maxV[pid]=0; });
    rows.forEach(function(r){ pids.forEach(function(pid){ var c=r.cells[pid]; if(c && c.v>maxV[pid]) maxV[pid]=c.v; }); });
    rows.forEach(function(r){ pids.forEach(function(pid){ var c=r.cells[pid]; if(c){ c.bar=maxV[pid]>0?(c.v/maxV[pid])*100:0; c.best=maxV[pid]>0 && c.v>=maxV[pid]-0.05; } }); });
    return {pids:pids, rows:rows};
  }
  // The overall composite: the family composites of the protocols an entry
  // serves itself, added up. Each family is scored exactly as its own board
  // scores it - its scored set for the league in view, its own leaders, the
  // completeness factor where that board applies it - and nothing is
  // re-weighted on top, so every scored profile is worth 1,000 to its leader
  // here as it is there. A family weighs what its number of scored profiles
  // makes it weigh, and a family an entry does not serve adds nothing.
  //
  // Gateway is left out. Its profiles rank a whole stack - an edge proxy, a
  // cache, an auth service - put in front of the entry, which is a different
  // question from how the entry's own server does.
  var OVERALL_FAMS=['h1','h2','h3','grpc','ws'];
  // A column per family the league in view is scored on at all: infrastructure
  // is scored on no gRPC or WebSocket profile, so it gets neither column.
  function overallFams(){
    var lt=leagueType();
    return OVERALL_FAMS.filter(function(k){
      return D.profiles.some(function(p){ return familyOf(p)===k && scoredForType(p.id, lt); });
    });
  }
  // Rows shaped like computeComposite's, with one cell per family instead of
  // one per profile. A cell carries the family composite (v), the raw sum it
  // was cut from, and the place it holds on that family's own board - the
  // rank the reader would find there under the same filters.
  function computeOverall(){
    var by={}, fams=overallFams();
    fams.forEach(function(k){
      var rows=computeComposite(k).rows, lead=0;
      rows.forEach(function(r){ if(r.score>lead) lead=r.score; });
      rows.slice().sort(function(a,b){ return b.score-a.score; }).forEach(function(r,i){
        var o=by[r.fw]||(by[r.fw]={fw:r.fw, lang:r.lang, score:0, raw:0, miss:r.miss, dec:r.dec, cells:{}});
        o.score+=r.score; o.raw+=r.raw;
        o.cells[k]={v:r.score, raw:r.raw, rank:i+1, of:rows.length,
                    bar:lead>0?r.score/lead*100:0, best:lead>0 && r.score>=lead-0.05};
      });
    });
    return {pids:fams, rows:Object.keys(by).map(function(fw){ return by[fw]; })};
  }

  // ── render ──────────────────────────────────────────────
  // Why a row scored what it did. The completeness factor is the one part of
  // the composite that is not read off a benchmark, so it is always shown with
  // the raw sum it was applied to rather than folded silently into one number.
  // Only the framework tiers carry the factor at all. An engine or a reverse
  // proxy is not unassessed, it is out of scope for the question, so its row
  // says nothing about completeness rather than reporting a clean sheet it was
  // never given.
  function cmpGraded(fw){ return cmpInScope() && CMP_TYPES.indexOf(typeOf(fw))>=0; }
  // Four bands rather than a continuous ramp.
  //
  // A gradient asks the eye to read a value off a hue, which it cannot do: with
  // five stops interpolated, 62% and 74% are two barely different yellow-greens
  // and the column stops being scannable. It also spent most of its hues on a
  // range almost nothing occupies - measured over all 1,650 published cells the
  // distribution is bimodal, 24% of them under 10% of their column leader and
  // 22% over 90%, median 27%.
  //
  // Four steps, one hue each, so a cell has a band rather than a shade and the

  function cmpTip(r){
    if(!cmpGraded(r.fw)) return 'composite '+r.score.toFixed(1);
    if(!r.dec) return 'composite '+r.score.toFixed(1)+' - completeness not assessed yet, so nothing is deducted (x1.00)';
    if(!r.miss.length) return 'composite '+r.score.toFixed(1)+' - routing, middleware, request and response all covered, so nothing is deducted (x1.00)';
    return 'composite '+r.score.toFixed(1)+' = '+r.raw.toFixed(1)+' raw x '+cmpFactor(r.fw).toFixed(3)

  // The points the completeness factor took off, shown only where it took any.
  //
  // This used to print (0) on every assessed row, on the argument that a figure
  // appearing only on penalised rows reads as a mark against them. In practice
  // it was the other way round: 89 of the 114 assessed entries lose nothing, so
  // (0) was noise on the large majority of rows and the ones that actually lost
  // points had to be picked out of it. Nothing deducted, nothing said.
  //
  // What that gives up is the at-a-glance difference between "assessed, nothing
  // deducted" and "not assessed yet" - both are a bare score now. They are still
  // different claims, and the tooltip still tells them apart in words, which is
  // where that distinction was really being carried anyway.
  //
  // Taken off the displayed figures rather than the exact ones, so what is on
  // screen always reconciles: 416 (-22) never sits next to a raw 438.4. The
  // factor is at most 1, so d is never positive and already carries its sign.
  function cmpDelta(r){

  // ── deep linking via URL hash ───────────────────────────
  function writeHash(){
    if(state.view==='doc'){
      var dh='#doc='+state.doc;
      if(location.hash!==dh){ try{ history.replaceState(null,'', dh); }catch(e){} }
      return;
    }
    var p=[];
    if(state.view==='profile'){ p.push('p='+state.profile); p.push('conns='+state.conns); }
    else { if(state.scope!=='h1') p.push('scope='+state.scope); if(state.useMem) p.push('mem=1'); if(state.rescale) p.push('rescale=1'); if(state.heat) p.push('heat=1'); }
    var _dps=defProfileSort(state.profile);
    var defSort = state.view==='profile' ? (state.sortKey===_dps.k&&state.sortDir===_dps.d) : (state.sortKey==='score'&&state.sortDir===-1);
    if(!defSort) p.push('sort='+state.sortKey+':'+state.sortDir);
    var ts=state.types.slice().sort().join(','); if(ts!=='emerging,flagship') p.push('type='+ts);
    if(!state.showTuned) p.push('tuned=0');
    if(state.compactFw) p.push('fw=compact');
    if(state.lang) p.push('lang='+encodeURIComponent(state.lang));
    if(state.q) p.push('q='+encodeURIComponent(state.q));
    var nh=p.length?('#'+p.join('&')):'';
    if(location.hash!==nh){ try{ history.replaceState(null,'', nh||(location.pathname+location.search)); }catch(e){} }
  }
  var _hashT; function scheduleHash(){ clearTimeout(_hashT); _hashT=setTimeout(writeHash,80); }
  function restoreFromHash(){
    var h=location.hash.slice(1); if(!h) return;
    var p={}; h.split('&').forEach(function(s){ var i=s.indexOf('='); if(i>0) p[s.slice(0,i)]=decodeURIComponent(s.slice(i+1)); });
    if(p.doc){ location.replace(docUrl(p.doc)); return; }   // legacy #doc=x bookmark -> /docs/x/
    if(p.type){ var ts=p.type.split(',').filter(Boolean); if(ts.length) state.types=ts; }
    if(p.hasOwnProperty('tuned')) state.showTuned = p.tuned!=='0';
    if(p.hasOwnProperty('fw')) state.compactFw = p.fw==='compact';
    state.lang = p.lang || '';
    state.q = p.q || '';
    if(p.p && PROF[p.p]){
      state.view='profile'; state.profile=p.p;
      var cc=+p.conns; state.conns=(PROF[p.p].conns.indexOf(cc)>=0)?cc:PROF[p.p].conns[0];
      var _ds=defProfileSort(state.profile); state.sortKey=_ds.k; state.sortDir=_ds.d;
      expanded.add('detailed'); expanded.add(familyOf(PROF[p.p]));
    } else {
      state.view='composite';
      state.scope=(p.scope && SCOPES.some(function(s){return s.k===p.scope;}))?p.scope:'h1';
      state.useMem = p.mem==='1';
      state.rescale = p.rescale==='1';
      state.sortKey='score'; state.sortDir=-1;
      expanded.add('composite');
    }
    if(p.sort){ var sp=p.sort.split(':'); if(sp[0]){ state.sortKey=sp[0]; state.sortDir=(+sp[1]===1)?1:-1; } }
    var q=document.getElementById('q'); if(q) q.value=state.q;
  }

  function val(r,k){ if(k==='rps')return r.rps||0; if(k==='bw')return bw(r.bandwidth); if(k==='bwreq'){var b=bw(r.bandwidth),q=r.rps||0;return q>0?b/q:0;} if(k==='inbw')return bw(r.input_bw); if(k==='avg')return lat(r.avg_latency); if(k==='p99')return lat(r.p99_latency); if(k==='l1mscore')return latScore(state.profile,r.fw); if(k==='p999')return lat(r.p99_9_latency); if(k==='cpureq')return (r.cpu_per_req_us!=null)?+r.cpu_per_req_us:Infinity; if(k==='cputot'){var t=cpuTotPct(r); return t==null?Infinity:t;} if(k==='cpu')return cpu(r.cpu); if(k==='mem')return mem(r.memory); if(k==='fw')return (r.fw||'').toLowerCase(); return 0; }
  function fmtBytes(n){ if(n>=1048576)return (n/1048576).toFixed(2)+' MB'; if(n>=1024)return (n/1024).toFixed(1)+' KB'; return Math.round(n)+' B'; }
  // Explorer columns - profile-specific (json-comp adds BW/req, upload adds In BW);
  // low-priority columns drop out below width breakpoints so the grid never overflows.
  // The fixed-rate profiles score on cost, not throughput. The rate is pinned, so every
  // entry that finishes serves the same load and rps cannot separate them; what
  // can is the bill and the tail. Kept byte-for-byte equivalent to
  // scripts/latency_1m_score.py, which is the reference implementation and
  // carries the reasoning for the two different curve shapes.
  // Offered rate that earns the whole rate factor, per profile. 95% of target:
  // the generator never quite reaches its own number, so the threshold has to
  // sit below it. Mirrors FULL_RATE in scripts/latency_score.py.
  var LAT_FULL={'latency-1m':950000, 'latency-10k':9500, 'latency-500k-8cpu':475000, '8gbit':47500};
  // Logical CPUs each fixed-rate profile is pinned to, per scripts/lib/profiles.sh:
  // cpuset 0-31,64-95 is 32 cores with both threads, so 64; latency-500k-8cpu
  // gets 0-3,64-67, four cores with both threads. Used to turn CPU-per-request
  // into "how much of the machine it was allowed did this take".
  var LAT_CPUS={'latency-1m':64, 'latency-10k':64, '8gbit':64, 'latency-500k-8cpu':8};
  // CPU microseconds per second / 1e6 = cores in use; over the allowance = 0-100%.
  function cpuTotPct(r,pid){
    if(r==null||r.cpu_per_req_us==null) return null;
    var q=r.rps||0; if(!(q>0)) return null;
    return (+r.cpu_per_req_us)*q/1e6/(LAT_CPUS[pid]||64)*100;
  }
  var LAT_W_CPU=0.50, LAT_W_P99=0.25, LAT_W_MEAN=0.25, LAT_DEC=3, LAT_MEAN_DEC=1;
  var _latScores={};
  function isLatProfile(pid){ return Object.prototype.hasOwnProperty.call(LAT_FULL,pid); }
  function clamp01(v){ return v<0?0:v>1?1:v; }
  // CPU spans ~3.3x across rate-holders, so a plain ratio behaves over it.
  function latLinear(v,b){ return (!v||!b||v<=0||b<=0)?0:clamp01(b/v); }
  // The p99 tail spans five orders of magnitude, where a ratio would collapse
  // to zero for everyone but the leader. A three-decade scale keeps the field
  // separable and still charges a third of the term for every 10x. The mean is
  // the queueing signal (in-flight requests over the rate) and spans ~2x among
  // entries that answer without queueing, so it gets one decade: ten times the
  // best mean is a request spending nine tenths of its life waiting, worth 0.
  function latDecade(v,b,d){ d=d||LAT_DEC; return (!v||!b||v<=0||b<=0||!isFinite(v))?0:clamp01(1-Math.log(Math.max(v,b)/b)/Math.LN10/d); }
  // Build from the canonical result set when the caller has no rows of its own,
  // so the composite and the detail view agree on the same normalisation.
  function latEnsure(pid){
    if(_latScores[pid]) return;
    var p=PROF[pid], rows=[];
    if(p) p.conns.forEach(function(c){ rows=rows.concat(D.results[pid+'-'+c]||[]); });
    latBuild(pid, rows);
  }
  function latBuild(pid, rows){
    var out={}; _latScores[pid]=out;
    var bc=Infinity,bp=Infinity,bm=Infinity, full=LAT_FULL[pid]||1;
    rows.forEach(function(r){
      var c=+r.cpu_per_req_us, p=lat(r.p99_latency), m=lat(r.avg_latency);
      if(c>0) bc=Math.min(bc,c);
      if(p>0&&isFinite(p)) bp=Math.min(bp,p);
      if(m>0&&isFinite(m)) bm=Math.min(bm,m);
    });
    rows.forEach(function(r){
      var rf=clamp01((r.rps||0)/full);
      out[r.fw]=100*rf*(LAT_W_CPU*latLinear(+r.cpu_per_req_us,bc)
                       +LAT_W_P99*latDecade(lat(r.p99_latency),bp)
                       +LAT_W_MEAN*latDecade(lat(r.avg_latency),bm,LAT_MEAN_DEC));
    });
  }
  function latScore(pid,fw){ latEnsure(pid); return (_latScores[pid]||{})[fw]||0; }

  // What a profile's detail view ranks on. Everything here is "most requests

  function defProfileSort(id){ return isLatProfile(id) ? {k:'l1mscore',d:-1} : {k:'rps',d:-1}; }

      c.push({k:'p99', label:'p99', num:true, w:'92px', min:0, tip:TIP.p99});

    if(state.profile==='upload') c.push({k:'inbw', label:'In BW', num:true, w:'118px', min:640, tip:'Input bandwidth - bytes/sec the server ingests (upload throughput).'});

    VIEWCOLS=c.slice(3).map(function(x){ return {k:'p:'+x.k, label:x.label}; });
    return c.filter(function(x){ return W>=x.min && !colHidden('p:'+x.k); });

  var CARDS_NOTE='<p class="cards-note">Key numbers per entry. <button type="button" data-mview="table">Open the full table</button></p>';
  function compositeCards(rows, pids, rankMap, maxScore, all){
