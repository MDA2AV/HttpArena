[package]
name = "httparena-salvo"
version = "0.1.0"
edition = "2021"

[dependencies]
salvo = { version = "0.96", features = ["rustls", "compression"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
