# HTTP Arena configuration for the Neton entry.
#
# application.conf outranks the DSL, so the arena's port map and connection
# ceiling are set here rather than in code.

[application]
name = "neton-httparena"
debug = false

[server]
port = 8080
host = "0.0.0.0"

[http]
# 0 disables the per-request timeout. The wrapper costs two coroutine objects and
# their JobSupport state transitions on every request, and every arena profile
# already carries its own deadline, so a second one on the server buys nothing
# here. Shutdown draining is unaffected — the adapter keeps its own 5s grace.
timeout = 0
# Ceiling on requests in flight, not on connections: the framework's admission
# gate answers 503 the moment it is reached.
#
# It has to clear what the profiles actually offer, which for h2 is connections
# times streams, not connections:
#
#   baseline / limited-conn   4096 x 1     =   4,096
#   async                    32000 x 1     =  32,000
#   pipelined                 4096 x 16    =  65,536
#   json-h2c                  4096 x 32    = 131,072
#   baseline-h2c              4096 x 100   = 409,600   <- peak
#
# The previous 65,536 was the pipelined figure and nothing more; baseline-h2c at
# 4096 connections offered 409,600 and the entry shed 411,799 requests as 5xx,
# 55.7% of the run. The reported rps counts 2xx only, so the failures did not
# show up in the number — they were only visible in the saved status counters.
#
# 524,288 clears the peak with room to spare. The counter itself costs nothing;
# the memory belongs to the requests actually in flight, and the box has 251 GiB.
maxConnections = 524288
# No response compression is implemented, so nothing claims to do it.
enableCompression = false

[logging]
# Measured runs must not spend request time on log lines.
level = "WARN"
