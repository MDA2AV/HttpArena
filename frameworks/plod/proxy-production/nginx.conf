# The edge of production-stack: stock nginx terminating TLS and h2 on 8443,
# serving /static/* from disk, and forwarding /public/* and /api/* over
# HTTP/1.1 to the server on PROXY_PORT, 8085; /api/* only after authsvc has
# verified the bearer token. Other paths get nginx's 404. Modelled on
# libuvcpp's and aspnet-minimal_nginx's proxy-production/nginx.conf.
# compose.production-stack.yml sets worker_processes to the edge's cpuset:
# nginx's auto counts the host's CPUs.

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   off;
    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;
    server_tokens off;

    # The .gz copy of a static file where the client takes gzip: stock nginx
    # has no brotli.
    gzip_static on;
    gzip_vary   on;

    upstream server {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    upstream authsvc {
        server 127.0.0.1:9090;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # The loopback addresses rather than the wildcard: validate.sh runs the
    # entry's own container on the host network meanwhile, which holds
    # 0.0.0.0:8443 with SO_REUSEPORT, and a wildcard listen would share its
    # connections with it. Every URL the harness uses names localhost.
    server {
        listen 127.0.0.1:8443 ssl reuseport backlog=65535;
        listen [::1]:8443 ssl reuseport backlog=65535;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /static/ {
            alias /data/static/;
        }

        location = /_auth {
            internal;
            proxy_pass http://authsvc/_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # X-User-Id is authsvc's, set over whatever the client sent; the
        # token stays at the edge.
        location /api/ {
            auth_request /_auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header Authorization "";
        }

        location /public/ {
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
