# The proxy of gateway-h3: proxy/nginx.conf with HTTP/3 beside h2, from the
# stock image's http_v3_module, on 8443 over UDP and TCP. Modelled on anole's
# proxy-h3/nginx.conf. compose.gateway-h3.yml sets worker_processes to the
# proxy's cpuset: nginx's auto counts the host's CPUs.

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   off;
    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;
    server_tokens off;

    # The .gz copy of a static file where the client takes gzip: stock nginx
    # has no brotli.
    gzip_static on;
    gzip_vary   on;

    upstream server {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # The loopback addresses rather than the wildcard, as in proxy/nginx.conf:
    # validate.sh runs the entry's own container on the host network
    # meanwhile, and a specific address wins the lookup over its wildcard.
    server {
        listen 127.0.0.1:8443 quic reuseport;
        listen [::1]:8443 quic reuseport;
        listen 127.0.0.1:8443 ssl reuseport backlog=65535;
        listen [::1]:8443 ssl reuseport backlog=65535;
        http2 on;
        http3 on;
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /static/ {
            alias /data/static/;
        }

        location / {
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
