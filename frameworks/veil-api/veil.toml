# veil API library settings for HttpArena: the recommended production settings
# (docs/guide/library-production.md), with the four HttpArena listeners in one process.

[[listener]]
name = "plain"                       # HTTP/1.1, h2c by prior knowledge (gRPC), WebSocket
listen = "0.0.0.0:8080"
tls = false

[[listener]]
name = "h1tls"                       # TLS, HTTP/1.1 only
listen = "0.0.0.0:8081"
tls = true
http2 = false

[[listener]]
name = "h2c"                         # cleartext HTTP/2
listen = "0.0.0.0:8082"
tls = false

[[listener]]
name = "https"                       # TLS h2 + HTTP/1.1, and HTTP/3 on UDP 8443
listen = "0.0.0.0:8443"
tls = true
http2 = true
http3 = true

[server]
graceful_shutdown_timeout_secs = 5

[tls]
cert_path = "/certs/server.crt"
key_path = "/certs/server.key"

[logging]
level = "info"
format = "json"

[access_log]
enabled = false

[api]
openapi_enabled = false
compression = true
max_body_size = 1048576

[performance]
open_file_cache_watch = true         # static files follow the disk

[static_file_cache]
watch = true
