[package]
name = "httparena-veil-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
veil = { package = "veil-proxy", version = "=0.10.1", default-features = false, features = ["full-container", "api"] }
prost = "0.13"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
veil-build = { package = "veil-proxy-build", version = "=0.10.1" }

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
