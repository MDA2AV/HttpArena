[package]
name = "httparena-proa"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrayvec = "0.7.8"
axum = "0.8.9"
deadpool-postgres = "0.14.1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
itoa = "1.0"
libdeflater = "1"
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
proa = { git = "https://github.com/Proa-Labs/proa.git", rev = "141a0c7d88e312269f0715130f9fceb421dfe3a5", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
sonic-rs = "0.5"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
