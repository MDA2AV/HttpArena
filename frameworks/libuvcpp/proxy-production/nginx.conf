# libuvcpp production-stack edge: stock nginx terminating TLS + HTTP/2 on 8443,
# with the profile's three-way path split.
#
#   /static/*   served here from disk, never reaching the server
#   /public/*   forwarded unauthenticated
#   /api/*      forwarded only after authsvc has verified the bearer token
#
# Why nginx rather than Caddy, which this stack used before: the profile's own
# architecture diagram names nginx and `auth_request`, and Caddy's edge is far
# more expensive per request. On a 4-core stand-in for this shape, at the
# profile's own c=256 reads + c=32 writes: Caddy 8.4k req/s with its edge at
# 440 us/req, Caddy again with a connection pool added to the forward_auth
# upstream (which the Caddyfile never configured -- the shipped one pools only
# the backend) 9.5k at 392 us, and this file 39.2k at 101 us. The edge was
# pinned at its core budget in all three arms; the best Caddy arm is still 4.1x
# behind on throughput and 3.9x behind on edge CPU per request. ../proxy/
# nginx.conf has the same finding at the gateway profile's multiplexing.
# The h3 stacks keep Caddy only because h3 needs QUIC.
#
# Every path this profile exercises was dumped from both edges and compared
# byte for byte: same status and same body throughout, headers differing only in
# the ways ../proxy/nginx.conf documents. The one behavioral difference is a
# request matching none of the three prefixes -- Caddy answered an empty 200,
# this answers nginx's 404 -- and nothing reads it: the load URIs cover only
# /static/, /public/ and /api/, and neither this service nor the server declares
# a healthcheck.
#
# The auth subrequest fires on every /api/* call and nothing caches it: the
# HMAC-SHA256 that costs is part of what the profile measures, and the rules
# forbid proxy_cache on /_auth. authsvc answers 200 with X-User-Id or 401, and
# a 401 from the subrequest becomes nginx's 401 -- the server is never reached.
#
# `Authorization ""` is a decision, not an accident of auth_request. Both edges
# were run against a header-dumping backend on the rig, and Caddy's forward_auth
# *does* pass the bearer token through along with the X-User-Id it copied; the
# comment this file replaced claimed otherwise and was simply wrong. Dropping it
# here is the tighter reading of the profile: JWT verification happens at the
# edge, the server is handed the identity authsvc resolved and nothing else, and
# the token cannot be re-verified downstream. It also keeps ~200 bytes of a
# per-request header off every /api/* hop. The server refuses any /api/* request
# that arrives with no X-User-Id at all, which is what makes the POST branch --
# the one that writes rows -- safe.
#
# worker_processes is a literal, coupled to the edge service's `cpuset` in
# compose.production-stack.yml (0-14,64-78 = 30 logical CPUs). nginx's
# `worker_processes auto` counts the *host's* online CPUs and ignores a
# container cpuset, and `worker_cpu_affinity auto` re-pins workers outside it
# altogether. ../proxy/nginx.conf has the measurement.

user  nginx;
worker_processes 30;
error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The load generator never repeats a request, so an access log is pure cost.
    access_log off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  300s;
    keepalive_requests 1000000;
    server_tokens      off;

    # Serve the shipped .gz twin of a static asset and announce both encodings.
    # The gateway edge does the same; ../proxy/nginx.conf explains why the .gz
    # twin and not the .br one.
    gzip_static on;
    gzip_vary   on;

    # nginx wants scratch directories that the upstream connection pools spill
    # into; the image is built with these created and owned by the nginx user.
    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # One pooled h1 connection per in-flight request, for both upstreams. The
    # backend numbers are the Caddyfile's. The authsvc pool is not: that
    # Caddyfile never configured a transport for its forward_auth upstream, and
    # the rig counted the consequence -- 0.77 connections opened per auth
    # subrequest against 0.024 with this pool, which is most of why its auth leg
    # cost 96 us/req where this one costs 20.
    upstream backend {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    upstream authsvc {
        server 127.0.0.1:9090;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # The two loopback addresses rather than the wildcard `listen 8443`, and
    # that is load-bearing. The harness validates a compose stack while the
    # entry's own standalone container is still up (`--network host`, and
    # /certs mounted because this profile subscribes to an h2 test), so that
    # process holds 0.0.0.0:8443 as well -- one listening socket per loop with
    # SO_REUSEPORT, 64 of them on the reference runner. A wildcard `listen`
    # lands in the *same* reuseport group as those sockets and the kernel
    # hashes localhost:8443 across all of them, so most of the checks reach
    # the server directly, where /api/* is deliberately unregistered
    # (main.cc:1924) and answers 404. Measured on the rig against a 64-socket
    # wildcard holder: wildcard 3/24 requests to the edge, loopback 24/24.
    # Caddy, which this file replaced, never had the problem because
    # `https://localhost:8443` makes it bind these same two addresses, and a
    # specific bind wins the listener lookup outright -- the wildcard socket is
    # then never chosen at all. Every URL the harness uses is `localhost`.
    server {
        listen 127.0.0.1:8443 ssl http2 backlog=65535 reuseport;
        listen [::1]:8443 ssl http2 backlog=65535 reuseport;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The X-User-Id the auth subrequest answered with, handed to whichever
        # /api/ location runs it.
        auth_request_set $auth_user_id $upstream_http_x_user_id;

        # The auth subrequest itself: GET /_auth at authsvc, with the client's
        # Authorization header and no body. `internal` keeps a client from
        # reaching it directly.
        location = /_auth {
            internal;
            proxy_pass http://authsvc/_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # The 30% of the profile's URIs that never reach the server: a file open
        # plus sendfile, with the .gz twin chosen when the client accepts it.
        location /static/ {
            alias /data/static/;
        }

        # Unauthenticated, uncached: the server answers /public/baseline and
        # /public/json/{n} straight from the dataset.
        location /public/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Authenticated. auth_request runs first and its 401 short-circuits the
        # location, so an unauthenticated /api/ never reaches the server -- not
        # even for the POST that would write a row.
        location /api/ {
            auth_request /_auth;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization "";
        }
    }
}
