# libuvcpp gateway edge for gateway-64: stock nginx terminating TLS + HTTP/2 on
# 8443, serving /static/* from disk, and proxying everything else over h1 to the
# framework server on 8085.
#
# Why nginx rather than the Caddy the h3 stack still uses (see ../proxy-h3/):
# gateway-64 drives 512 connections x 32 streams = 16,384 concurrent requests,
# and over the profile's *HTTP/1.1* upstream hop that multiplexing is what the
# edge costs. On the reference machine Caddy edges land at 372-404 us/req there
# (libuvcpp, sark, tako -- three entries, same figure) while nginx edges land at
# 100-110 (vanilla-epoll, fulmine, morojs), and the same ~3x gap reproduces on a
# local two-service rig. That made the edge this stack's bottleneck: the proxy
# sat at 96% of its 32 logical CPUs while the server used 23% of its own. The
# profile lists "proxy choice" as one of the things entries compete on, and its
# own example compose uses nginx. The h3 profile cannot follow, because h3 needs
# QUIC and nginx has no HTTP/3 without a custom build against a QUIC library.
#
# worker_processes is a literal on purpose, and it is coupled to the proxy
# service's `cpuset` in compose.gateway.yml (0-15,64-79 = 32 logical CPUs).
# nginx's `worker_processes auto` counts the *host's* online CPUs and ignores a
# container cpuset, and `worker_cpu_affinity auto` is worse than that: it
# re-pins each worker to a CPU of its own choosing and escapes the cpuset
# entirely. Both were measured on this box under `taskset -c 8-11`, where
# `auto` + `worker_cpu_affinity auto` produced 18 workers pinned across CPUs
# 0-17. Change the cpuset and this number has to change with it.
#
# The static assets ship a `.gz` and a `.br` twin each; this edge serves the
# gzip one (`gzip_static`), which is what the official nginx image can do and
# what the profile's other nginx edges do. Serving the brotli twin instead needs
# nginx-mod-http-brotli, and a module built for one nginx build cannot be loaded
# into another, so it would mean taking both nginx and the module from a
# distribution rather than the official image. It was measured on the rig at
# this profile's concurrency and the two are a wash (brotli sends 47,275 B of
# app.js against gzip's 54,813, and the medians of nine runs came out within the
# rig's own run-to-run spread), so this keeps the stock image.

user  nginx;
worker_processes 32;
error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The load generator never repeats a request, so an access log is pure cost.
    access_log off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  300s;
    keepalive_requests 1000000;
    server_tokens      off;

    # Serve the shipped .gz twin in place of the identity file when the client
    # accepts gzip, and say so in Vary so the two encodings stay distinguishable
    # to anything caching in front of this.
    gzip_static on;
    gzip_vary   on;

    # nginx wants scratch directories that the upstream connection pool spills
    # into; the image is built with these created and owned by the nginx user.
    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # One pooled h1 connection per in-flight request is what this profile asks
    # for; `keepalive 2048` is the idle pool, and nginx opens beyond it under
    # load rather than queueing. Raising it changed nothing measurable on the
    # rig, so it stays at the value the Caddy config used.
    upstream backend {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # Loopback addresses rather than the wildcard `listen 8443`, for the same
    # reason ../proxy-production/nginx.conf spells out at length: the harness
    # validates a compose stack while the entry's own standalone container is
    # still up on `--network host` with /certs mounted, so a wildcard listen
    # shares its reuseport group with that process's per-loop sockets and
    # `localhost:8443` gets hashed across both servers. This stack's checks do
    # not notice -- /static/*, /json, /async-db and /baseline2 are exactly the
    # paths the standalone entry answers too, which is why the split went
    # unseen here until the production-stack checks, whose /api/* is not on
    # that entry's 8443 listener, caught it. Every URL the harness uses is
    # `localhost`, so binding the loopbacks costs nothing.
    server {
        listen 127.0.0.1:8443 ssl http2 backlog=65535 reuseport;
        listen [::1]:8443 ssl http2 backlog=65535 reuseport;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The 30% of the profile's URIs that never reach the server: a file open
        # plus sendfile, with the .gz twin chosen when the client sends
        # `Accept-Encoding: br;q=1, gzip;q=0.8` -- which is what the load
        # generator sends. A file with no twin, a request with no
        # Accept-Encoding, and a Range request all fall through to the identity
        # path unchanged.
        location /static/ {
            alias /data/static/;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
