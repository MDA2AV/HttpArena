# gateway-64 — stock Caddy (TLS + h2 on 8443) in front of the libuvcpp server.
#
# Two services, which is what the profile fixes: `proxy` terminates TLS, serves
# /static/* off disk and forwards the dynamic endpoints over plain h1 to
# 127.0.0.1:8085; `server` answers /baseline2, /json/{n} and /async-db and
# nothing else.
#
# The server is deliberately **not** given /certs. main.cc opens its 8081 and
# 8443 listeners only when the certificate pair is readable, so with no certs
# mounted it comes up on its two cleartext ports alone and leaves every TLS port
# to the proxy. Mount them into both and the two would race for 8443.
#
# The backend's ports are 8085/8086 rather than the 8080/8082 it uses when run
# on its own, so that the compose hop does not collide with anything else that
# happens to be on the host. Both stacks are on `network_mode: host`, and the
# harness reaches the gateway profiles through an instance of this same image
# started as a plain container on that same host network -- it is up for the
# whole validation run, including while these compose stacks are. The compose
# `server` binds its ports at startup and exits 1 if a bind fails, so without
# this the backend would never come up and the edge would spend the run
# proxying to whatever else holds 8080.
#
# H1_PROBE_PORT=8080 is the flip side of the same fact, and it is why the
# server still ends up on 8080 after all. The benchmark's readiness probe has
# no gateway case -- scripts/lib/framework.sh falls through to
# `http://localhost:8080/baseline11?a=1&b=1` for every profile without one --
# and a profile whose probe fails is skipped with no numbers published. So the
# backend opens one more listener there, best-effort: during a validation run
# it loses the bind to the harness's instance and stays closed, and during a
# benchmark it comes up and answers the probe. Nothing measures it.
#
# Both services run on host networking, so the proxy's upstream hop is loopback
# rather than a bridge. The cpuset defaults below mirror the reference entry's
# split; PROXY_CPUSET / SERVER_CPUSET are the two knobs worth sweeping, and
# terminating TLS under multiplexed h2 is usually the expensive half.
services:
  proxy:
    build:
      context: ./proxy
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-15,64-79}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-16-31,80-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - DATASET_PATH=/data/dataset.json
      - H1_PORT=8085
      - H2C_PORT=8086
      - H1_PROBE_PORT=8080
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
