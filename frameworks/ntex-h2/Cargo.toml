[package]
name = "httparena-ntex-h2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
ntex = { version = "4.11", default-features = false, features = ["rustls", "serde"] }
ntex-files = "4.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
