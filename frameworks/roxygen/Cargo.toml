[package]
name = "roxygen-arena"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.12"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
roxygen_codec = { package = "ferroxygen_codec", version = "0.1" }
roxygen_core = { package = "ferroxygen_core", version = "0.1" }
roxygen_server = { package = "ferroxygen_server", version = "0.1" }
roxygen_transport = { package = "ferroxygen_transport", version = "0.1" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
