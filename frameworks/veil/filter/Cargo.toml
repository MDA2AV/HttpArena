[package]
name = "httparena-filter"
version = "0.1.0"
edition = "2021"
description = "Proxy-Wasm module that answers the HttpArena endpoints inside veil"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
