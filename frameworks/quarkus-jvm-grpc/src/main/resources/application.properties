quarkus.http.port=8080
quarkus.log.level=WARN
quarkus.banner.enabled=false

# gRPC is served by the main HTTP server (h2c on port 8080); Quarkus 4 removed
# the separate server and its quarkus.grpc.server.port / use-separate-server keys.

# TLS on port 8443
quarkus.http.ssl-port=8443
quarkus.http.tls-configuration-name=grpc-tls
quarkus.tls.grpc-tls.key-store.pem.0.cert=/certs/server.crt
quarkus.tls.grpc-tls.key-store.pem.0.key=/certs/server.key

# Performance tuning
quarkus.http.accept-backlog=-1
quarkus.http.idle-timeout=0
# Renamed in Quarkus 4 (was prefer-native-transport=true). No epoll/io_uring
# jar is on the classpath, so this stays on NIO exactly as 3.x did.
quarkus.vertx.native-transport=if-available
