[package]
name = "httparena-actix"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4.13", features = ["rustls-0_23", "compress-brotli", "compress-gzip"] }
flate2 = "1"
actix-files = "0.7"
actix-rt = "2"
askama = "0.16"
mimalloc = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
# Panics unwind (the default) instead of aborting. actix-http 3.20 unwraps
# HeaderName::from_bytes() on each request header, and that fails on a name
# longer than 65,535 bytes, which httparse lets through: a 100 KB header name
# still fits actix-http's 128 KiB request buffer. Unwinding, tokio's task
# harness catches the panic and only that connection is dropped; with
# panic = "abort" one such request took the whole server down.
