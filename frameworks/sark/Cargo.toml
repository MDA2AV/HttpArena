[workspace]
members = ["httparena"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
dope = "=0.71.0"
dope-fiber = "=0.71.0"
dope-test = "=0.71.0"
dope-tls = "=0.71.0"
dope-quic = "=0.71.0"
o3 = "=0.56.0"
sark = "=0.34.0"
sark-fiber = "=0.34.0"
sark-h1 = "=0.34.0"
sark-h2 = "=0.34.0"
sark-h3 = "=0.34.0"
sark-ws = "=0.34.0"
sark-grpc = "=0.34.0"
sark-json = "=0.34.0"
cartel-pg = "=0.41.0"
cartel-redis = "=0.41.0"
tent = "=0.2.3"
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
pin-project = "1.1.13"
url = { version = "=2.5.8", default-features = false, features = ["std"] }
percent-encoding = "=2.3.2"
getrandom = { version = "=0.4.3", features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
