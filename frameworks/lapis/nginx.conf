worker_processes auto;
error_log stderr error;
pid /tmp/nginx.pid;

events {
  worker_connections 16384;
}

http {
  access_log off;
  default_type text/html;
  lua_code_cache on;
  lua_package_path "/app/?.lua;;";

  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 256;

  client_max_body_size 30m;
  client_body_buffer_size 1m;

  server {
    listen 8080 reuseport backlog=16384;

    location / {
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }
  }

  # json-tls, when the TLS profiles mount the certificate. nginx refuses to
  # start if ssl_certificate points at a file that is not there, so the server
  # block is dropped in by the entrypoint rather than declared unconditionally.
  # A wildcard include matching nothing is not an error.
  include /app/tls.d/*.conf;
}
