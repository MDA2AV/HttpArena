# Same app as :8080, over TLS. Copied into /app/tls.d by the entrypoint only
# when the certificate is mounted.
server {
  listen 8081 ssl reuseport backlog=16384;

  ssl_certificate     /certs/server.crt;
  ssl_certificate_key /certs/server.key;

  location / {
    content_by_lua_block {
      require("lapis").serve("app")
    }
  }
}
