# CPU layout mirrors the competing nginx production stack across the 64 logical
# CPUs of the bench box's framework half: edge 0-14,64-78 (30) + authsvc 15,79
# (2) + cache 16-19,80-83 (8) + server 20-31,84-95 (24). Every service gets its
# OWN disjoint range — the sark io_uring `server` busy-polls, so sharing cores
# with the yielding edge/authsvc/cache starves them and the stack serves 0 RPS.
# cpuset is the SINGLE source of truth: sark reads its own sched_getaffinity
# (Launcher::allowed_cpus) and spawns one busy-poll worker per granted core, so
# there is no separate CPU_COUNT/CPU_CORE to keep in sync.
services:
  edge:
    build: ./proxy-production
    network_mode: host
    cpuset: "${GATEWAY_EDGE_CPUS:-0-14,64-78}"
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - authsvc
      - server

  cache:
    image: redis:7-alpine
    network_mode: host
    cpuset: "${GATEWAY_CACHE_CPUS:-16-19,80-83}"
    security_opt:
      - seccomp:unconfined

  authsvc:
    build: ../_shared/authsvc
    network_mode: host
    cpuset: "${GATEWAY_AUTH_CPUS:-15,79}"
    security_opt:
      - seccomp:unconfined
    environment:
      - JWT_SECRET=httparena-bench-secret-do-not-use-in-production
      - AUTHSVC_LISTEN=0.0.0.0:9090

  server:
    build:
      context: ../sark
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${GATEWAY_SERVER_CPUS:-20-31,84-95}"
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - SARK_HTTPARENA_BIND=0.0.0.0:8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=${DATABASE_MAX_CONN:-128}
      - REDIS_URL=redis://127.0.0.1:6379
      - SARK_HTTPARENA_PER_IP_CAP=0
      - SARK_HTTPARENA_H1_ONLY=1
    depends_on:
      - cache
