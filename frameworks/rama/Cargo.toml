[package]
name = "httparena-rama"
version = "0.1.0"
edition = "2024"

[dependencies]
rama = { version = "0.4", features = ["http-full", "rustls", "aws-lc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
