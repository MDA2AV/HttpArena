@import java.util.List
@import httparena.FortunesController.Fortune

@args (List<Fortune> fortunes)
<!DOCTYPE html>
<html>
<head><title>Fortunes</title></head>
<body>
<table>
<tr><th>id</th><th>message</th></tr>
@for (Fortune f : fortunes) {
<tr><td>@f.id()</td><td>@f.message()</td></tr>
}
</table>
</body>
</html>
