micronaut.application.name=micronaut-httparena
micronaut.server.port=8080
# the upload profile posts 20 MB, the default cap is 10 MB
micronaut.server.max-request-size=32MB
# a body bound as a byte array is buffered, the default buffer cap of 10 MB is lower than the request cap
micronaut.server.max-request-buffer-size=32MB
# keep "items":[] in the response when the list is empty, the default drops it
micronaut.serde.serialization.inclusion=always

# --- extra profiles ------------------------------------------------------------------------
# HTTP/2 everywhere: ALPN on the TLS listeners, prior-knowledge and upgrade h2c on the plain ones
micronaut.server.http-version=2.0
micronaut.server.netty.listeners.http.port=8080
micronaut.server.netty.listeners.http.ssl=false
micronaut.server.netty.listeners.https.port=8081
micronaut.server.netty.listeners.https.ssl=true
micronaut.server.netty.listeners.h2tls.port=8443
micronaut.server.netty.listeners.h2tls.ssl=true
micronaut.server.netty.listeners.h2c.port=8082
micronaut.server.netty.listeners.h2c.ssl=false
# HTTP/3: a QUIC listener on UDP 8443, next to the TCP listener on the same port number
micronaut.server.netty.listeners.h3.family=QUIC
micronaut.server.netty.listeners.h3.port=8443
