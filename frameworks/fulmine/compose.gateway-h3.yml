# gateway-h3 - the same two services as compose.gateway.yml, reached over QUIC
# instead. Stock nginx with http3 on udp 8443, the same edge as ./proxy-nginx
# plus the quic listen. The proxy to server hop stays loopback h1.
services:
  proxy:
    build:
      context: ./proxy-h3
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-15,64-79}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-16-31,80-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - DATASET_PATH=/data/dataset.json
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
