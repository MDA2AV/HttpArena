# fulmine gateway-h3 edge, nginx.
#
# nginx terminates QUIC and h3 on udp 8443 (TLS and h2 on tcp 8443), serves /static/* from disk and
# forwards the rest to the fulmine server over loopback h1 through a keepalive pool. Caddy was here
# before: every entry behind it lands at 56-63k at 256 connections, whatever the backend.

# set to the cpuset size by workers.sh
worker_processes 1;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # precompressed .gz sidecars straight from disk, nothing is compressed per request
    gzip_static on;
    gzip_vary on;

    keepalive_timeout 300s;
    # the generator holds its connections for the whole run, so never close one on a request count
    keepalive_requests 1000000;

    access_log off;
    error_log /dev/stderr warn;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    server {
        # reuseport: one QUIC socket per worker, so the kernel spreads the connections
        listen 8443 quic reuseport;
        listen 8443 ssl backlog=65535 reuseport;
        http2 on;
        http3 on;
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # the profile asks the proxy to serve these from disk rather than forward them
        location /static/ {
            alias /data/static/;
            expires off;
            add_header Cache-Control "no-cache";
        }

        # everything else is the fulmine server
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
