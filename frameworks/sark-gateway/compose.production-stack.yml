x-runtime: &runtime
  network_mode: host
  security_opt:
    - seccomp:unconfined
  ulimits:
    memlock: -1
    nofile:
      soft: 1048576
      hard: 1048576

services:
  edge:
    <<: *runtime
    build: ./proxy-production
    cpuset: "${GATEWAY_EDGE_CPUS:-0-14,64-78}"
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      authsvc:
        condition: service_healthy
      server:
        condition: service_started

  cache:
    <<: *runtime
    image: redis:7-alpine
    cpuset: "${GATEWAY_CACHE_CPUS:-16-19,80-83}"
    volumes:
      - ${DATA_DIR}/redis-seed.txt:/seed.txt:ro
      - ${DATA_DIR}/redis-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  authsvc:
    <<: *runtime
    build: ../_shared/authsvc
    cpuset: "${GATEWAY_AUTH_CPUS:-15,79}"
    environment:
      - JWT_SECRET=httparena-bench-secret-do-not-use-in-production
      - AUTHSVC_LISTEN=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/_health"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  server:
    <<: *runtime
    image: httparena-sark
    build:
      context: ../sark
      dockerfile: Dockerfile
    cpuset: "${GATEWAY_SERVER_CPUS:-20-31,84-95}"
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
    environment:
      - SARK_HTTPARENA_BIND=0.0.0.0:8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=${DATABASE_MAX_CONN:-128}
      - REDIS_URL=redis://127.0.0.1:6379
      - SARK_HTTPARENA_H1_ONLY=1
    depends_on:
      cache:
        condition: service_healthy
