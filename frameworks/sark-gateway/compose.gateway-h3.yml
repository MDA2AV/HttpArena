# server busy-polls: its cpuset must stay disjoint from proxy's, else 0 RPS.
services:
  proxy:
    build:
      context: ./proxy
    network_mode: host
    cpuset: "${GATEWAY_PROXY_CPUS:-0-19,64-83}"
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server
  server:
    build:
      context: ../sark
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${GATEWAY_SERVER_CPUS:-20-31,84-95}"
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - SARK_HTTPARENA_BIND=0.0.0.0:8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=${DATABASE_MAX_CONN:-32}
      - SARK_HTTPARENA_PER_IP_CAP=0
      - SARK_HTTPARENA_H1_ONLY=1
