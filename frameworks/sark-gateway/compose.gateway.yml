x-runtime: &runtime
  network_mode: host
  security_opt:
    - seccomp:unconfined
  ulimits:
    memlock: -1
    nofile:
      soft: 1048576
      hard: 1048576

services:
  proxy:
    <<: *runtime
    build:
      context: ./proxy
    cpuset: "${GATEWAY_PROXY_CPUS:-0-19,64-83}"
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server
  server:
    <<: *runtime
    image: httparena-sark
    build:
      context: ../sark
      dockerfile: Dockerfile
    cpuset: "${GATEWAY_SERVER_CPUS:-20-31,84-95}"
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
    environment:
      - SARK_HTTPARENA_BIND=0.0.0.0:8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=${DATABASE_MAX_CONN:-32}
      - SARK_HTTPARENA_H1_ONLY=1
