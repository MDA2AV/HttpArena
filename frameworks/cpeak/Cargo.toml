[package]
name = "httparena-cpeak"
version = "0.1.0"
edition = "2021"

[dependencies]
cpeak = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for GET /async-db
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }

[profile.release]
codegen-units = 1
lto = "thin"
