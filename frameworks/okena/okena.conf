# okena for HttpArena: the endpoints answered by the httparena module
# (httparena.inc, assembled into okena) and okena's own static file server
# and compression.
okena {
    workers auto
    io_engine epoll                 # writes at once: no ciphertext of every connection
                                    # waiting for one submit (static-h2: 1.7x)
    overload off                    # a benchmark's load is the point, not something to shed
    handshake_budget 10ms wait=10s  # 4096 handshakes at once (json-tls): none dropped
    reload on-change                # a certificate renewed in place: served, no restart
}

# HTTP/1.1: baseline, pipelined, limited-conn, the latency profiles, async,
# json-comp; and the compliance route
http 0.0.0.0:8080 {
    route /baseline11    { handler baseline }
    route /pipeline      { respond 200 "ok" }
    route /json/*        { handler json; compress gzip br }
    route /delay/*       { handler delay }
    route /spec          { handler spec }
    route /spec/headers  { handler spec }
}

# HTTP/1.1 over TLS: json-tls, static-tls, 8gbit (ALPN http/1.1 only)
http 0.0.0.0:8081 {
    tls {
        cert /certs/server.crt key=/certs/server.key
        alpn http/1.1
    }
    route /json/*     { handler json }
    route /static/*   { files /data precompressed=br,gz memory=64MiB }
    route /echo       { handler echo }
    route /baseline11 { handler baseline }
}

# cleartext HTTP/2 with prior knowledge: baseline-h2c, json-h2c
http :8082 {
    http2 on
    route /baseline2     { handler baseline }
    route /json/*        { handler json }
    route /spec          { handler spec }
    route /spec/headers  { handler spec }
}

# HTTPS with HTTP/2 and HTTP/3: baseline-h2, static-h2, baseline-h3, static-h3
http :8443 {
    tls {
        cert /certs/server.crt key=/certs/server.key
    }
    http2 on
    http3 on
    route /baseline2     { handler baseline }
    route /static/*      { files /data precompressed=br,gz memory=64MiB }
    route /json/*        { handler json }
    route /spec          { handler spec }
    route /spec/headers  { handler spec }
}

# HTTP/1.1 over TLS for the TLS hardening section (tls_check): its own
# certificate directory, rotated underneath the running server (mounted only
# for that section: missing=skip leaves the listener closed elsewhere)
http :9000 {
    tls {
        cert /certs-tls/server.crt key=/certs-tls/server.key missing=skip
        alpn http/1.1
    }
    route /json/*     { handler json }
    route /baseline11 { handler baseline }
}
