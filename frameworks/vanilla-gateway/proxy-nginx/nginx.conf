# vanilla gateway-64 edge, nginx.
#
# nginx terminates TLS and h2 on 8443, serves /static/* from disk and forwards
# the rest to the vanilla-epoll server over loopback HTTP/1.1 through a
# keepalive pool, so the streams multiplexed on each client connection fan out
# across the server's workers instead of queueing behind one upstream socket.

worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # precompressed .gz sidecars straight from disk, nothing compressed per request
    gzip_static on;
    gzip_vary on;

    keepalive_timeout 65;
    # the generator holds its connections for the whole run: never close one on a count
    keepalive_requests 1000000;

    access_log off;
    error_log /dev/stderr warn;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # the profile has the proxy serve these from disk, never the server
        location /static/ {
            alias /data/static/;
            expires off;
            add_header Cache-Control "no-cache";
        }

        # /baseline2, /json, /async-db: the vanilla-epoll server
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
