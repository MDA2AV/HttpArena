# paozhu ORM pool config for the HttpArena Postgres sidecar.
#
# Template only: entrypoint.sh substitutes the __DB_*__ placeholders from
# DATABASE_URL / DATABASE_MAX_CONN and writes /app/conf/main/orm.conf. It is
# intentionally NOT installed next to server.conf: without a DB profile the
# harness injects no DATABASE_URL and paozhu must not open a pool at all.
#
# Two groups are required. paozhu's get_orm_config_file() splits on repeated
# keys: `type=main` populates conf_data[0] (edit pool), `type=second`
# populates conf_data[1], which async_get_pg_select_conn() actually uses for
# SELECTs. Both need the full connection settings.
[pg]
type     = main
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
maxpool  = 24
# The DB profiles only run SELECTs, so the edit pool is just the 24-backend
# reserve (minpool 0 = nothing resident); the rest of the budget belongs to
# the select pool below.
minpool  = 0
dbtype   = postgresql
charset  = utf8

type     = second
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
# Both rendered by entrypoint.sh from DATABASE_MAX_CONN. maxpool = db_max - 24
# is the process-wide select ceiling (db.cpp has no gate); the pool parks and
# is woken on connection return when full. minpool = ceil(maxpool / 4 slots)
# prebuilds the whole ceiling so a request never waits for a lazy connect.
# 4 = orm_ioc_num in server.conf.
maxpool  = __DB_SELECT_MAX__
minpool  = __DB_SELECT_MIN__
dbtype   = postgresql
charset  = utf8
