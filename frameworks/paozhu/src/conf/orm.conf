# paozhu ORM pool config for the HttpArena Postgres sidecar.
#
# Template only: entrypoint.sh substitutes the __DB_*__ placeholders from
# DATABASE_URL / DATABASE_MAX_CONN and writes /app/conf/main/orm.conf. It is
# intentionally NOT installed next to server.conf: without a DB profile the
# harness injects no DATABASE_URL and paozhu must not open a pool at all.
#
# Two groups are required. paozhu's get_orm_config_file() splits on repeated
# keys: `type=main` populates conf_data[0] (edit pool), `type=second`
# populates conf_data[1], which async_get_pg_select_conn() actually uses for
# SELECTs. Both need the full connection settings.
[pg]
type     = main
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
maxpool  = __DB_MAX_CONN__
# The DB profiles only run SELECTs, so the edit pool stays at one resident
# connection; the PG max_connections headroom belongs to the select pool.
minpool  = 0
dbtype   = postgresql
charset  = utf8

type     = second
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
maxpool  = __DB_MAX_CONN__
minpool  = 40
dbtype   = postgresql
charset  = utf8
