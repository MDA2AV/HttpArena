# paozhu ORM pool config for the HttpArena Postgres sidecar.
#
# Template only: entrypoint.sh substitutes the __DB_*__ placeholders from
# DATABASE_URL / DATABASE_MAX_CONN and writes /app/conf/main/orm.conf. It is
# intentionally NOT installed next to server.conf: without a DB profile the
# harness injects no DATABASE_URL and paozhu must not open a pool at all.
#
# Two groups are required. paozhu's get_orm_config_file() splits on repeated
# keys: `type=main` populates conf_data[0] (edit pool), `type=second`
# populates conf_data[1], which async_get_pg_select_conn() actually uses for
# SELECTs. Both need the full connection settings.
[pg]
type     = main
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
maxpool  = 0
# The DB profiles only run SELECTs; edit is never used. maxpool 0 opens nothing
# up front (slot_max_of floors a 0 budget at 1 per ioc slot, so a write would
# still lazily open at most one connection per slot). minpool 0 = nothing resident.
minpool  = 0
dbtype   = postgresql
charset  = utf8

type     = second
host     = __DB_HOST__
port     = __DB_PORT__
dbname   = __DB_NAME__
user     = __DB_USER__
password = __DB_PASSWORD__
pretable =
# Both rendered by entrypoint.sh from DATABASE_MAX_CONN. The DB profiles only
# SELECT and the edit pool is disabled, so select gets the full 256 budget to
# match ntex. Shared ORM mode uses the 32 HTTP iocs from the DB server cpuset;
# minpool = ceil(256 / 32) = 8 per slot, and slot_min_of() caps it at slot_max,
# so startup prebuilds all 256 select connections.
maxpool  = __DB_SELECT_MAX__
minpool  = __DB_SELECT_MIN__
dbtype   = postgresql
charset  = utf8
