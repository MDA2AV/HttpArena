; Main instance: plaintext HTTP/1.1 on 8080, ALPN h2 + HTTP/1.1 on 8443.
; Only the [default] section is defined, so every Host/SNI falls back to site 0.

[default]
threadmax                  = 1024
threadmin                  = 5
cothreadnum                = 12 ; ORM slot num and co base num
per_ioc_thread_num         = 10 ; 

httpport                   = 8080
httpsport                  = 8443

http2_enable               = 1
global_http2_enable        = 1

debug_enable               = 0
deamon_enable              = 0
show_visitinfo             = 0
ip6_listen_enable          = 0
mainhost                   = localhost

; Resolved against this file's directory by serverconfig.cpp; entrypoint.sh
; stages /certs/server.crt and /certs/server.key under these names.
certificate_chain_file     = server.crt
private_key_file           = server.key
tmp_dh_file                = dh4096.pem
chain_crt_file             = server.crt

session_type               = 1
; /static/* is served by a registered route reading /data/static directly, so
; the framework's native static path (and its on-disk compress cache) is never
; reached for those URLs.
static_file_compress_cache = 0
; Dead key at this pin: nothing in vendor/httpserver reads it. Kept for conf
; parity with upstream only.
staticfile_cache_num       = 0
resident_client_show       = 0
rate_limit_status          = 0
acme_auto                  = 0
ocsp_intv_time             = 14400

modelspath                 = ./models
serverpath                 = ./
viewpath                   = ./view
viewsopath                 = ./module/view
controlpath                = ./controller
controlsopath              = ./module/controller
temppath                   = ./temp
logpath                    = ./log
wwwpath                    = ./www/default
pluginspath                = ./plugins
libspath                   = ./libs

directorylist              = 0
index                      = index.html
; usehtmlcache is intentionally absent: a present key turns on the disk
; pre-check for dotted URLs. With the key absent that pre-check never runs, so
; it is not what keeps /static/:filename reachable, and BENCHMARK compiling the
; same pre-check out changes nothing here.
rewrite_404                = 0
upload_max_size            = 16777216
siteid                     = 1
groupid                    = 0
