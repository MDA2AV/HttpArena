; Second instance: HTTP/1.1-only TLS on 8081 for json-tls, plus cleartext
; HTTP/2 (h2c prior-knowledge) on 8082 for json-h2c. paozhu opens exactly one
; plaintext and one TLS port per process, so this listener needs its own process.
; http2_enable = 0 only affects the TLS ALPN callback (it advertises http/1.1
; exclusively); cleartext h2c is detected from the PRI * HTTP/2.0 preface by
; checkhttp2() and does not consult this switch.

[default]
threadmax                  = 1024
threadmin                  = 5
cothreadnum                = 64 ; Use this value < number of CPU cores
per_ioc_thread_num         = 1 ; 
orm_ioc_num                = 4 ;ORM io_context num;

httpport                   = 8082
httpsport                  = 8081

http2_enable               = 0
global_http2_enable       = 0

debug_enable               = 0
deamon_enable              = 0
show_visitinfo             = 0
ip6_listen_enable          = 0
mainhost                   = localhost

certificate_chain_file     = server.crt
private_key_file           = server.key
tmp_dh_file                = dh4096.pem
chain_crt_file             = server.crt

session_type               = 1
; /static/* is served by a registered route reading /data/static directly, so
; the framework's native static path (and its on-disk compress cache) is never
; reached for those URLs.
static_file_compress_cache = 0
; Dead key at this pin: nothing in vendor/httpserver reads it. Kept for conf
; parity with upstream only.
staticfile_cache_num       = 0
resident_client_show       = 0
rate_limit_status          = 0
acme_auto                  = 0
ocsp_intv_time             = 14400

modelspath                 = ./models
serverpath                 = ./
viewpath                   = ./view
viewsopath                 = ./module/view
controlpath                = ./controller
controlsopath              = ./module/controller
; Separate scratch dirs so the two processes never race on temp/log files.
temppath                   = ./temp-h1
logpath                    = ./log-h1
wwwpath                    = ./www/default
pluginspath                = ./plugins
libspath                   = ./libs

directorylist              = 0
index                      = index.html
rewrite_404                = 0
upload_max_size            = 16777216
siteid                     = 1
groupid                    = 0
