# gateway-64 - stock nginx (TLS + h2 on 8443) in front of the morojs server,
# forwarding the dynamic endpoints over loopback h1 with keepalive. The server
# gets no certs here, so it comes up cleartext on 8080 only and starts no TLS
# process. gateway-h3 uses the same edge with QUIC, in ./proxy-h3.
#
# The CPU split is the knob worth sweeping, via PROXY_CPUSET / SERVER_CPUSET.
# Terminating TLS under multiplexed h2 is the heavier half even for nginx, so
# the proxy gets 20 cores against 12, the same split the fulmine entry holds.
services:
  proxy:
    build:
      context: ./proxy-nginx
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-19,64-83}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-20-31,84-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - DATASET_PATH=/data/dataset.json
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
