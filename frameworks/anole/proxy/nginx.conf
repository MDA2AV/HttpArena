# gateway-64 edge: stock nginx terminating TLS + HTTP/2 on 8443, serving
# /static/* from disk, and proxying the rest over pooled HTTP/1.1 keep-alive
# to Anole on 127.0.0.1:8085 (standard mode: h2c and Unix sockets upstream are
# for tuned entries).
#
# worker_processes is set at start to the container's CPU count (workers.sh).
#
# The static files ship .gz and .br twins; gzip_static serves the .gz one to
# clients that accept gzip (the load generator does), which is what the
# official image can do without a third-party brotli module.

user  nginx;
worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  300s;
    keepalive_requests 1000000;

    gzip_static on;
    gzip_vary   on;

    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    upstream anole {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # Loopback addresses, not the wildcard: during validation the entry's own
    # container is also up on the host network with a wildcard 8443, and a
    # wildcard listen here would share its reuseport group, so localhost:8443
    # would be hashed across both servers. A specific address wins the lookup.
    server {
        listen 127.0.0.1:8443 ssl backlog=65535 reuseport;
        listen [::1]:8443 ssl backlog=65535 reuseport;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /static/ {
            alias /data/static/;
        }

        location / {
            proxy_pass http://anole;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # The harness's readiness probe for compose profiles is plain
    # http://localhost:8080/baseline11; nothing is measured here. Loopback
    # addresses with reuseport, as on 8443, so this coexists with the entry's
    # own container on the wildcard 8080 during validation.
    server {
        listen 127.0.0.1:8080 reuseport;
        listen [::1]:8080 reuseport;

        location / {
            proxy_pass http://anole;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
