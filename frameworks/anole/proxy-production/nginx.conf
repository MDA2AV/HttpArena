# production-stack edge: stock nginx terminating TLS + HTTP/2 on 8443. It
# serves /static/* from disk, passes /public/* to Anole, and sends every
# /api/* request through auth_request to the shared authsvc (JWT HMAC-SHA256,
# unmodified, no caching) before passing it on with the verified X-User-Id.
# Anole is on 127.0.0.1:8085 over pooled HTTP/1.1 keep-alive.
#
# worker_processes is set at start to the container's CPU count (workers.sh).
# Loopback listens for the reason given in ../proxy/nginx.conf.

user  nginx;
worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  300s;
    keepalive_requests 1000000;

    gzip_static on;
    gzip_vary   on;

    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    upstream anole {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    upstream authsvc {
        server 127.0.0.1:9090;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    server {
        listen 127.0.0.1:8443 ssl backlog=65535 reuseport;
        listen [::1]:8443 ssl backlog=65535 reuseport;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        auth_request_set $auth_user_id $upstream_http_x_user_id;

        location = /_auth {
            internal;
            proxy_pass http://authsvc/_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /static/ {
            alias /data/static/;
        }

        location /public/ {
            proxy_pass http://anole;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /api/ {
            auth_request /_auth;
            proxy_pass http://anole;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization "";
        }
    }

    # The harness's readiness probe for compose profiles is plain
    # http://localhost:8080/baseline11; nothing is measured here. Loopback
    # addresses with reuseport, as on 8443, so this coexists with the entry's
    # own container on the wildcard 8080 during validation.
    server {
        listen 127.0.0.1:8080 reuseport;
        listen [::1]:8080 reuseport;

        location / {
            proxy_pass http://anole;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
