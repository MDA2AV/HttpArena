# production-stack: edge (stock nginx, proxy-production/: TLS + HTTP/2 on
# 8443, /static/* from disk, auth_request to authsvc on every /api/*), cache
# (redis:7-alpine with the shared seed entrypoint), authsvc (the shared JWT
# verifier, unmodified) and Anole on 127.0.0.1:8085. Anole's reads are
# cache-aside: its per-executor result cache (L1, TTL 1 s for items, 30 s for
# users) over Redis (L2, same TTLs) over Postgres; writes update Postgres and
# drop the key from both tiers.
#
# CPU split: edge 18 physical cores (36 logical), cache 2 (4), authsvc 6
# (12), server 6 (12). From a sweep on a 7-core rig, edge/cache/authsvc/
# server cores, req/s at 256 and 1024 connections:
#
#   2/1/1/3  20,016 29,099      3/2/1/1  133,569 117,493  <- best
#   2/1/2/2  28,130 32,697      2/2/1/2   89,848  74,332
#   3/1/1/2  14,942 37,053      2/2/2/1   90,375  73,956
#   3/1/2/1   7,554 18,674      2/3/1/1   91,294  75,667
#   4/1/1/1  11,098 14,964
#
# The shared entrypoint starts Redis with 4 I/O threads; on one core they
# and the main thread fight (it sat at 190% of its 2 CPUs even between
# runs) and every tier waited on it. Two cores fix that, a third adds
# nothing, so cache stays at 2. Then the edge is the bottleneck, and Anole
# needs one core in seven (most reads are L1 or L2 hits). Scaled to 32
# cores: cache 2, and the rest 3:1:1 between edge, authsvc and server.
# EDGE_CPUSET, CACHE_CPUSET, AUTHSVC_CPUSET, SERVER_CPUSET override them.
services:
  edge:
    build:
      context: ./proxy-production
    cpuset: "${EDGE_CPUSET:-0-17,64-81}"
    network_mode: host
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      authsvc:
        condition: service_healthy
      server:
        condition: service_started

  cache:
    image: redis:7-alpine
    cpuset: "${CACHE_CPUSET:-18-19,82-83}"
    network_mode: host
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${DATA_DIR}/redis-seed.txt:/seed.txt:ro
      - ${DATA_DIR}/redis-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  authsvc:
    build: ../_shared/authsvc
    cpuset: "${AUTHSVC_CPUSET:-20-25,84-89}"
    network_mode: host
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - JWT_SECRET=httparena-bench-secret-do-not-use-in-production
      - AUTHSVC_LISTEN=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/_health"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    cpuset: "${SERVER_CPUSET:-26-31,90-95}"
    network_mode: host
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - ANOLE_ROLE=gateway
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - REDIS_URL=redis://127.0.0.1:6379
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
    depends_on:
      cache:
        condition: service_healthy
