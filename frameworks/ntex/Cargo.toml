[package]
name = "httparena-ntex"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
ntex = { version = "4.5", default-features = false, features = ["compress", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
rcgen = "0.14"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
