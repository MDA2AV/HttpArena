[package]
name = "httparena-ntex"
version = "0.1.0"
edition = "2021"

[dependencies]
ntex = { version = "2", features = ["tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[profile.release]
opt-level = 3
codegen-units = 1
