[package]
name = "httparena-wtx-http2-tls"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { default-features = false, features = ["full"], version = "1.0" }
wtx = { default-features = false, features = ["crypto-ring", "http2-server-framework", "macros", "optimizations-std", "tokio"], version = "0.48" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
