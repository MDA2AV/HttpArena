micronaut.application.name=micronaut-httparena
micronaut.server.port=8080
# the upload profile posts 20 MB, the default cap is 10 MB
micronaut.server.max-request-size=32MB
# keep "items":[] in the response when the list is empty, the default drops it
micronaut.serde.serialization.inclusion=always

# --- tuned mode ---------------------------------------------------------------------------
# epoll native transport. The acceptor group is configured as well: the server channel type
# comes from the worker configuration and cannot be registered on a NIO acceptor loop.
micronaut.netty.event-loops.default.transport=epoll,nio
micronaut.netty.event-loops.parent.transport=epoll,nio
# no idle-connection handler in the pipeline
micronaut.server.idle-timeout=-1s
# skip request header and URL validation
micronaut.server.netty.validate-headers=false
micronaut.server.validate-url=false
