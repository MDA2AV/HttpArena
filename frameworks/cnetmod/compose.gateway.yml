services:
  proxy:
    build:
      context: ./proxy
    network_mode: host
    # Terminating TLS under multiplexed h2 costs the edge about 1.7x what the
    # backend spends per request, so it gets 20 cores against the server's 12.
    cpuset: "${PROXY_CPUSET:-0-19,64-83}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-20-31,84-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - H1_PORT=8085
      - H2C_PORT=8086
      - H1_PROBE_PORT=8080
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
