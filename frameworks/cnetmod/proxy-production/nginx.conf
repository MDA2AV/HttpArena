user nginx;
worker_processes 30;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    keepalive_requests 1000000;
    server_tokens off;
    gzip_static on;
    gzip_vary on;

    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    upstream backend {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    upstream authsvc {
        server 127.0.0.1:9090;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    server {
        listen 127.0.0.1:8443 ssl http2 backlog=65535 reuseport;
        listen [::1]:8443 ssl http2 backlog=65535 reuseport;

        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        auth_request_set $auth_user_id $upstream_http_x_user_id;

        location = /_auth {
            internal;
            proxy_pass http://authsvc/_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /static/ {
            alias /data/static/;
        }

        location /public/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /api/ {
            auth_request /_auth;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization "";
        }
    }
}
