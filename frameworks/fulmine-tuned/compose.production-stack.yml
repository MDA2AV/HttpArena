# production-stack: edge + cache + authsvc + server, on a 64 logical CPU budget.
#
#   edge     (caddy)  - 32, terminates TLS and h2 and serves /static off disk
#   cache    (redis)  -  2, single threaded on the data path, so more would sit idle
#   authsvc  (rust)   -  8, one HMAC per /api request and nothing else
#   server   (node)   - 22, the rest: JSON, Postgres, Redis client, one worker per core
#
# The edge gets the larger half because it is what saturates: the first run gave the whole stack
# 1537% of CPU against the 1600% its sixteen logical CPUs allow, so the edge was pegged and the
# other three sat idle. Terminating TLS under multiplexed h2 is the expensive half here, and it is
# the knob to sweep first through EDGE_CPUSET and SERVER_CPUSET.
#
# All four on host networking, so what goes between them is loopback rather than a bridge.
# Redis binds 6379, authsvc 9090, server 8080, the edge 8443.
services:
  edge:
    build: ./proxy-production
    network_mode: host
    cpuset: "${EDGE_CPUSET:-0-15,64-79}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    # authsvc has to be answering, not merely started: the edge asks it about every /api request,
    # so if it is not there the run measures 5xx from the edge and never reaches the server. That
    # is what the 5.11.0 run did, 260987 of them, and it read on the board as a 44% drop.
    depends_on:
      authsvc:
        condition: service_healthy
      server:
        condition: service_started

  cache:
    image: redis:7-alpine
    network_mode: host
    cpuset: "${CACHE_CPUSET:-16,80}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${DATA_DIR}/redis-seed.txt:/seed.txt:ro
      - ${DATA_DIR}/redis-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    # A cache that cannot bind is a silent downgrade, not a failure: with the
    # short `depends_on: - cache` form the server starts anyway and quietly
    # talks to whatever else holds 6379, so the run publishes numbers measured
    # against a Redis this profile never configured. Fail the stack instead.
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  authsvc:
    build: ../_shared/authsvc
    network_mode: host
    cpuset: "${AUTH_CPUSET:-17-20,81-84}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - JWT_SECRET=httparena-bench-secret-do-not-use-in-production
      - AUTHSVC_LISTEN=0.0.0.0:9090
    # /_health is the sidecar's own endpoint and wget is busybox's, so this needs nothing the
    # image does not already carry. The probe is rare once the stack is up, and every second only
    # while it is coming up, so it costs the measurement nothing.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/_health"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-21-31,85-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - REDIS_URL=redis://127.0.0.1:6379
      - DATASET_PATH=/data/dataset.json
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
    depends_on:
      cache:
        condition: service_healthy
