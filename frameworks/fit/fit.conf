# fit's config for HttpArena, in fit's own .conf format.
#
# Four listeners, each with the protocols its profiles measure. The routes
# name none, so every route is served on all of them.

# Plaintext HTTP/1.1: baseline, pipelined, limited-conn.
listener h1 :8080 http/1.1

# HTTP/1.1 over TLS, ALPN http/1.1 alone: json-tls, static-tls.
listener h1tls :8081 http/1.1 {
	tls /certs/server.crt /certs/server.key
}

# HTTP/2 cleartext, prior knowledge: baseline-h2c, json-h2c.
listener h2c :8082 h2c

# HTTP/2 over TLS through ALPN, HTTP/1.1 for a client that does not choose it,
# and HTTP/3 over QUIC on the same port in UDP: baseline-h2, static-h2,
# baseline-h3, static-h3.
listener secure :8443 http/1.1 h2 h3 {
	tls /certs/server.crt /certs/server.key
}

# The listeners above are the whole of it: no ACME, no redirect listener.
auto_https {
	disable
	disable_redirects
}

# warn and above, so that a benchmark run logs nothing per connection.
log {
	level warn
}

# Every route matches any host.
site * {
	# Pipelined: a fixed "ok".
	route /pipeline {
		handler respond {
			body ok
			headers { Content-Type text/plain }
		}
	}

	# a + b from the query, plus the body on POST: baseline (h1), baseline2 (h2,
	# h2c, h3).
	route /baseline11 /baseline2 {
		handler httparena
	}

	# /json/{count}?m=M, serialized per request by the module.
	route /json/* {
		handler httparena_json
	}

	# Static files from the mounted directory, through fit's static handler: small
	# files from memory, each revalidated against the disk once its check_interval
	# (1s) has passed, and the .br/.gz twin on disk chosen off Accept-Encoding.
	route /static/* {
		handler static {
			root /data/static
			strip_prefix /static
			precompressed br gzip
		}
	}
}
