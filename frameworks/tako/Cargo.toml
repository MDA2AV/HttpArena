[package]
name = "httparena-tako"
version = "0.1.0"
edition = "2024"

[dependencies]
deadpool-postgres = "0.14"
futures-util = "0.3"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tako-rs = { version = "2.4.1", features = ["http2", "http3", "per-thread", "plugins", "tls", "ws"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[profile.release]
codegen-units = 1
lto = "fat"
