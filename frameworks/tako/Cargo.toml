[package]
name = "httparena-tako"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tako-rs = { version = "2.4", features = ["per-thread", "plugins", "tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
