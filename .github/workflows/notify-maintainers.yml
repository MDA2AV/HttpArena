name: Notify Framework Maintainers

on:
  pull_request_target:
    paths:
      - 'frameworks/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    # Opt-out for repo-wide sweeps. A change that touches every entry - renaming a
    # profile, retiring an endpoint - is not news to any single maintainer, and the
    # ping is a notification to dozens of people who have nothing to do.
    #
    # Both forms are checked because they fail differently. The label is the
    # discoverable one and can be added after the fact; the body marker is the one
    # that is guaranteed to be in the payload of the `opened` event, before a label
    # applied by a second API call could race the run that pings everybody.
    #
    # pull_request_target reads this file from the BASE branch, so a PR cannot
    # grant itself the opt-out - it has to already be on main. That is the point.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-maintainer-ping') &&
      !contains(github.event.pull_request.body, '[skip-maintainer-ping]') &&
      !contains(github.event.pull_request.title, '[skip-maintainer-ping]')
    steps:
      # No ref: on pull_request_target the default is the base branch, which is the only side this
      # job needs. It reads meta.json to know who to ping, and that must come from the base anyway.
      - uses: actions/checkout@v5

      - name: Detect changed frameworks and notify maintainers
        run: |
          frameworks=$(gh api \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
            | grep '^frameworks/' \
            | cut -d'/' -f2 \
            | sort -u || true)

          if [ -z "$frameworks" ]; then
            echo "No framework changes detected"
            exit 0
          fi

          mentions=""

          for fw in $frameworks; do
            meta="frameworks/$fw/meta.json"
            if [ ! -f "$meta" ]; then
              continue
            fi

            maintainers=$(jq -r '.maintainers // [] | .[]' "$meta" 2>/dev/null)
            if [ -z "$maintainers" ]; then
              continue
            fi

            display_name=$(jq -r '.display_name // empty' "$meta" 2>/dev/null)
            display_name="${display_name:-$fw}"

            pings=""
            for user in $maintainers; do
              # Strip leading @ if present
              user="${user#@}"
              # Skip the PR author to avoid self-ping
              if [ "$user" != "$PR_AUTHOR" ]; then
                pings="$pings @$user"
              fi
            done

            if [ -n "$pings" ]; then
              mentions="$mentions\n- **$display_name** →$pings"
            fi
          done

          if [ -z "$mentions" ]; then
            echo "No maintainers to notify"
            exit 0
          fi

          body="$(printf "👋 Heads up! This PR modifies the following frameworks:\n$mentions\n")"

          # Check if we already posted a maintainer notification on this PR
          existing=$(gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("👋 Heads up!"))) | .id' \
            | head -1)

          if [ -n "$existing" ]; then
            gh api "/repos/${{ github.repository }}/issues/comments/$existing" \
              -X PATCH -f body="$body"
            echo "Updated existing comment"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
            echo "Posted new comment"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
