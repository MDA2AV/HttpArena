name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/gen_leaderboard_data.py'
      - 'results/**'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate leaderboard data
        run: python3 scripts/gen_leaderboard_data.py

      - name: Assemble site — standalone leaderboard at root
        working-directory: site
        run: |
          rm -rf public && mkdir public
          cp leaderboard/index.html public/index.html
          cp leaderboard/data.js public/data.js
          cp leaderboard/search.js public/search.js                                  # plain-text Knowledge Base index for the board's page search
          cp -r static/logs public/logs                                             # run logs, served at /logs/
          for f in openapi.json openapi-gateway.json; do [ -f "static/$f" ] && cp "static/$f" "public/$f"; done   # OpenAPI specs linked from the docs
          cp -r root/. public/                                                       # 404.html, robots.txt, favicon.ico/.svg, and the /leaderboard/ -> / redirect
          cp -r generated/docs public/docs                                          # pre-rendered Knowledge Base pages (real /docs/<id>/ URLs) + docs.css
          cp generated/sitemap.xml public/sitemap.xml                               # root + every /docs/<id>/ (generated, replaces the old static one)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
