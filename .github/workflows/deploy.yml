name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/gen_new_leaderboard_data.py'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Regenerates site/static/new-leaderboard/{data.js,docs.js} from
      # site/data/*.json and site/content/docs/**. No Hugo involved — the
      # board is a standalone page and the generator does its own markdown
      # + shortcode rendering.
      - name: Generate leaderboard data + docs
        run: python3 scripts/gen_new_leaderboard_data.py

      # site/static/ is served verbatim at the root: logs/, images/,
      # openapi*.json, favicon.svg, and new-leaderboard/ itself (kept so the
      # pre-move URL still serves a working page). The board is then lifted
      # out of new-leaderboard/ to become the root index.
      - name: Assemble site
        working-directory: site
        run: |
          rm -rf public && mkdir public
          cp -r static/. public/
          cp static/new-leaderboard/index.html public/index.html
          cp static/new-leaderboard/data.js   public/data.js
          cp static/new-leaderboard/docs.js   public/docs.js
          cp root/404.html public/404.html   # redirects retired Hugo URLs -> the board

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
