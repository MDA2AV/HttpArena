name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/gen_leaderboard_data.py'
      - 'results/**'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Don't deploy from forks (e.g. when syncing main from upstream). The
    # GitHub Pages deployment isn't available on forks and the run would fail.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap dates each page from the last commit that
      # touched its source, and a shallow clone can only say "today" for
      # everything. Without it the generator drops lastmod rather than guess.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only the og:image cards need it. The generator runs fine without it and
      # simply leaves the cards (and the tags pointing at them) out, so a local
      # run still produces the whole site.
      #
      # continue-on-error keeps that true here: `run:` executes under `bash -e`,
      # so a PyPI hiccup or a runner image that starts enforcing PEP 668
      # (externally-managed-environment) would otherwise fail the job before the
      # generator runs and stop the site updating at all. Losing the cards for
      # one deploy is the smaller failure. Pinned so the deploy job, which holds
      # pages:write and id-token:write, does not pull an unreviewed release.
      - name: Install Pillow (social cards)
        continue-on-error: true
        run: python3 -m pip install --quiet --disable-pip-version-check 'pillow==11.3.0'

      - name: Generate leaderboard data
        run: python3 scripts/gen_leaderboard_data.py

      # The README badges carry a rank computed by a Python port of the board's
      # own scoring. Publishing a badge that disagrees with the page it links to
      # is worse than publishing none, so a drifted port fails the deploy.
      - name: Check badge ranks against the board
        run: node scripts/check_badge_parity.js

      # The layout lives in the script, which publish-genhttp.yml lays out the same site with.
      - name: Assemble site — standalone leaderboard at root
        run: scripts/assemble_site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
